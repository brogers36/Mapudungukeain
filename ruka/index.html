<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5502f">
<meta name="robots" content="noai, noimageai">
<title>Ruka mew | Mapudungun en casa</title>
<meta name="description" content="Frases cortas en mapudungun para la vida diaria en familia: la mañana, la comida, el juego, el cariño y la noche. Gratis y sin internet.">
<link rel="canonical" href="https://brogers36.github.io/Mapudungukeain/ruka/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruka mew">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Ruka mew: warm daylight palette of a ruka (wool, clay, ochre, leaf), distinct from the game's night-blue */
:root{--ground:#f6efe3;--panel:#fffaf1;--panel-2:#e6d8c2;--ink:#2e2118;--muted:#7a6656;--red:#b5502f;--red-soft:#c9633f;--good:#4f7a3e;--gold:#b8801f;--teal:#3f7f74;--ochre:#d9a441;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{height:18px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:
  linear-gradient(45deg,transparent 0 35%,var(--ochre) 35% 65%,transparent 65%) 0 0/18px 18px,
  repeating-linear-gradient(90deg,var(--red) 0 36px,#4f7a3e 36px 72px)}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2rem,8vw,2.6rem);line-height:1.05;color:var(--red)}h2{font-size:1.3rem}
p{margin:0}a{color:var(--red)}button{font-family:var(--body)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1.5px solid var(--panel-2);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;color:var(--muted);font:700 .82rem var(--body);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.sub{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1.5px solid var(--panel-2);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.92rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.chip small{opacity:.7}
.today{background:linear-gradient(160deg,#fff5e2,#f3e2c4);border:2px solid var(--ochre);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.today .lab{color:var(--red);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1.5px solid var(--panel-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 #e9dcc8}
.arn{font-size:1.35rem;font-weight:700;line-height:1.25}
.today .arn{font-size:1.6rem}
.tr{color:var(--muted)}
a.w{color:var(--ink);text-decoration:none;border-bottom:1.5px dotted #b9a68e}a.w:hover{color:var(--red);border-bottom-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.badge{font-size:.74rem;border-radius:999px;padding:2px 9px;font-weight:700;letter-spacing:.02em}
.b-av{background:#dfeccf;color:#3d5f2c}.b-kw{background:#d9e9e6;color:#2e6158}.b-new{background:#f6dcc8;color:#8a3e1f}
.mini{background:var(--panel);border:1.5px solid var(--panel-2);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:.84rem;cursor:pointer}
.mini[aria-pressed="true"]{color:var(--gold);border-color:var(--ochre)}
.ex{background:#f3ead9;border-left:3px solid var(--teal);border-radius:6px;padding:8px 10px;font-size:.92rem}
.ex i{color:var(--muted);font-style:normal}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 1rem var(--body);cursor:pointer}
.btn:hover{background:var(--red-soft)}.btn.ghost{background:transparent;border:2px solid var(--panel-2);color:var(--muted)}
.flash{background:linear-gradient(160deg,#fff5e2,#f3e2c4);border:2px solid var(--ochre);border-radius:16px;padding:22px 18px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.flash .q{font-size:1.4rem;font-weight:700}
.flash .a{font-size:1.7rem;font-weight:700;color:var(--red)}
.prog{color:var(--muted);font-size:.9rem;text-align:center}
.note{color:var(--muted);font-size:.86rem}
.foot{color:var(--muted);font-size:.78rem;border-top:1px solid var(--panel-2);padding-top:12px}
.empty{color:var(--muted);text-align:center;padding:16px}
</style>
</head><body>
<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <div class="seg" role="group" aria-label="Idioma / Language" id="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div>
    <div class="seg" role="group" aria-label="Grafemario" id="graf"><button data-g="uni">Unificado</button><button data-g="azu">Azümchefe</button><button data-g="rag">Ragileo</button></div>
  </div>
  <header><h1>Ruka mew</h1><p class="sub" id="sub"></p></header>
  <section class="today" id="today"></section>
  <div class="chips" role="group" id="cats"></div>
  <div class="row"><p class="note" id="count"></p><button class="btn" id="practice"></button></div>
  <main id="out" class="list"></main>
  <p class="note" id="about"></p>
  <footer class="foot" id="foot"></footer>
</div>
<script src="datos.js"></script>
<script>
/* Ruka mew © 2026 Brandon M. A. Rogers. Phrases are stored in the Unificado and shown in the chosen grafemario;
   the language and grafemario choices are shared with the game (same storage keys). */
(function(){
var $=function(s){return document.querySelector(s);};
function ld(k,d){ try{ var v=localStorage.getItem('mpk_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function sv(k,v){ try{ localStorage.setItem('mpk_'+k, JSON.stringify(v)); }catch(e){} }
var lang=ld('lang','es')==='en'?'en':'es', graf=['uni','azu','rag'].indexOf(ld('graf','uni'))>=0?ld('graf','uni'):'uni';
var favs=ld('rukaFav',{}), known=ld('rukaKnown',{}), cat=ld('rukaCat','todo'), mode='list', deck=[], pos=0, shown=false;
var L=function(es,en){return lang==='en'?en:es;};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var MAP={azu:{ng:'g',g:'q',d:'z',tr:'tx'},rag:{ng:'g',g:'q',d:'z',tr:'x',ch:'c',ll:'j','ü':'v',sh:'s'}};
function G(s){ if(graf==='uni') return s; var m=MAP[graf];
  return String(s).replace(/ng|tr|ch|ll|sh|[gdü]/gi,function(x){ var lo=x.toLowerCase(), r=m[lo]; if(r==null) return x;
    if(x!==lo && x===x.toUpperCase()) return r.toUpperCase(); if(x[0]!==lo[0]) return r[0].toUpperCase()+r.slice(1); return r; }); }
var CATS=[['todo','Todas','All'],['puliwen','Puliwen · la mañana','Puliwen · morning'],['iyael','Iyael · la comida','Iyael · meals'],
  ['tripan','Tripan · salir y llegar','Tripan · going out'],['awkantun','Awkantun · jugar','Awkantun · play'],
  ['poyen','Poyen · cariño y ánimo','Poyen · love and praise'],['pun','Pun · la noche','Pun · night'],['ramtun','Ramtun · preguntas','Ramtun · questions'],
  ['che','Che · la familia','Che · family'],
  ['fav','★ Mis frases','★ My phrases']];
var id=function(f){return f.m;};
function list(){ return FRASES.filter(function(f){ return cat==='todo'||(cat==='fav'?favs[id(f)]:f.c===cat); }); }
/* each Mapudungun word links to its analysis in the dictionary; the phrase is shown in the chosen grafemario,
   the link uses the Unificado form so the dictionary finds it */
function words(m){ var shownS=G(m);
  return m.split(/(\s+)/).map(function(p,i){ var w=p.replace(/^[¿¡"(.]+|[.,;:!?")]+$/g,''); if(!/[a-zA-Zñü]/.test(w)) return esc(G(p));
    var g=G(w); return esc(G(p)).replace(esc(g),'<a class="w" lang="arn" href="../diccionario/#/buscar/'+encodeURIComponent(w.toLowerCase())+'" title="'+L('Ver en el diccionario','See in the dictionary')+'">'+esc(g)+'</a>'); }).join(''); }
function badge(f){ if(f.whole) return '<span class="badge b-av">'+L('Así en AVENUE','As in AVENUE')+'</span>';
  if(f.n) return '<span class="badge b-kw" title="'+esc(f.k)+'">'+L('Palabra clave en AVENUE','Key word in AVENUE')+'</span>';
  return '<span class="badge b-new">'+L('Nueva, por revisar','New, to be checked')+'</span>'; }
var VAR={N:'Nguluche',L:'Lafkenche',P:'Pewenche'};
function card(f,big){ var k=id(f), fav=!!favs[k];
  return '<article class="'+(big?'':'card')+'"><p class="arn" lang="arn">'+words(f.m)+'</p><p class="tr">'+esc(f[lang])+'</p>'+
    '<div class="row"><span>'+badge(f)+'</span><span style="display:flex;gap:6px">'+
    (f.ex?'<button class="mini" data-ex="'+esc(k)+'">'+L('Ejemplo','Example')+'</button>':'')+
    '<button class="mini" data-fav="'+esc(k)+'" aria-pressed="'+fav+'" aria-label="'+L('Guardar en mis frases','Save to my phrases')+'">'+(fav?'★':'☆')+'</button></span></div>'+
    (f.ex?'<div class="ex" data-exbox="'+esc(k)+'" hidden><span lang="arn">«'+esc(f.ex[0])+'»</span><br><i>'+esc(f.ex[1])+' · '+VAR[f.ex[2]]+'</i></div>':'')+'</article>'; }
function dayPick(){ var d=new Date(), n=Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5); return FRASES[(n*7)%FRASES.length]; }
function chrome(){
  document.documentElement.lang=lang;
  document.querySelectorAll('#lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.l===lang); });
  document.querySelectorAll('#graf button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.g===graf); });
  $('#sub').textContent=L('Mapudungun en casa: frases cortas para la vida diaria con niños y familia. Toca una palabra para verla en el diccionario.','Mapudungun at home: short phrases for daily life with children and family. Tap a word to see it in the dictionary.');
  $('#today').innerHTML='<span class="lab">'+L('Frase de hoy','Phrase of the day')+'</span>'+card(dayPick(),true);
  $('#cats').innerHTML=CATS.map(function(c){ var n=c[0]==='todo'?FRASES.length:c[0]==='fav'?Object.keys(favs).length:FRASES.filter(function(f){return f.c===c[0];}).length;
    return '<button class="chip" data-c="'+c[0]+'" aria-pressed="'+(cat===c[0])+'">'+esc(lang==='en'?c[2]:c[1])+' <small>'+n+'</small></button>'; }).join('');
  $('#practice').textContent=mode==='list'?L('Practicar','Practise'):L('Ver la lista','Back to the list');
  $('#about').innerHTML=L('<b>De dónde vienen las frases.</b> Están escritas a partir de la gramática y del vocabulario del juego y del diccionario. Cada una dice qué tan respaldada está: <b>Así en AVENUE</b> (la frase aparece en las conversaciones del corpus AVENUE), <b>Palabra clave en AVENUE</b> (su palabra principal aparece en el corpus) o <b>Nueva, por revisar</b> (formada según la gramática; aún no la ha revisado un hablante). Los ejemplos de AVENUE se muestran con su ortografía original. Todavía no hay audio.',
    '<b>Where the phrases come from.</b> They are written from the grammar and the vocabulary of the game and the dictionary. Each says how well it is supported: <b>As in AVENUE</b> (the phrase occurs in the conversations of the AVENUE corpus), <b>Key word in AVENUE</b> (its main word occurs in the corpus) or <b>New, to be checked</b> (built by the grammar; not yet checked by a speaker). AVENUE examples are shown in their original spelling. There is no audio yet.');
  $('#foot').innerHTML=L('© 2026 Brandon M. A. Rogers. Gratis, y funciona sin internet. Ver también el <a href="../">juego</a> y el <a href="../diccionario/">diccionario</a>. No se permite usar este sitio ni su contenido para entrenar ni alimentar sistemas de inteligencia artificial.',
    '© 2026 Brandon M. A. Rogers. Free, and works offline. See also the <a href="../">game</a> and the <a href="../diccionario/">dictionary</a>. This site and its content may not be used to train or feed artificial intelligence systems.');
  render(); }
function render(){ var out=$('#out'), fs=list();
  if(mode==='list'){
    var k=fs.filter(function(f){return known[id(f)];}).length;
    $('#count').textContent=fs.length?L(fs.length+' frases · ya sabes '+k,fs.length+' phrases · you know '+k):'';
    out.innerHTML=fs.length?fs.map(function(f){return card(f);}).join(''):'<p class="empty">'+L('Todavía no guardas frases. Toca ☆ en una frase para guardarla aquí.','No saved phrases yet. Tap ☆ on a phrase to keep it here.')+'</p>';
  } else {
    if(!deck.length){ out.innerHTML='<p class="empty">'+L('No hay frases en esta lista.','No phrases in this list.')+'</p>'; return; }
    if(pos>=deck.length){ var kn=deck.filter(function(f){return known[id(f)];}).length;
      out.innerHTML='<div class="flash"><p class="q">'+L('¡Kümey! Terminaste.','Kümey! You finished.')+'</p><p class="tr">'+L('Ya sabes '+kn+' de '+deck.length+'.','You know '+kn+' of '+deck.length+'.')+'</p><button class="btn" id="again">'+L('Otra vuelta','Go again')+'</button></div>';
      $('#again').onclick=startPractice; $('#count').textContent=''; return; }
    var f=deck[pos]; $('#count').textContent='';
    out.innerHTML='<div class="flash"><p class="prog">'+(pos+1)+' / '+deck.length+'</p><p class="q">'+esc(f[lang])+'</p>'+
      (shown?'<p class="a" lang="arn">'+esc(G(f.m))+'</p>'+badge(f)+'<div class="row" style="justify-content:center"><button class="btn ghost" id="again1">'+L('Otra vez','Again')+'</button><button class="btn" id="got">'+L('La sé','I know it')+'</button></div>'
        :'<p class="tr">'+L('¿Cómo se dice en mapudungun? Dilo en voz alta y luego mira.','How do you say it in Mapudungun? Say it aloud, then look.')+'</p><button class="btn" id="show">'+L('Ver la respuesta','Show the answer')+'</button>')+'</div>';
    if(shown){ $('#got').onclick=function(){ known[id(f)]=1; sv('rukaKnown',known); pos++; shown=false; render(); };
      $('#again1').onclick=function(){ delete known[id(f)]; sv('rukaKnown',known); deck.push(f); pos++; shown=false; render(); }; }
    else $('#show').onclick=function(){ shown=true; render(); };
  } }
function startPractice(){ mode='practice'; deck=list().slice().sort(function(a,b){ return (known[id(a)]?1:0)-(known[id(b)]?1:0) || Math.random()-.5; }).slice(0,10); pos=0; shown=false; chrome(); }
document.addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.l){ lang=t.dataset.l; sv('lang',lang); chrome(); }
  else if(t.dataset.g){ graf=t.dataset.g; sv('graf',graf); chrome(); }
  else if(t.dataset.c){ cat=t.dataset.c; sv('rukaCat',cat); if(mode==='practice') startPractice(); else chrome(); }
  else if(t.dataset.fav!=null){ var k=t.dataset.fav; if(favs[k]) delete favs[k]; else favs[k]=1; sv('rukaFav',favs); chrome(); }
  else if(t.dataset.ex!=null){ var bx=document.querySelectorAll('[data-exbox]'); for(var i=0;i<bx.length;i++) if(bx[i].dataset.exbox===t.dataset.ex && bx[i].closest('article')===t.closest('article')) bx[i].hidden=!bx[i].hidden; }
  else if(t.id==='practice'){ if(mode==='list') startPractice(); else { mode='list'; chrome(); } } });
if(!CATS.some(function(c){return c[0]===cat;})) cat='todo';
chrome();
if('serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
<script>
/* Visit, install and lesson counts sent to GoatCounter as a 1x1 image request (no cookies, no personal data, no third-party
   script, so script blockers that stop gc.zgo.at don't stop it). Nothing is sent from a file copy or while offline. */
(function(){
  if(location.protocol!=='https:') return;
  var BASE='https://brogers36.goatcounter.com/count';
  function gc(path,title,event){ try{
    var u=BASE+'?p='+encodeURIComponent(path)+'&t='+encodeURIComponent(title||'')+(event?'&e=true':'')+
      (event?'':'&r='+encodeURIComponent(document.referrer||''))+'&s='+encodeURIComponent(screen.width+','+screen.height+','+(window.devicePixelRatio||1))+
      '&rnd='+Math.random().toString(36).slice(2);
    var img=new Image(); img.src=u; }catch(e){} }
  window.mpkCount=function(p,t){ gc(p,t,true); };
  gc(location.pathname||'/', document.title, false);
  window.addEventListener('appinstalled',function(){ gc('app-installed','App installed',true); });
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  var seen=false; try{ seen=sessionStorage.getItem('mpk_gc_launch')==='1'; }catch(e){}
  if(standalone && !seen){ try{ sessionStorage.setItem('mpk_gc_launch','1'); }catch(e){} gc('home-screen-launch','Opened from home screen',true); }
})();
</script>
</body></html>
