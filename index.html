/* Layout: one centered play column on a dark wool ground, framed top and bottom by a stepped-diamond textile band. */

<script>
// ===== Icons =====
// ===== Scenes and objects drawn for the game, instead of emoji that older phones can't show (🛖 🪨 🪵 🦨 🧍 🪁)
//       and so that "in / at a place" pictures show the person in the place =====
const SCN=(()=>{
  const SK="#c98a5a", HAIR="#2a1a10", BODY="#c8322f", LIMB="#f3efe6";
  const W=inner=>`<svg viewBox="0 0 100 60" width="2.3em" height="1.4em" aria-hidden="true"><g stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
  /* a standing person, feet at (x,y), about 30 tall; k scales */
  const man=(x,y,k=1)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-3 0 L-1 -12 M3 0 L1 -12" stroke="${LIMB}" stroke-width="3"/><path d="M0 -12 V-23" stroke="${BODY}" stroke-width="6.5"/><path d="M-3 -21 L-7 -12 M3 -21 L7 -12" stroke="${LIMB}" stroke-width="2.6"/><circle cx="0" cy="-28" r="4.6" fill="${SK}"/><path d="M-4.6 -29 Q0 -35 4.6 -29" fill="${HAIR}"/></g>`;
  const ruka=(x,y,k=1,door=true)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-36 0 Q-36 -36 0 -40 Q36 -36 36 0Z" fill="#c9a25a"/>${[-30,-22,-14].map((d,i)=>`<path d="M${-34+i*3} ${d} Q0 ${d-12+i*2} ${34-i*3} ${d}" stroke="#a07a3a" stroke-width="1.6" fill="none"/>`).join("")}<path d="M-4 -40 Q0 -46 4 -40" stroke="#8a6a3a" stroke-width="2" fill="none"/>${door?`<path d="M-8 0 V-14 Q0 -21 8 -14 V0Z" fill="#2a1a10"/>`:""}</g>`;
  const pine=(x,y,k=1,c="#2b5f3a")=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-2" y="-8" width="4" height="8" fill="#6a4a2a"/><path d="M0 -38 L-11 -18 H-6 L-14 -6 H14 L6 -18 H11Z" fill="${c}"/></g>`;
  const fire=(x,y,k=1)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-10 0 L10 -4 M-10 -4 L10 0" stroke="#7a4a2a" stroke-width="3.5"/><path d="M0 -26 C8 -16 10 -10 6 -4 C3 0 -3 0 -6 -4 C-10 -10 -6 -16 -2 -18 C-2 -12 2 -12 0 -26Z" fill="#e8642f"/><path d="M0 -14 C4 -9 4 -6 2 -4 C0 -2 -2 -3 -3 -5 C-4 -8 -1 -10 0 -14Z" fill="#f6d04a"/></g>`;
  const ground=(c="#8a7a5a")=>`<path d="M2 56.5 H98" stroke="${c}" stroke-width="2"/>`;
  /* framed picture clipped to its frame, for drawings that would spill over the edge */
  const WC=(id,inner)=>`<svg viewBox="0 0 100 60" width="2.3em" height="1.4em" aria-hidden="true"><defs><clipPath id="sc-${id}"><rect x="2" y="2" width="96" height="56" rx="6"/></clipPath></defs><g stroke-linecap="round" stroke-linejoin="round" clip-path="url(#sc-${id})">${inner}</g></svg>`;
  /* tree by season: w winter (bare, snow), p spring (blossom), s summer (full green), a autumn (orange) */
  const TREE=(x,y,k,se)=>{const crown={p:"#5fae6a",s:"#2f8a4a",g:"#2f8a4a",a:"#d8782a"}[se];
    let g=`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-3 0 L-2 -20 L2 -20 L3 0Z" fill="#7a4a2a"/>`;
    if(se==="w") g+=`<path d="M0 -18 L-12 -32 M0 -20 L10 -34 M-6 -25 L-12 -24 M5 -27 L13 -26 M0 -22 V-38" stroke="#7a4a2a" stroke-width="2.4" fill="none"/><path d="M-14 -32 q2 -2 4 0 M8 -34 q3 -2 5 0 M-3 -38 q3 -2 6 0" stroke="#fff" stroke-width="2"/>`;
    else g+=`<circle cx="0" cy="-30" r="14" fill="${crown}"/><circle cx="-10" cy="-22" r="9" fill="${crown}"/><circle cx="10" cy="-22" r="9" fill="${crown}"/>`;
    if(se==="p") g+=[[-8,-34],[4,-38],[9,-26],[-11,-22],[0,-26],[6,-32]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="2.6" fill="#f6c3d6"/><circle cx="${a}" cy="${b}" r="1" fill="#f6d04a"/>`).join("");
    if(se==="g") g+=`<circle cx="-5" cy="-36" r="5" fill="#4fae6a"/><circle cx="7" cy="-28" r="4" fill="#4fae6a"/>`;
    if(se==="s") g+=[[-6,-32],[6,-26],[-2,-22]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="2.4" fill="#c8322f"/>`).join("");
    if(se==="a") g+=[[-8,-32,"#b8402a"],[6,-36,"#e8a43a"],[10,-24,"#b8402a"],[-10,-20,"#e8a43a"]].map(([a,b,c])=>`<circle cx="${a}" cy="${b}" r="4" fill="${c}"/>`).join("");
    return g+`</g>`; };
  const FLAKES=[[12,12],[26,24],[72,10],[86,24],[40,8],[62,22],[16,36],[84,40]].map(([x,y])=>`<g stroke="#fff" stroke-width="1.2" transform="translate(${x} ${y})"><path d="M-2.6 0 H2.6 M-1.3 -2.2 L1.3 2.2 M-1.3 2.2 L1.3 -2.2"/></g>`).join("");

// ===== Kalül: a face close-up (or a large hand/foot) with the named part ringed and pointed at =====
const KAL=(()=>{
  const SK="#c98a5a", SKL="#dda57a", SKD="#a96e44", OUT="#7a4c2c", HAIR="#22160e", GOLD="#e8b53a", BG="#2c3150", RED="#c8322f";
  /* every picture is clipped to its rounded frame; outlines come from drawing the same shapes twice (dark and wider, then skin) */
  const W=(id,inner)=>`<svg viewBox="0 0 100 60" width="2.3em" height="1.4em" aria-hidden="true"><defs><clipPath id="kc-${id}"><rect x="2" y="2" width="96" height="56" rx="6"/></clipPath></defs><g stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="96" height="56" rx="6" fill="${BG}"/><g clip-path="url(#kc-${id})">${inner}</g></g></svg>`;
  const solid=(shapes,fill)=>`<g fill="${OUT}" stroke="${OUT}" stroke-width="2.4">${shapes}</g><g fill="${fill}">${shapes}</g>`;
  const point=(x,y,rx,ry,ty)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${GOLD}" stroke-width="2" stroke-dasharray="3.5 2.5"/><path d="M95 ${ty} H${x+rx+5}" stroke="${GOLD}" stroke-width="3"/><path d="M${x+rx+11} ${ty-5} L${x+rx+5} ${ty} L${x+rx+11} ${ty+5}" stroke="${GOLD}" stroke-width="3" fill="none"/>`;
  /* face: centre (40,30), head 16 x 19 */
  const X=40, Y=30;
  const face=(o={})=>{ const Yh=Y+(o.dy||0);
    let g=`<path d="M${X-24} 60 Q${X-22} ${Y+18} ${X} ${Y+17} Q${X+22} ${Y+18} ${X+24} 60Z" fill="${RED}"/><path d="M${X-24} 60 Q${X-22} ${Y+18} ${X} ${Y+17} Q${X+22} ${Y+18} ${X+24} 60" stroke="#9e2422" stroke-width="1.2" fill="none"/>`;
    g+=`<path d="M${X-5} ${Y+17.5} L${X} ${Y+24} L${X+5} ${Y+17.5}" fill="${SKD}"/>`;
    g+=solid(`<rect x="${X-5}" y="${Yh+10}" width="10" height="${Y+19-(Yh+10)}" rx="3"/>`,SKD);
    /* braids behind the shoulders */
    g+=`<path d="M${X-15} ${Yh-6} Q${X-20} ${Yh+8} ${X-17} ${Yh+24} M${X+15} ${Yh-6} Q${X+20} ${Yh+8} ${X+17} ${Yh+24}" stroke="${HAIR}" stroke-width="7" fill="none"/>`;
    g+=[[X-17,Y+12],[X-17.6,Y+18],[X+17,Y+12],[X+17.6,Y+18]].map(([a,b])=>`<path d="M${a-3} ${b} q3 2 6 0" stroke="#3a2a1e" stroke-width="1" fill="none"/>`).join("");
    /* ears, head */
    g+=solid(`<ellipse cx="${X-16}" cy="${Yh+1}" rx="3.6" ry="5.4"/><ellipse cx="${X+16}" cy="${Yh+1}" rx="3.6" ry="5.4"/><ellipse cx="${X}" cy="${Yh}" rx="16" ry="19"/>`,SK);
    g+=`<path d="M${X-16.6} ${Yh-1} q-1.6 2.4 0 4.8 M${X+16.6} ${Yh-1} q1.6 2.4 0 4.8" stroke="${SKD}" stroke-width="1.2" fill="none"/>`;
    /* hair cap with a centre parting, and the trarilonko */
    g+=`<path d="M${X-16.4} ${Yh-2} C${X-17} ${Yh-16} ${X-8} ${Yh-20} ${X} ${Yh-20} C${X+8} ${Yh-20} ${X+17} ${Yh-16} ${X+16.4} ${Yh-2} C${X+14} ${Yh-10} ${X+7} ${Yh-12} ${X} ${Yh-11} C${X-7} ${Yh-12} ${X-14} ${Yh-10} ${X-16.4} ${Yh-2}Z" fill="${HAIR}"/>`;
    if(!o.noband) g+=`<path d="M${X-15.8} ${Yh-9} Q${X} ${Yh-12.4} ${X+15.8} ${Yh-9}" stroke="#ece7dc" stroke-width="3.4" fill="none"/><path d="M${X-15.8} ${Yh-9} Q${X} ${Yh-12.4} ${X+15.8} ${Yh-9}" stroke="${RED}" stroke-width=".9" stroke-dasharray="1.4 2" fill="none"/><circle cx="${X}" cy="${Yh-10.8}" r="2.5" fill="#d6d9e0" stroke="#9aa0ad" stroke-width=".6"/>`;
    /* brows, eyes, cheeks */
    for(const sx of [-1,1]){ const ex=X+sx*6.4, ey=Yh-1;
      g+=`<path d="M${ex-3.6} ${ey-4.2} Q${ex} ${ey-6} ${ex+3.6} ${ey-4.4}" stroke="${HAIR}" stroke-width="1.3" fill="none"/>`;
      g+=`<path d="M${ex-3.8} ${ey} Q${ex} ${ey-3.2} ${ex+3.8} ${ey} Q${ex} ${ey+2.6} ${ex-3.8} ${ey}Z" fill="#fbf8f2" stroke="${OUT}" stroke-width=".6"/><circle cx="${ex}" cy="${ey-.2}" r="1.9" fill="#5a3418"/><circle cx="${ex}" cy="${ey-.2}" r=".9" fill="#120a06"/><circle cx="${ex+.6}" cy="${ey-.9}" r=".45" fill="#fff"/>`;
      g+=`<ellipse cx="${X+sx*9.4}" cy="${Yh+6}" rx="3" ry="1.8" fill="#d97a6a" opacity=".45"/>`; }
    /* nose */
    g+=`<path d="M${X-.6} ${Yh+1} Q${X-1.6} ${Yh+5} ${X-2.4} ${Yh+6.6}" stroke="${SKD}" stroke-width="1.1" fill="none"/><path d="M${X-3.4} ${Yh+7.4} Q${X-2.4} ${Yh+8.8} ${X-.8} ${Yh+8} M${X+.8} ${Yh+8} Q${X+2.4} ${Yh+8.8} ${X+3.4} ${Yh+7.4}" stroke="${SKD}" stroke-width="1" fill="none"/><path d="M${X-1.8} ${Yh+5.2} Q${X} ${Yh+7.6} ${X+1.8} ${Yh+5.2}" fill="${SKL}" opacity=".6"/>`;
    /* mouth */
    if(o.tongue) g+=`<path d="M${X-6} ${Yh+11.6} Q${X} ${Yh+17} ${X+6} ${Yh+11.6} Q${X} ${Yh+12.8} ${X-6} ${Yh+11.6}Z" fill="#6a1a14"/><path d="M${X-4} ${Yh+12.6} Q${X-4.4} ${Yh+21} ${X} ${Yh+21} Q${X+4.4} ${Yh+21} ${X+4} ${Yh+12.6}Z" fill="#e0707a" stroke="#a8423a" stroke-width=".8"/><path d="M${X} ${Yh+14} V${Yh+19}" stroke="#b8505a" stroke-width=".8"/>`;
    else g+= o.teeth
      ? `<path d="M${X-6.4} ${Yh+11.4} Q${X} ${Yh+19} ${X+6.4} ${Yh+11.4} Q${X} ${Yh+12.6} ${X-6.4} ${Yh+11.4}Z" fill="#6a1a14"/><path d="M${X-5.4} ${Yh+12.1} Q${X} ${Yh+13} ${X+5.4} ${Yh+12.1} L${X+4.6} ${Yh+14.2} Q${X} ${Yh+15} ${X-4.6} ${Yh+14.2}Z" fill="#fbf8f2"/><path d="M${X-2.7} ${Yh+12.5} V${Yh+14.6} M${X} ${Yh+12.7} V${Yh+14.9} M${X+2.7} ${Yh+12.5} V${Yh+14.6}" stroke="#d8d2c4" stroke-width=".6"/><path d="M${X-6.4} ${Yh+11.4} Q${X} ${Yh+12.6} ${X+6.4} ${Yh+11.4}" stroke="#8a3a30" stroke-width=".9" fill="none"/>`
      : `<path d="M${X-5.4} ${Yh+12} Q${X-2} ${Yh+10.6} ${X} ${Yh+11.4} Q${X+2} ${Yh+10.6} ${X+5.4} ${Yh+12} Q${X} ${Yh+13} ${X-5.4} ${Yh+12}Z" fill="#a8423a"/><path d="M${X-5.4} ${Yh+12} Q${X} ${Yh+16.4} ${X+5.4} ${Yh+12} Q${X} ${Yh+13} ${X-5.4} ${Yh+12}Z" fill="#b8564a"/><path d="M${X-5.4} ${Yh+12} Q${X} ${Yh+13} ${X+5.4} ${Yh+12}" stroke="#7a2a20" stroke-width=".8" fill="none"/>`;
    return g; };
  /* hand: palm and four fingers fanned, thumb to the side, nails, creases, a woven cuff at the wrist */
  const fingers=[[-8.4,-27,5.2,24,-8],[-2.8,-30,5.4,27,-2.5],[2.8,-28.6,5.2,26,3],[8.2,-23,4.6,20,10]];
  const handShapes=`<path d="M-12 14 C-14 6 -14 -2 -11 -6 L11 -6 C14 -2 14 6 12 14Z"/>${fingers.map(([x,y,w,h,r])=>`<rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="${w/2}" transform="rotate(${r} ${x} ${y+h})"/>`).join("")}<rect x="-3.4" y="-20" width="6.8" height="22" rx="3.4" transform="translate(-10.4 9) rotate(-42)"/>`;
  const hand=`<g transform="translate(48 34) scale(.86)">${solid(handShapes,SK)}${fingers.map(([x,y,w,h,r])=>`<rect x="${x-w*.32}" y="${y+1}" width="${w*.64}" height="${w*.7}" rx="${w*.3}" fill="${SKL}" transform="rotate(${r} ${x} ${y+h})"/>`).join("")}<path d="M-8 2 Q0 -1 9 1 M-7 7 Q-1 4 6 5 M-2 12 Q-6 6 -6 -2" stroke="${SKD}" stroke-width="1" fill="none"/><path d="M-14 14 H14 V26 H-14Z" fill="${RED}"/><path d="M-14 17 H14" stroke="${GOLD}" stroke-width="2"/><path d="M-14 17 H14" stroke="${RED}" stroke-width=".8" stroke-dasharray="1.6 2"/></g>`;
  /* foot seen from above: heel, ball, five separate toes with nails (big toe largest) */
  const TOES=[[39.6,10.4,4.1,5.4],[47.2,7.6,2.8,3.8],[53.4,8.4,2.5,3.4],[58.8,10.8,2.2,3],[63.2,14.6,1.9,2.5]];
  const footShape=`<path d="M49 56 C41.6 56 39.4 49.6 40.2 42.4 C41 35 37 29.4 37 23.4 C37 17 43 14.6 50 14.8 C57.2 15 63.4 17.2 63.2 23.2 C63 28.4 60.2 32.4 59.4 38.6 C58.4 46.6 56.6 56 49 56Z"/>${TOES.map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`).join("")}`;
  const foot=`<g transform="translate(6.5 7.4) scale(.86)"><ellipse cx="50" cy="56" rx="14" ry="2.2" fill="#000" opacity=".22"/>${solid(footShape,SK)}${TOES.map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y-ry*.38}" rx="${rx*.62}" ry="${ry*.42}" fill="${SKL}" stroke="${SKD}" stroke-width=".5"/>`).join("")}<path d="M38.4 18.6 Q50 15.6 62.6 19.4" stroke="${SKD}" stroke-width=".9" fill="none" opacity=".7"/><path d="M57.6 30 Q55 40 56 48" stroke="${SKD}" stroke-width=".9" fill="none" opacity=".55"/><path d="M42 30 Q44 38 43 44" stroke="${SKL}" stroke-width="1.6" fill="none" opacity=".8"/></g>`;
  const bone=`<g transform="translate(80 44) rotate(-28)"><g fill="#b8ae96" stroke="#b8ae96" stroke-width="1.6"><rect x="-10" y="-2" width="20" height="4"/>${[[-10,-2.8],[-10,2.8],[10,-2.8],[10,2.8]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2"/>`).join("")}</g><g fill="#f3ecdc"><rect x="-10" y="-2" width="20" height="4"/>${[[-10,-2.8],[-10,2.8],[10,-2.8],[10,2.8]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2"/>`).join("")}</g></g>`;
  return {
    nge:W("nge",face()+point(X+6.4,Y-1,6,4.6,Y-1)),
    pilun:W("pilun",face()+point(X+16,Y+1,5.2,7.4,Y+1)),
    yu:W("yu",face()+point(X,Y+5,5,5.4,Y+5)),
    wun:W("wun",face()+point(X,Y+12.4,8.4,4.4,Y+12.4)),
    kug:W("kug",hand+`<ellipse cx="47" cy="30" rx="19" ry="25" fill="none" stroke="${GOLD}" stroke-width="2" stroke-dasharray="3.5 2.5"/>`),
    namun:W("namun",foot+`<ellipse cx="50" cy="31" rx="22" ry="26" fill="none" stroke="${GOLD}" stroke-width="2" stroke-dasharray="3.5 2.5"/>`),
    foro:W("foro",face({teeth:true})+`<ellipse cx="${X}" cy="${Y+13.6}" rx="8" ry="3.8" fill="none" stroke="${GOLD}" stroke-width="2" stroke-dasharray="3.5 2.5"/>`+bone)
    ,_:{W,face,point,hand,X,Y,GOLD,SK,SKD,SKL,OUT,solid}

// ===== Kalül III (more of the body) and Kalül IV (inside the body): same style as Kalül, the named part ringed =====
const KAL3=(()=>{
  const {W,face,point,hand,X,Y,GOLD,SK,SKD,SKL,OUT,solid}=KAL._;
  const ring=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${GOLD}" stroke-width="2" stroke-dasharray="3.5 2.5"/>`;
  /* a whole person, front view, filling the frame */

const PERS = {es:["yo","tú","él/ella"], en:["I","you","she/he"]};
const VERBS = [
  {s:"amu",v:1,es:{p:["voy","vas","va"],pt:["fui","fuiste","fue"],f:["iré","irás","irá"]},en:["go","goes","went"]},

  {s:"umawtu",v:1,es:{p:["duermo","duermes","duerme"],pt:["dormí","dormiste","durmió"],f:["dormiré","dormirás","dormirá"]},en:["sleep","sleeps","slept"]},

  {s:"püru",v:1,es:{p:["bailo","bailas","baila"],pt:["bailé","bailaste","bailó"],f:["bailaré","bailarás","bailará"]},en:["dance","dances","danced"]},

  {s:"küpa",v:1,es:{p:["vengo","vienes","viene"],pt:["vine","viniste","vino"],f:["vendré","vendrás","vendrá"]},en:["come","comes","came"]}
];
const SUF = {pres:v=>v?["n","ymi","y"]:["ün","imi","i"], neg:()=>["lan","laymi","lay"], fut:()=>["an","aymi","ay"]};
// v:2 marks the root i- 'eat' (vowel stem, per the parser lexicon); it conjugates like a vowel stem
// Without -a- (future) the form is present or past, so pres and neg show both (analyst ruling 2026-11-07: amun 'voy / fui')
function vform(vb,tense,p){
  /* future after an a-final root: an epenthetic y often comes between the two a (küpa-ya-n); it is not categorical,
     so both forms are shown (analyst, 2026-11-10) */
  const sf = SUF[tense](vb.v)[p];
  const m = (tense==="fut" && /a$/.test(vb.s)) ? `${vb.s}${sf} ~ ${vb.s}y${sf}` : vb.s + sf;
  const pe = PERS.es[p], pn = PERS.en[p];
  const es = tense==="fut" ? `${pe} ${vb.es.f[p]}` : tense==="neg" ? `${pe} no ${vb.es.p[p]} / no ${vb.es.pt[p]}` : `${pe} ${vb.es.p[p]} / ${vb.es.pt[p]}`;
  const en = tense==="fut" ? `${pn} will ${vb.en[0]}` :
             tense==="neg" ? (p===2?`${pn} doesn't / didn't ${vb.en[0]}`:`${pn} don't / didn't ${vb.en[0]}`) :
             (p===2?`${pn} ${vb.en[1]} / ${vb.en[2]}`:`${pn} ${vb.en[0]} / ${vb.en[2]}`);
  return {m,es,en};
}
function genVerbs(tenses,n){
  const out=[], seen=new Set();
  while(out.length<n){
    const vb=VERBS[Math.floor(Math.random()*VERBS.length)];
    const tense=tenses[Math.floor(Math.random()*tenses.length)];
    const p=Math.floor(Math.random()*3);
    const key=vb.s+tense+p; if(seen.has(key)) continue; seen.add(key);
    const w=vform(vb,tense,p);
    // distractors: same verb, other persons/tenses; fill from another verb if needed
    const pool=[];
    const tset=[...new Set([...tenses,"pres"])];
    tset.forEach(tt=>[0,1,2].forEach(pp=>{if(!(tt===tense&&pp===p))pool.push(vform(vb,tt,pp))}));
    let dist=shuffle(pool).slice(0,3);
    while(dist.length<3){const ov=VERBS.find(x=>x!==vb&&!dist.some(d=>d.m.startsWith(x.s)));dist.push(vform(ov,tense,p))}
    w.dist=dist; out.push(w);
  }
  return out;
}

// Glosses follow Smeets (2008: 14.3, 32.1-32.5) and Zúñiga (2006: 92-93, 255-258); nga's reportative/closing uses are from the AVENUE corpus (Ready & Rogers).
// Example sources: S = Smeets, Z = Zúñiga, H = Harmelink via Zúñiga, A = AVENUE corpus.
const DM=[
 {m:"nga",es:"recuerda algo pasado, a menudo con pena; también afirma, cierra la idea o marca lo que alguien dijo",en:"recalls something past, often with sorrow; also affirms, closes a point or marks what someone said"},

const DM_S=[

function dmFill(x){ return {m:x.a,es:x.es,en:x.en,oneWay:true,
  prompt:()=>`<span class="big" style="font-size:1.5rem">${esc(G(x.s))}</span><div class="scene">${esc(gl(x))}</div>`,
  dist:shuffle(DM.filter(d=>d.m!==x.a)).slice(0,3).map(d=>({m:d.m,es:d.es,en:d.en}))}; }
function genDm(n){
  const f=shuffle(DM_S).slice(0,Math.ceil(n/2)).map(dmFill);
  const g=shuffle(DM).slice(0,n-f.length).map(d=>({m:d.m,es:d.es,en:d.en,oneWay:true,dist:shuffle(DM.filter(x=>x!==d)).slice(0,3).map(x=>({m:x.m,es:x.es,en:x.en}))}));
  return shuffle(f.concat(g)); }
function genRke(n){ return shuffle(RKE).slice(0,n).map(r=>({...rkeForm(r.m),dist:r.d.map(rkeForm)})); }

// ===== Possession: ñi, mi, iñ, mu, fey ñi =====
const POS_N=[{m:"ruka",es:"casa",en:"house",f:1},{m:"trewa",es:"perro",en:"dog",f:0},{m:"ñuke",es:"madre",en:"mother",f:1},
  {m:"kawellu",es:"caballo",en:"horse",f:0},{m:"lamngen",es:"hermana",en:"sister",f:1},{m:"chaw",es:"padre",en:"father",f:0}];
const POS_P=[
  {p:"ñi",amb:1,es:n=>`mi ${n.es}, o su ${n.es} (de él, de ella o de ellos)`,en:n=>`my ${n.en}, or his/her/their ${n.en}`},
  {p:"inche ñi",es:n=>`mi ${n.es} (la mía, sin duda)`.replace("la mía",n.f?"la mía":"el mío"),en:n=>`my ${n.en} (clearly mine)`},
  {p:"fey ñi",es:n=>`su ${n.es} (la de él o de ella)`.replace("la de",n.f?"la de":"el de"),en:n=>`his or her ${n.en}`},
  {p:"fey engün ñi",es:n=>`su ${n.es} (la de ellos)`.replace("la de",n.f?"la de":"el de"),en:n=>`their ${n.en}`},
  {p:"mi",es:n=>`tu ${n.es}`,en:n=>`your ${n.en}`},
  {p:"iñ",es:n=>`${n.f?"nuestra":"nuestro"} ${n.es}`,en:n=>`our ${n.en}`},
  {p:"mu",es:n=>`${n.f?"la":"el"} ${n.es} de ustedes`,en:n=>`your (pl.) ${n.en}`}];
const posForm=(n,k)=>({m:`${POS_P[k].p} ${n.m}`,es:POS_P[k].es(n),en:POS_P[k].en(n)});
// bare ñi is ambiguous, so it never appears as an option next to a form it could also mean
const posClash=(a,b)=>/ñi$/.test(POS_P[a].p)&&/ñi$/.test(POS_P[b].p)&&(POS_P[a].amb||POS_P[b].amb);
function genPos(n){ const out=[],seen=new Set();
  while(out.length<n){ const nn=POS_N[Math.floor(Math.random()*POS_N.length)], k=Math.floor(Math.random()*POS_P.length);
    if(seen.has(nn.m+k)) continue; seen.add(nn.m+k);
    const pick=[k]; for(const j of shuffle(POS_P.map((_,j)=>j))){ if(pick.length===4) break; if(!pick.includes(j)&&!pick.some(x=>posClash(x,j))) pick.push(j); }
    out.push({...posForm(nn,k),dist:pick.slice(1).map(j=>posForm(nn,j))}); }
  return out; }

// ===== Imperative: -nge (2sg), -chi (1sg), -pe (3) =====
const IMP_VERBS=[
  {s:"amu",es:["ve","vaya"],en:"go"},{s:"küpa",es:["ven","venga"],en:"come"},
  {s:"dungu",es:["habla","hable"],en:"speak"},{s:"pütoko",es:["bebe","beba"],en:"drink"},
  {s:"i",es:["come","coma"],en:"eat"},{s:"kintu",es:["busca","busque"],en:"look for it"}
];
function impForm(vb,k){
  const m=vb.s+["nge","chi","pe"][k];
  const es=[`¡${vb.es[0]}! (tú)`,`que yo ${vb.es[1]}`,`que él/ella ${vb.es[1]}`][k];
  const en=[`${vb.en}! (you)`,`let me ${vb.en}`,`let her/him ${vb.en}`][k];
  return {m,es,en};
}
function genImp(n){
  const out=[],seen=new Set();
  while(out.length<n){
    const vb=IMP_VERBS[Math.floor(Math.random()*IMP_VERBS.length)], k=Math.floor(Math.random()*3);
    if(seen.has(vb.s+k))continue; seen.add(vb.s+k);
    const w=impForm(vb,k);
    const sg=VERBS.find(v=>v.s===vb.s);
    w.dist=[...[0,1,2].filter(x=>x!==k).map(x=>impForm(vb,x)), sg?vform(sg,"pres",k===1?0:k===0?1:2):impForm(vb,(k+1)%3)];
    out.push(w);
  }
  return out;
}

function invForms(vb){
  return [
    {m:vb.s+"enew",es:vb.inv.es[0],en:vb.inv.en[0]},
    {m:vb.s+"eymew",es:vb.inv.es[1],en:vb.inv.en[1]},
    {m:vb.s+"fiñ",es:vb.fi.es[0],en:vb.fi.en[0]},
    {m:vb.s+"fi",es:vb.fi.es[1],en:vb.fi.en[1]}];
}
function genInv(n){
  const pool=INV_VERBS.flatMap(vb=>{const f=invForms(vb);return [0,1].map(i=>({...f[i],dist:f.filter((_,j)=>j!==i)}))});
  return shuffle(pool).slice(0,n);
}

}
function segWrong(c,n){

  const cuts=[];let k=0;c.seg.slice(0,-1).forEach(x=>{k+=x.length;cuts.push(k)});

}

// ===== Person pictures for the pronoun lesson =====
// Person pictures: S = speaker (red, speech bubble), L = listener (blue), O = other (green). Ringed = included in the pronoun.
const PERS_PIC=(()=>{
  /* the same drawn figure as the action pictures, facing front; shirt colour = role (red speaker, blue addressee, green other) */
  const COL={S:"#c8322f",L:"#2f5fd0",O:"#3d8a52"}, GOLD="#e8b53a";
  const person=(x,r,k)=>`<g transform="translate(${x} 57) scale(${k}) translate(${-x} -57)">${POSE.fig({h:[x,13],n:[x,21],hp:[x,37],e1:[x-6,29],h1:[x-7,37],e2:[x+6,29],h2:[x+7,37],k1:[x-3,47],f1:[x-3.4,56.5],k2:[x+3,47],f2:[x+3.4,56.5],dir:0,shirt:COL[r],face:r==="S"?"open":"smile"})}</g>`;
  const bubble=x=>`<path d="M${x+4} 1 h15 q3 0 3 3 v6 q0 3 -3 3 h-9 l-4 4 l1 -4 h-3 q-3 0 -3 -3 v-6 q0 -3 3 -3Z" fill="#f3efe6"/><path d="M${x+6} 6 h11 M${x+6} 9.5 h7" stroke="#2a2652" stroke-width="1.3"/>`;
  return spec=>{ // spec like "S*|L|O" ; * = included
    const items=spec.split("|"), n=items.length, gap=100/(n+1), k=n>3?.74:.84; let svg="", ring=[];
    items.forEach((it,i)=>{ const x=Math.round(gap*(i+1)); const r=it[0]; svg+=person(x,r,k); if(r==="S") svg+=bubble(x); if(it.includes("*")) ring.push(x); });
    const half=n>3?10:11, rx=Math.min(...ring)-half, rw=Math.max(...ring)-Math.min(...ring)+half*2;
    const frame=`<rect x="${rx}" y="14" width="${rw}" height="45" rx="7" fill="${GOLD}" fill-opacity=".12" stroke="${GOLD}" stroke-width="2" stroke-dasharray="4 2.5"/>`;
    return `<svg viewBox="0 0 100 60" width="2.3em" height="1.4em" aria-hidden="true"><g stroke-linecap="round" stroke-linejoin="round">${frame}${svg}</g></svg>`; };
})();

// ===== Full person paradigm (lesson after the pronouns) =====
const CONJ_PRON=["inche","eymi","fey","inchiw","eymu","fey engu","inchiñ","eymün","fey engün"];
const CONJ_ES=["yo","tú","él/ella","nosotros dos","ustedes dos","ellos dos","nosotros","ustedes","ellos"];
const CONJ_EN=["I","you","she/he","we two","you two","they two","we","you all","they"];
const CONJ_V=["n","ymi","y","yu","ymu","yngu","iñ","ymün","yngün"], CONJ_C=["ün","imi","i","iyu","imu","ingu","iñ","imün","ingün"];
const CONJ_VERBS=[
  {s:"amu",v:1,es:["voy","vas","va","vamos","van","van"],pt:["fui","fuiste","fue","fuimos","fueron","fueron"],en:["go","goes","went"]},
  {s:"küpa",v:1,es:["vengo","vienes","viene","venimos","vienen","vienen"],pt:["vine","viniste","vino","vinimos","vinieron","vinieron"],en:["come","comes","came"]},
  {s:"awkantu",v:1,es:["juego","juegas","juega","jugamos","juegan","juegan"],pt:["jugué","jugaste","jugó","jugamos","jugaron","jugaron"],en:["play","plays","played"]},
  {s:"ülkantu",v:1,es:["canto","cantas","canta","cantamos","cantan","cantan"],pt:["canté","cantaste","cantó","cantamos","cantaron","cantaron"],en:["sing","sings","sang"]},
  {s:"küdaw",v:0,es:["trabajo","trabajas","trabaja","trabajamos","trabajan","trabajan"],pt:["trabajé","trabajaste","trabajó","trabajamos","trabajaron","trabajaron"],en:["work","works","worked"]},
  {s:"kon",v:0,es:["entro","entras","entra","entramos","entran","entran"],pt:["entré","entraste","entró","entramos","entraron","entraron"],en:["go in","goes in","went in"]}];
/* no -a- (future): present or past (analyst ruling 2026-11-07); a form that is the same in both (jugamos) is shown once */
function conjEs(vb,j){ const a=vb.es[j], b=vb.pt[j]; return a===b?a:`${a} / ${b}`; }
const CONJ_ESI=[0,1,2,3,4,5,3,4,5];
function conjForm(vb,i){ return {m:`${CONJ_PRON[i]} ${vb.s}${(vb.v?CONJ_V:CONJ_C)[i]}`, es:`${CONJ_ES[i]} ${conjEs(vb,CONJ_ESI[i])}`, en:`${CONJ_EN[i]} ${vb.en[i===2?1:0]} / ${vb.en[2]}`}; }
function genConj(n){ const out=[],seen=new Set();
  while(out.length<n){ const vb=CONJ_VERBS[Math.floor(Math.random()*CONJ_VERBS.length)], i=Math.floor(Math.random()*9);
    if(seen.has(vb.s+i)) continue; seen.add(vb.s+i);
    out.push({...conjForm(vb,i),dist:shuffle([0,1,2,3,4,5,6,7,8].filter(x=>x!==i)).slice(0,3).map(x=>conjForm(vb,x))}); }
  return out; }

    rule:{es:"La terminación del verbo dice quién hace la acción, y cambia con cada pronombre. Si la raíz termina en vocal (<b>amu-</b>): <b>-n</b> (inche), <b>-ymi</b> (eymi), <b>-y</b> (fey), <b>-yu</b> (inchiw), <b>-ymu</b> (eymu), <b>-yngu</b> (fey engu), <b>-iñ</b> (inchiñ), <b>-ymün</b> (eymün), <b>-yngün</b> (fey engün). Si termina en consonante (<b>küdaw-</b>), la <b>y</b> pasa a <b>i</b> y <b>-n</b> pasa a <b>-ün</b>: <b>küdaw-ün</b>, <b>küdaw-imi</b>, <b>küdaw-i</b>, <b>küdaw-iyu</b>… Sin otro sufijo, la forma puede ser presente o pasado: <b>amun</b> “voy” o “fui”. El pronombre se puede omitir, porque la terminación ya lo dice.",
          en:"The verb ending says who does the action, and it changes with each pronoun. If the root ends in a vowel (<b>amu-</b>): <b>-n</b> (inche), <b>-ymi</b> (eymi), <b>-y</b> (fey), <b>-yu</b> (inchiw), <b>-ymu</b> (eymu), <b>-yngu</b> (fey engu), <b>-iñ</b> (inchiñ), <b>-ymün</b> (eymün), <b>-yngün</b> (fey engün). If it ends in a consonant (<b>küdaw-</b>), <b>y</b> becomes <b>i</b> and <b>-n</b> becomes <b>-ün</b>: <b>küdaw-ün</b>, <b>küdaw-imi</b>, <b>küdaw-i</b>, <b>küdaw-iyu</b>… With no other suffix the form can be present or past: <b>amun</b> “I go” or “I went”. The pronoun can be left out, because the ending already says it."}},

 {id:"adv", es:"Avanzado", en:"Advanced", need:30, levels:[
  { id:"pos", mt:"Ñi, mi, iñ", es:"Lo mío, lo tuyo: posesión", en:"Mine, yours: possession", kind:"verb",
    gen:()=>genPos(8),
    examples:()=>[0,1,2,3,4,5,6].map(k=>posForm(POS_N[0],k)).concat([{m:"tañi chaw",es:"mi padre, o su padre",en:"my father, or his/her/their father"},{m:"tami ñuke",es:"tu madre",en:"your mother"}]),
    rule:{es:"El posesivo va antes del sustantivo: <b>mi ruka</b> “tu casa”, <b>iñ ruka</b> “nuestra casa”, <b>mu ruka</b> “la casa de ustedes”. Ojo: <b>ñi ruka</b> es ambiguo; puede ser “mi casa” o “su casa” (de él, de ella o de ellos), y el contexto decide. Para dejarlo claro se pone el pronombre delante: <b>inche ñi ruka</b> “mi casa”, <b>fey ñi ruka</b> “su casa (de él o de ella)”, <b>fey engün ñi ruka</b> “su casa (de ellos)”. En AVENUE <b>inche/iñche ñi</b> aparece 259 veces, como en <b>iñche ñi chawem</b> “mi padre”. En el habla son muy comunes las formas con <b>ta-</b>: <b>tañi</b>, <b>tami</b>, <b>taiñ</b>, <b>tamu</b> (en AVENUE, <b>tañi</b> aparece 8.493 veces y <b>tami</b> 3.404); <b>tañi</b> es ambiguo igual que <b>ñi</b>.",
          en:"The possessive goes before the noun: <b>mi ruka</b> “your house”, <b>iñ ruka</b> “our house”, <b>mu ruka</b> “your (pl.) house”. Careful: <b>ñi ruka</b> is ambiguous; it can be “my house” or “his/her/their house”, and context decides. To make it clear, put the pronoun first: <b>inche ñi ruka</b> “my house”, <b>fey ñi ruka</b> “his/her house”, <b>fey engün ñi ruka</b> “their house”. In AVENUE <b>inche/iñche ñi</b> occurs 259 times, as in <b>iñche ñi chawem</b> “my father”. In speech the forms with <b>ta-</b> are very common: <b>tañi</b>, <b>tami</b>, <b>taiñ</b>, <b>tamu</b> (in AVENUE, <b>tañi</b> occurs 8,493 times and <b>tami</b> 3,404); <b>tañi</b> is ambiguous just like <b>ñi</b>."}},
  { id:"pres", mt:"Inche, eymi, fey", es:"Verbos: yo, tú, él/ella", en:"Verbs: I, you, she/he", kind:"verb", tenses:["pres"],
    gen:()=>genVerbs(["pres"],8),
    rule:{es:"Raíz vocálica + <b>-n</b> (yo), <b>-ymi</b> (tú), <b>-y</b> (él/ella). Raíz consonántica + <b>-ün</b>, <b>-imi</b>, <b>-i</b>.",
          en:"Vowel stem + <b>-n</b> (I), <b>-ymi</b> (you), <b>-y</b> (she/he). Consonant stem + <b>-ün</b>, <b>-imi</b>, <b>-i</b>."}},
  { id:"neg", mt:"-la-", es:"Negación", en:"Negation", kind:"verb", tenses:["neg"],
    gen:()=>genVerbs(["neg"],8),
    rule:{es:"Para negar, se agrega <b>-la-</b> después de la raíz: <b>amu-la-n</b> “no voy / no fui”.",
          en:"To negate, add <b>-la-</b> after the stem: <b>amu-la-n</b> “I don't / didn't go”."}},
  { id:"kilno", mt:"-kil-, -no-", es:"Otras negaciones: -kil- y -no-", en:"Other negatives: -kil- and -no-", kind:"verb",
    gen:()=>genGram("kilno",8), examples:()=>gramExamples("kilno"),
    rule:{es:"<b>-la-</b> niega lo que se afirma: <b>amulay</b> “no va / no fue”. Para prohibir se usa <b>-kil-</b> con las terminaciones del imperativo: <b>amu-kil-nge</b> “¡no vayas!”, <b>fem-kil-nge</b> “¡no lo hagas!”, <b>amu-kil-pe</b> “¡que no vaya!”. En las formas que no son verbo principal (el que…, si…, lo que…) se usa <b>-no-</b> (a veces <b>-nu-</b>): <b>kim-no-lu</b> “el que no sabe” (183 veces en AVENUE), <b>kim-no-le</b> “si no sabe”, <b>kim-no-fiel</b> “lo que no sabía”. Compara <b>kimlu</b> “el que sabe”, <b>kimle</b> “si sabe”, <b>kimlay</b> “no sabe / no sabía”.",
          en:"<b>-la-</b> negates a statement: <b>amulay</b> “she/he doesn't / didn't go”. To forbid, use <b>-kil-</b> with the command endings: <b>amu-kil-nge</b> “don't go!”, <b>fem-kil-nge</b> “don't do it!”, <b>amu-kil-pe</b> “may she/he not go!”. In forms that are not the main verb (the one who…, if…, what…) use <b>-no-</b> (sometimes <b>-nu-</b>): <b>kim-no-lu</b> “the one who doesn't know” (183 times in AVENUE), <b>kim-no-le</b> “if she/he doesn't know”, <b>kim-no-fiel</b> “what she/he didn't know”. Compare <b>kimlu</b> “the one who knows”, <b>kimle</b> “if she/he knows”, <b>kimlay</b> “she/he doesn't / didn't know”."}},
  { id:"fut", mt:"-a-", es:"Futuro", en:"Future", kind:"verb", tenses:["fut"],
    gen:()=>genVerbs(["fut"],8),
    rule:{es:"Para el futuro, se agrega <b>-a-</b> después de la raíz: <b>amu-a-n</b> “iré”. Si la raíz termina en <b>a</b>, entre las dos <b>a</b> suele aparecer una <b>y</b>: <b>küpa-ya-n</b> “vendré”. No pasa siempre, así que <b>küpa-a-n</b> también es posible.",
          en:"For the future, add <b>-a-</b> after the stem: <b>amu-a-n</b> “I will go”. If the stem ends in <b>a</b>, a <b>y</b> often comes between the two <b>a</b>: <b>küpa-ya-n</b> “I will come”. It doesn't always happen, so <b>küpa-a-n</b> is also possible."}},
  { id:"kom", mt:"Kom", es:"Todo junto", en:"All together", kind:"verb", tenses:["pres","neg","fut"],
    gen:()=>genVerbs(["pres","neg","fut"],10),
    rule:{es:"Presente, negación y futuro mezclados. Fíjate en la raíz, luego en <b>-la-</b> o <b>-a-</b>, y al final en la persona.",
          en:"Present, negation and future mixed. Look at the stem, then for <b>-la-</b> or <b>-a-</b>, then at the person ending."}},
  { id:"ke", mt:"-ke-", es:"Lo habitual", en:"Habits", kind:"verb",
    gen:()=>genAsp("ke",8),
    examples:()=>[0,1,2].map(p=>aspForm(ASP_VERBS[0],"ke",p)).concat([0,1,2].map(p=>aspForm(ASP_VERBS[4],"ke",p))),
    rule:{es:"<b>-ke-</b> indica lo que se hace de costumbre: <b>amu-ke-n</b> “suelo / solía ir”. Va después de la raíz y antes de la persona.",
          en:"<b>-ke-</b> marks what someone usually does: <b>amu-ke-n</b> “I usually go / used to go”. It comes after the stem and before the person ending."}},
  { id:"le", mt:"-le-", es:"Lo que está pasando", en:"Ongoing actions", kind:"verb",
    gen:()=>genAsp("le",8),
    examples:()=>[0,1,2].map(p=>aspForm(ASP_VERBS[2],"le",p)).concat([0,1,2].map(p=>aspForm(ASP_VERBS[1],"le",p))),
    rule:{es:"<b>-le-</b> presenta la acción en curso o como un estado: <b>dungu-le-n</b> “estoy hablando”. Solo, <b>-le-</b> es presente; para el pasado se agrega <b>-fu-</b>: <b>dungu-le-fu-n</b> “estaba hablando”. Compara con <b>-ke-</b>: <b>dungu-ke-n</b> “suelo / solía hablar”.",
          en:"<b>-le-</b> presents the action as ongoing or as a state: <b>dungu-le-n</b> “I am speaking”. On its own <b>-le-</b> is present; for the past add <b>-fu-</b>: <b>dungu-le-fu-n</b> “I was speaking”. Compare <b>-ke-</b>: <b>dungu-ke-n</b> “I usually speak / used to speak”."}},
  { id:"imp", mt:"-nge, -chi, -pe", es:"Imperativo", en:"Commands", kind:"verb",
    gen:()=>genImp(8),
    examples:()=>[0,1,2].map(k=>impForm(IMP_VERBS[0],k)).concat([0,1,2].map(k=>impForm(IMP_VERBS[1],k))),
    rule:{es:"Para pedir o mandar: <b>-nge</b> a ti (<b>amunge</b> “¡ve!”), <b>-chi</b> para mí (<b>amuchi</b> “que yo vaya”) y <b>-pe</b> para él o ella (<b>amupe</b> “que vaya”).",
          en:"To ask or command: <b>-nge</b> to you (<b>amunge</b> “go!”), <b>-chi</b> for me (<b>amuchi</b> “let me go”) and <b>-pe</b> for her or him (<b>amupe</b> “let her/him go”)."}}
 ]},
 {id:"kim", es:"Experto", en:"Expert", need:44, levels:[
  { id:"derive", mt:"-n, -tu-", es:"Formar verbos con sustantivos", en:"Making verbs from nouns", kind:"derive",
    gen:()=>genDeriv(8),
    examples:()=>DERIV.map(d=>({m:`${d.n} → ${d.n+d.suf}`,es:d.es,en:d.en})),
    rule:{es:"Un sustantivo se vuelve verbo. Con <b>-n</b> (tras consonante <b>-ün</b>) se hace o se produce lo que nombra: <b>ruka → rukan</b> “hacer una casa”. Con <b>-tu-n</b> se consume o se usa: <b>kofke → kofketun</b> “comer pan”. Compara <b>kofken</b> “hacer pan”.",
          en:"A noun becomes a verb. With <b>-n</b> (<b>-ün</b> after a consonant) you make or produce what it names: <b>ruka → rukan</b> “to build a house”. With <b>-tu-n</b> you consume or use it: <b>kofke → kofketun</b> “to eat bread”. Compare <b>kofken</b> “to make bread”."}},
  { id:"fi", mt:"-fi-", es:"Objeto de 3.ª persona", en:"Third-person object", kind:"verb",
    gen:()=>genFi(8),
    examples:()=>[0,1,2].map(p=>fiForm(FI[0],false,p)).concat([0,1,2].map(p=>fiForm(FI[0],true,p)),[0,1,2].map(p=>fiForm(FI[4],false,p))),
    rule:{es:"<b>-fi-</b> marca un objeto de 3.ª persona: <b>pe-fi-ñ</b> “lo veo / lo vi”. Persona: <b>-ñ</b> (yo), <b>-mi</b> (tú), nada (él/ella). La negación <b>-la-</b> va antes: <b>pe-la-fi-ñ</b> “no lo veo / no lo vi”. Ojo: sin otra marca, un verbo de evento como <b>pe-</b> o <b>ngilla-</b> se entiende en pasado.",
          en:"<b>-fi-</b> marks a third-person object: <b>pe-fi-ñ</b> “I see / saw it”. Person: <b>-ñ</b> (I), <b>-mi</b> (you), nothing (she/he). Negation <b>-la-</b> comes first: <b>pe-la-fi-ñ</b> “I don't / didn't see it”. Note: with no other marker, an event verb like <b>pe-</b> or <b>ngilla-</b> is read as past."}},
  { id:"ael", mt:"ñi … -ael", es:"Para que…, quiero que…", en:"So that…, I want you to…", kind:"verb",
    gen:()=>genAel(8),
    examples:()=>["Fey ta mi chillkatuael","Ayün mi küpayael","Müley ñi amuael","Tüfa mi iyael"].map(aelForm).concat([{m:"mi chillkatu-a-el",es:"(lo que) vas a estudiar",en:"(what) you will study"},{m:"mi chillkatu-ke-el",es:"(lo que) estudias",en:"(what) you study"}]),
    rule:{es:"Un posesivo + verbo con <b>-ael</b> habla de algo que todavía no pasa: un propósito, un deseo o una obligación. El posesivo dice <b>quién</b> lo hace. En español corresponde al subjuntivo y en inglés a “so (that)…” o “want… to”: <b>Fey ta mi chillkatuael</b> “Esto es para que estudies / This is so you can study”; <b>Ayün mi küpayael</b> “Quiero que vengas / Quería que vinieras”; <b>Müley ñi amuael</b> “Tengo / Tenía que ir”. Después de <b>a</b> aparece una <b>y</b>: <b>küpa-y-ael</b>. Sin la <b>-a-</b>, <b>-el</b> habla de algo real o pasado: <b>mi chillkatukeel</b> “lo que estudias”. En AVENUE se escribe a menudo <b>-al</b>: <b>müli ñi amual</b> “tiene / tenía que ir”, <b>tañi kimal</b> “para aprender”.",
          en:"A possessive + a verb with <b>-ael</b> talks about something that has not happened yet: a purpose, a wish or an obligation. The possessive says <b>who</b> does it. Spanish uses the subjunctive here and English “so (that)…” or “want… to”: <b>Fey ta mi chillkatuael</b> “This is so you can study”; <b>Ayün mi küpayael</b> “I want / wanted you to come”; <b>Müley ñi amuael</b> “I have / had to go”. After <b>a</b> a <b>y</b> appears: <b>küpa-y-ael</b>. Without the <b>-a-</b>, <b>-el</b> talks about something real or past: <b>mi chillkatukeel</b> “what you study”. AVENUE often spells it <b>-al</b>: <b>müli ñi amual</b> “she/he has / had to go”, <b>tañi kimal</b> “in order to learn”."}},
  { id:"plural", mt:"Iñchiw, iñchiñ", es:"Dual y plural", en:"Dual and plural", kind:"verb",
    gen:()=>genPl(8),
    examples:()=>[0,1,2,3,4,5].map(i=>plForm(PL_VERBS[0],i)),
    rule:{es:"El mapudungun distingue singular, dual (dos) y plural (tres o más): <b>-yu</b> (nosotros dos), <b>-iñ</b> (nosotros), <b>-ymu</b> (ustedes dos), <b>-ymün</b> (ustedes), <b>-yngu</b> (ellos dos), <b>-yngün</b> (ellos).",
          en:"Mapudungun distinguishes singular, dual (two) and plural (three or more): <b>-yu</b> (we two), <b>-iñ</b> (we), <b>-ymu</b> (you two), <b>-ymün</b> (you all), <b>-yngu</b> (they two), <b>-yngün</b> (they)."}},
  { id:"kimun", mt:"Kimün", es:"Todo junto", en:"All together", kind:"verb",
    gen:()=>shuffle([...genDeriv(3),...genFi(4),...genPl(3)]),
    examples:()=>[dForm(DERIV[2]),fiForm(FI[3],true,1),plForm(PL_VERBS[1],5)].map(w=>({m:w.m,es:w.es,en:w.en})),
    rule:{es:"Verbos derivados, objeto <b>-fi-</b> y dual/plural mezclados. Lee la palabra de izquierda a derecha: raíz, derivación, negación, objeto, persona.",
          en:"Derived verbs, object <b>-fi-</b> and dual/plural mixed. Read the word left to right: root, derivation, negation, object, person."}},
  { id:"am", mt:"-me-, -pa-", es:"Ir a hacer, venir a hacer", en:"Go and do, come and do", kind:"verb",
    gen:()=>genAm(8),
    examples:()=>[0,1,2].map(p=>amForm(AM_VERBS[0],"me",p)).concat([0,1,2].map(p=>amForm(AM_VERBS[0],"pa",p))),
    rule:{es:"El movimiento asociado se marca en el verbo: <b>-me-</b> “ir a hacer” (<b>pe-me-n</b> “voy / fui a ver”) y <b>-pa-</b> “venir a hacer” (<b>pe-pa-n</b> “vengo / vine a ver”).",
          en:"Associated motion is marked on the verb: <b>-me-</b> “go and do” (<b>pe-me-n</b> “I go / went to see”) and <b>-pa-</b> “come and do” (<b>pe-pa-n</b> “I come / came to see”)."}},
  { id:"pu", mt:"-pu-", es:"Allá: -pu-", en:"Over there: -pu-", kind:"verb",
    gen:()=>genGram("pu",8), examples:()=>gramExamples("pu"),
    rule:{es:"<b>-pu-</b> dice que la acción ocurre <b>allá</b>, en un lugar lejos de quien habla: <b>kon-pu-y</b> “entra / entró allá”, <b>tripa-pu-y</b> “sale / salió allá”, <b>pe-pu-fiñ</b> “llego / llegué a verlo (allá)”, <b>müle-pu-y</b> “está / estaba allá” (60 veces en AVENUE). Compara con <b>-pa-</b> “hacia acá”: <b>tripa-pa-y</b> “sale / salió (hacia acá)”, <b>kon-pa-y</b> “entra / entró (acá)”; y con <b>-me-</b> “ir a”: <b>pe-me-fiñ</b> “voy / fui a verlo”. Con algunos verbos <b>-pu-</b> significa “llegar hasta un punto”: <b>fente-pu-a-y</b> “hasta aquí llega”, la frase con que se cierran muchos relatos (84 veces).",
          en:"<b>-pu-</b> says the action happens <b>over there</b>, at a place away from the speaker: <b>kon-pu-y</b> “she/he goes / went in over there”, <b>tripa-pu-y</b> “she/he comes / came out over there”, <b>pe-pu-fiñ</b> “I get / got to see her/him (there)”, <b>müle-pu-y</b> “she/he is / was over there” (60 times in AVENUE). Compare <b>-pa-</b> “toward here”: <b>tripa-pa-y</b> “she/he comes / came out (toward here)”, <b>kon-pa-y</b> “she/he comes / came in”; and <b>-me-</b> “go and”: <b>pe-me-fiñ</b> “I go / went to see her/him”. With some verbs <b>-pu-</b> means “reach a point”: <b>fente-pu-a-y</b> “this is where it ends”, the phrase that closes many stories (84 times)."}},
  { id:"kiaw", mt:"-(k)iaw-", es:"Andar haciendo: -(k)iaw-", en:"Going about doing: -(k)iaw-", kind:"verb",
    gen:()=>genGram("kiaw",8), examples:()=>gramExamples("kiaw"),
    rule:{es:"<b>-(k)iaw-</b> dice que la acción se hace <b>andando</b> de un lado a otro, sin un rumbo fijo: <b>treka-yaw-i</b> “anda / andaba caminando, pasea / paseaba”, <b>lef-kiaw-i</b> “anda / andaba corriendo”, <b>küdaw-kiaw-i</b> “anda / andaba trabajando”, <b>dungu-yaw-i</b> “anda / andaba hablando”. Después de vocal es <b>-yaw-</b>; después de consonante puede ser <b>-kiaw-</b>, <b>-iaw-</b> o <b>-yaw-</b> (<b>fem-kiaw-ki</b>, <b>fem-iaw-i</b>, <b>fem-yaw-i</b> “anda / andaba así”). Viene del verbo <b>miawün</b> “andar” (<b>miawi</b> “anda / andaba”, 145 veces en AVENUE).",
          en:"<b>-(k)iaw-</b> says the action is done while <b>going about</b> from place to place, with no fixed direction: <b>treka-yaw-i</b> “she/he walks / walked around”, <b>lef-kiaw-i</b> “she/he runs / ran around”, <b>küdaw-kiaw-i</b> “she/he goes / went about working”, <b>dungu-yaw-i</b> “she/he goes / went around talking”. After a vowel it is <b>-yaw-</b>; after a consonant it can be <b>-kiaw-</b>, <b>-iaw-</b> or <b>-yaw-</b> (<b>fem-kiaw-ki</b>, <b>fem-iaw-i</b>, <b>fem-yaw-i</b> “she/he goes / went about like that”). It comes from the verb <b>miawün</b> “to go about” (<b>miawi</b> “she/he goes / went about”, 145 times in AVENUE)."}},
  { id:"rpu", mt:"-rpa-, -rpu-", es:"De paso: -rpa- y -rpu-", en:"On the way: -rpa- and -rpu-", kind:"verb",
    gen:()=>genGram("rpu",8), examples:()=>gramExamples("rpu"),
    rule:{es:"<b>-rpa-</b> y <b>-rpu-</b> juntan dos piezas: <b>-(ü)r-</b> “de paso, en el camino” y <b>-pa-</b> “hacia acá” o <b>-pu-</b> “allá”. <b>-rpa-</b> es “de paso, viniendo hacia acá”: <b>ye-rpa-y</b> “pasa / pasó a buscar”, <b>el-ürpa-y</b> “viene / vino a dejar de paso” (compara <b>ye-pa-y</b> “viene / vino a buscar”, <b>ye-me-y</b> “va / fue a buscar”). <b>-rpu-</b> es “de paso, yendo hacia allá”, y muy a menudo “llegar a, terminar”: <b>fele-rpu-y</b> “resulta / resultó así”, <b>amule-rpu-y</b> “sigue / siguió avanzando”, <b>machinge-rpu-n</b> “llego / llegué a ser machi”, <b>chumle-rpu-a-l</b> “cómo irá a quedar”. En AVENUE <b>-rpu-</b> es unas diez veces más común que <b>-rpa-</b>, y <b>fele-rpu-</b> solo es más de la cuarta parte de los <b>-rpu-</b>.",
          en:"<b>-rpa-</b> and <b>-rpu-</b> join two pieces: <b>-(ü)r-</b> “in passing, on the way” and <b>-pa-</b> “toward here” or <b>-pu-</b> “over there”. <b>-rpa-</b> is “in passing, on the way here”: <b>ye-rpa-y</b> “she/he stops / stopped by to pick up”, <b>el-ürpa-y</b> “she/he drops / dropped it off on the way” (compare <b>ye-pa-y</b> “she/he comes / came to fetch”, <b>ye-me-y</b> “she/he goes / went to fetch”). <b>-rpu-</b> is “in passing, on the way there”, and very often “end up, come to”: <b>fele-rpu-y</b> “it turns / turned out that way”, <b>amule-rpu-y</b> “it keeps / kept advancing”, <b>machinge-rpu-n</b> “I end / ended up becoming a machi”, <b>chumle-rpu-a-l</b> “how it would turn out”. In AVENUE <b>-rpu-</b> is about ten times as common as <b>-rpa-</b>, and <b>fele-rpu-</b> alone is over a quarter of all <b>-rpu-</b>."}},
  { id:"caus", mt:"-l-, -el-", es:"Causativos", en:"Causatives", kind:"derive",
    gen:()=>shuffle(CAUS).map(causItem),
    examples:()=>CAUS.map(c=>({m:`${c.v}- → ${c.m}`,es:c.es,en:c.en})),
    rule:{es:"<b>-l-</b> (o <b>-el-</b>) hace que alguien haga la acción: <b>amu-</b> “ir” → <b>amu-l-ün</b> “hacer andar”, <b>kim-</b> “saber” → <b>kim-el-ün</b> “enseñar”.",
          en:"<b>-l-</b> (or <b>-el-</b>) makes someone else do the action: <b>amu-</b> “go” → <b>amu-l-ün</b> “make go”, <b>kim-</b> “know” → <b>kim-el-ün</b> “teach”."}},
  { id:"inv", mt:"-e-…-ew", es:"Cuando me lo hacen a mí", en:"When it's done to me", kind:"verb",
    gen:()=>genInv(8),
    examples:()=>invForms(INV_VERBS[0]).concat(invForms(INV_VERBS[3])),
    rule:{es:"Si una 3.ª persona actúa sobre ti o sobre mí, el verbo usa la forma inversa: <b>pe-e-n-ew</b> “me ve / me vio”, <b>pe-e-y-mew</b> “te ve / te vio”. Compara con <b>-fi-</b>, donde yo actúo sobre una 3.ª persona: <b>pe-fi-ñ</b> “lo veo / lo vi”.",
          en:"When a third person acts on me or you, the verb takes the inverse form: <b>pe-e-n-ew</b> “she/he sees / saw me”, <b>pe-e-y-mew</b> “she/he sees / saw you”. Compare <b>-fi-</b>, where I act on a third person: <b>pe-fi-ñ</b> “I see / saw it”."}}
 ]},
 {id:"kch", es:"Kimche", en:"Kimche", need:60, levels:[
  { id:"combo", mt:"", es:"Varios sufijos juntos", en:"Several suffixes together", kind:"verb",
    gen:()=>genCombo(8),
    examples:()=>COMBOS.slice(0,8).map(c=>({m:c.seg.join("-"),es:c.es,en:c.en})),
    rule:{es:"Los sufijos se suman en un orden fijo: raíz, movimiento (<b>-me-/-pa-</b>), aspecto (<b>-ke-</b>), negación (<b>-la-</b>), futuro (<b>-a-</b>), objeto (<b>-fi-</b>) y persona. <b>pe-me-la-fi-ñ</b> “no voy / no fui a verlo”.",
          en:"Suffixes stack in a fixed order: root, motion (<b>-me-/-pa-</b>), aspect (<b>-ke-</b>), negation (<b>-la-</b>), future (<b>-a-</b>), object (<b>-fi-</b>) and person. <b>pe-me-la-fi-ñ</b> “I don't / didn't go to see it”."}},
  { id:"rke", mt:"-(ü)rke-", es:"Dicen que…, resulta que…", en:"They say…, it turns out…", kind:"verb",
    gen:()=>genRke(8),
    examples:()=>[["müle-rke-fu-y","mülerkefuy"],["nie-rke-y","nierkey"],["kim-ürke-y","kimürkey"],["fem-ürke-n","femürken"],["küme-rke-y","kümerkey"],["pi-rke-y","pirkey"]].map(([s,m])=>({m:s,es:RKE_G[m][0],en:RKE_G[m][1]})),
    rule:{es:"<b>-(ü)rke-</b> marca que lo dicho viene de otros (“dicen que”) o que el hablante se da cuenta de algo (“resulta que”, “es que”). Va antes de la persona: <b>nie-rke-y</b> “dicen que tiene / tenía”. Después de consonante es <b>-ürke-</b>: <b>kim-ürke-y</b>. Con <b>-fu-</b> es típico de los relatos: <b>müle-rke-fu-y</b> “había (dicen)”. También se usa con <b>inche</b>: <b>fem-ürke-n</b> “resulta que lo hago / lo hice así”.",
          en:"<b>-(ü)rke-</b> marks that what is said comes from others (“they say”) or that the speaker realises something (“it turns out”). It goes before the person ending: <b>nie-rke-y</b> “they say she/he has / had”. After a consonant it is <b>-ürke-</b>: <b>kim-ürke-y</b>. With <b>-fu-</b> it is typical of stories: <b>müle-rke-fu-y</b> “there was (they say)”. It is also used with <b>inche</b>: <b>fem-ürke-n</b> “it turns out I do / did it that way”."}},
  { id:"dm", mt:"nga, may, ta, chi", es:"Partículas del discurso", en:"Discourse particles", kind:"verb",
    gen:()=>genDm(8),
    examples:()=>DM.map(d=>({m:d.m,es:d.es,en:d.en})),
    rule:{es:"El mapudungun tiene partículas propias que guían la conversación; van después de la palabra o frase a la que se refieren. <b>nga</b> recuerda algo pasado, a menudo con pena (<b>femkefuy nga yiñ chaw</b> “así hacía nuestro padre”), y también afirma o marca lo que alguien dijo. <b>may</b> busca un sí o suaviza una orden: <b>amuchi may</b> “ya me voy”. <b>ta</b> es como “el, la (que ya sabes)”: señala algo ya mencionado, y <b>tati</b> (ta + ti) también funciona como artículo: <b>tati kofke</b> “el pan”. <b>chi</b> expresa duda: <b>mawünay chi?</b> “¿lloverá?”. Ojo: la <b>-chi</b> de <b>fey-chi</b> o <b>küme-chi</b> es un sufijo, no esta partícula. <b>am</b> pregunta con sorpresa o pidiendo precisión, y <b>kay</b> contrasta o propone: <b>eymi kay?</b> “¿y tú?”. Los hablantes usan también <i>pu</i> (del español <i>pues</i>), pero <b>nga</b> sigue siendo la partícula para recordar y para repetir lo dicho.",
          en:"Mapudungun has its own particles that guide conversation; they follow the word or phrase they relate to. <b>nga</b> recalls something past, often with sorrow (<b>femkefuy nga yiñ chaw</b> “that is how our father used to do things”), and also affirms or marks what someone said. <b>may</b> invites a yes or softens a command: <b>amuchi may</b> “I'm off, then”. <b>ta</b> is like “the (you know)”: it points to something already mentioned, and <b>tati</b> (ta + ti) also works as an article: <b>tati kofke</b> “the bread”. <b>chi</b> expresses doubt: <b>mawünay chi?</b> “will it rain?”. Note: the <b>-chi</b> in <b>fey-chi</b> or <b>küme-chi</b> is a suffix, not this particle. <b>am</b> asks with surprise or for precision, and <b>kay</b> contrasts or proposes: <b>eymi kay?</b> “and you?”. Speakers also use <i>pu</i> (from Spanish <i>pues</i>), but <b>nga</b> is still the particle for remembering and for repeating what was said."}},
  { id:"verbal", mt:"Kümey, machingen, ilotun", es:"Cómo se hacen verbos", en:"How words become verbs", kind:"derive",
    gen:()=>genVerbal(8),
    examples:()=>VERBAL.map(v=>({m:`${v.b} → ${v.m}`,es:`${v.es} (${gl(v.c)})`,en:`${v.en} (${gl(v.c)})`})),
    rule:{es:"En mapudungun casi cualquier palabra puede funcionar como verbo. Las rutas principales son: <b>adjetivo + persona</b>, sin nada más: <b>küme → kümey</b> “es bueno” (905 veces en AVENUE). <b>Sustantivo + -nge-</b> “ser”: <b>machi → machingen</b> “soy machi”, <b>mapuche → mapuchengen</b> “soy mapuche” (251 veces). <b>Sustantivo + -tu-</b> “comer, usar, tomar”: <b>ilo → ilotun</b> “comer carne”, <b>lawen → lawentun</b> “curar con remedios”. <b>Sustantivo + -n</b> “hacer”: <b>ruka → rukan</b> “hacer una casa”. <b>Número + -w-</b>: <b>kiñe → kiñewün</b> “unirse”. <b>Palabra de pregunta + -le-</b>: <b>chum</b> “cómo” → <b>chumleymi?</b> “¿cómo estás?”. Y los <b>préstamos del español</b> entran como raíces y llevan terminaciones mapuche: <b>pasa- → pasay</b> “pasó”, <b>kampia- → kampiay</b> “cambió”. Elige la ruta que da el significado pedido.",
          en:"In Mapudungun almost any word can work as a verb. The main routes are: <b>adjective + person ending</b>, with nothing else: <b>küme → kümey</b> “it is good” (905 times in AVENUE). <b>Noun + -nge-</b> “to be”: <b>machi → machingen</b> “I am a machi”, <b>mapuche → mapuchengen</b> “I am Mapuche” (251 times). <b>Noun + -tu-</b> “eat, use, take”: <b>ilo → ilotun</b> “to eat meat”, <b>lawen → lawentun</b> “to treat with medicine”. <b>Noun + -n</b> “make”: <b>ruka → rukan</b> “to build a house”. <b>Numeral + -w-</b>: <b>kiñe → kiñewün</b> “to unite”. <b>Question word + -le-</b>: <b>chum</b> “how” → <b>chumleymi?</b> “how are you?”. And <b>Spanish loans</b> come in as roots and take Mapudungun endings: <b>pasa- → pasay</b> “it passed”, <b>kampia- → kampiay</b> “it changed”. Choose the route that gives the meaning asked for."}},
  { id:"nma", mt:"-ñma-", es:"A otra persona le afecta: -ñma-", en:"Someone else is affected: -ñma-", kind:"verb",
    gen:()=>genGram("nma",6), examples:()=>gramExamples("nma"),
    rule:{es:"<b>-ñma-</b> agrega a una persona afectada: aquella a quien se le quita algo o de quien es lo que se nombra. En español suele traducirse con <b>le</b> o <b>me</b>: <b>nentu-ñma-ngen</b> “me lo sacan / me lo sacaron”, <b>kimü-ñma-lafiñ</b> “no le sé / no le sabía (el nombre)”, <b>pe-ñma-ngelay tañi kutran</b> “no se le ve la enfermedad”. Compara <b>nentungen</b> “me sacan / me sacaron (a mí)”: sin <b>-ñma-</b>, la persona es lo sacado; con <b>-ñma-</b>, es a quien se lo sacan. Muchas palabras con <b>ñma</b> no llevan este sufijo (<b>rumeñma</b>). (* = forma formada por regla.)",
          en:"<b>-ñma-</b> adds an affected person: the one something is taken from, or whose thing is meant. Spanish usually renders it with <b>le</b> or <b>me</b>: <b>nentu-ñma-ngen</b> “they take / took it out of me”, <b>kimü-ñma-lafiñ</b> “I don't / didn't know her/his (name)”, <b>pe-ñma-ngelay tañi kutran</b> “her/his illness can't be seen”. Compare <b>nentungen</b> “they take / took me out”: without <b>-ñma-</b> the person is what is taken; with it, the person is the one it is taken from. Many words containing <b>ñma</b> do not have this suffix (<b>rumeñma</b>). (* = form built by rule.)"}},
  { id:"kantu", mt:"-kantu-, -faluw-", es:"De juego o fingido: -kantu- y -faluw-", en:"In play or pretended: -kantu- and -faluw-", kind:"verb",
    gen:()=>genGram("kantu",7), examples:()=>gramExamples("kantu"),
    rule:{es:"<b>-kantu-</b> dice que algo se hace de juego o en broma, sin que sea en serio: <b>feypi-kantu-y</b> “lo dice / lo dijo en broma”, <b>kütral-kantu-y</b> “juega / jugó a hacer fuego”; <b>awkantun</b> “jugar” ya lo lleva. <b>-faluw-</b> dice que se finge para que otros lo crean: <b>kutran-faluw-i</b> “se hace / se hizo el enfermo”, <b>kim-faluw-i</b> “se hace / se hizo el que sabe”. La diferencia: con <b>-kantu-</b> todos saben que es juego; con <b>-faluw-</b> se quiere engañar. (* = forma formada por regla.)",
          en:"<b>-kantu-</b> says something is done in play or in jest, not seriously: <b>feypi-kantu-y</b> “she/he says / said it as a joke”, <b>kütral-kantu-y</b> “she/he plays / played at making a fire”; <b>awkantun</b> “to play” already contains it. <b>-faluw-</b> says someone pretends so that others will believe it: <b>kutran-faluw-i</b> “she/he pretends / pretended to be sick”, <b>kim-faluw-i</b> “she/he pretends / pretended to know”. The difference: with <b>-kantu-</b> everyone knows it is play; with <b>-faluw-</b> the aim is to deceive. (* = form built by rule.)"}},
  { id:"compu", mt:"Lef + kon → lefkonün", es:"Dos verbos en uno: la composición", en:"Two verbs in one: compounding", kind:"verb",
    gen:()=>genGram("compu",8), examples:()=>gramExamples("compu"),
    rule:{es:"Dos raíces verbales pueden unirse en una sola palabra, y las terminaciones van solo al final. Muchas veces la primera raíz dice <b>cómo</b> y la segunda <b>hacia dónde</b> o con qué resultado: <b>lef</b> “correr” + <b>kon</b> “entrar” → <b>lefkonün</b> “entrar corriendo”; <b>leftripan</b> “salir corriendo, huir”; <b>trekatripan</b> “salir caminando”. Con <b>nag</b> “bajar” y <b>püra</b> “subir”: <b>anünagün</b> “sentarse” (el que está de pie) y <b>anüpüran</b> “incorporarse” (el que está acostado); <b>witrapüran</b> “levantarse” (42 veces en AVENUE). Con <b>kintu</b> “mirar, buscar”: <b>pürakintun</b> “mirar hacia arriba”, <b>inakintun</b> “seguir con la vista”. A veces el resultado es una palabra nueva: <b>llow</b> “recibir” + <b>dungu</b> “hablar” → <b>llowdungun</b> “contestar”; <b>el</b> “dejar” + <b>künu</b> “poner, dejar” → <b>elkünun</b> “dejar en un lugar” (96 veces). (* = forma formada por regla.)",
          en:"Two verb roots can join into one word, and the endings go only at the end. Often the first root says <b>how</b> and the second says <b>where to</b> or with what result: <b>lef</b> “run” + <b>kon</b> “enter” → <b>lefkonün</b> “to run in”; <b>leftripan</b> “to run out, flee”; <b>trekatripan</b> “to walk out”. With <b>nag</b> “go down” and <b>püra</b> “go up”: <b>anünagün</b> “to sit down” (from standing) and <b>anüpüran</b> “to sit up” (from lying down); <b>witrapüran</b> “to get up” (42 times in AVENUE). With <b>kintu</b> “look, search”: <b>pürakintun</b> “to look up”, <b>inakintun</b> “to follow with the eyes”. Sometimes the result is a new word: <b>llow</b> “receive” + <b>dungu</b> “speak” → <b>llowdungun</b> “to answer”; <b>el</b> “leave” + <b>künu</b> “put, leave” → <b>elkünun</b> “to leave somewhere” (96 times). (* = form built by rule.)"}},
  { id:"redup", mt:"Ngüma → ngümangüma", es:"Raíz doble: la reduplicación", en:"Doubled roots: reduplication", kind:"verb",
    gen:()=>genGram("redup",8), examples:()=>gramExamples("redup"),
    rule:{es:"Repetir la raíz del verbo dice que la acción se repite o sigue y sigue: <b>ngüma</b> “llorar” → <b>ngümangümangi</b> “llora y llora / lloraba y lloraba”; <b>tripa</b> “salir” → <b>tripatripangi</b> “sale y sale / salía y salía”; <b>amu</b> “ir” → <b>amuamungi</b> “sigue / seguía yendo”; <b>pi</b> “decir” → <b>pipiyefiñ</b> “le estoy / estuve diciendo y diciendo”; <b>dungudunguy</b> “es / era hablador”. En AVENUE la raíz doble a menudo lleva <b>-nge-</b> antes de la persona (<b>ngümangüma-nge-n</b>, <b>tripatripa-nge-y</b>), y a veces se escribe separada: <b>ngüma ngümangi</b>. No es lo mismo que <b>-ke-</b>, que dice que algo se hace de costumbre: <b>ngümakefuy</b> “lloraba (de costumbre)”, <b>amukey</b> “va / iba (siempre)”. Algunos verbos solo se usan con la raíz doble: <b>trüntrünün</b> “tiritar”, <b>poypoyün</b> “hincharse”, <b>wedwedün</b> “ser travieso, loco”.",
          en:"Repeating the verb root says the action repeats or goes on and on: <b>ngüma</b> “cry” → <b>ngümangümangi</b> “she/he cries and cries / cried and cried”; <b>tripa</b> “go out” → <b>tripatripangi</b> “it keeps / kept coming out”; <b>amu</b> “go” → <b>amuamungi</b> “she/he keeps / kept going”; <b>pi</b> “say” → <b>pipiyefiñ</b> “I keep / kept telling her/him”; <b>dungudunguy</b> “she/he is / was a chatterbox”. In AVENUE the doubled root often takes <b>-nge-</b> before the person ending (<b>ngümangüma-nge-n</b>, <b>tripatripa-nge-y</b>), and is sometimes written as two words: <b>ngüma ngümangi</b>. This is not the same as <b>-ke-</b>, which says something is done habitually: <b>ngümakefuy</b> “she/he used to cry”, <b>amukey</b> “she/he goes / went (always)”. Some verbs are used only with the doubled root: <b>trüntrünün</b> “to shiver”, <b>poypoyün</b> “to swell up”, <b>wedwedün</b> “to be mischievous, crazy”."}},
  { id:"fule", mt:"-fu-l-: niefule", es:"Si fuera, si hubiera: -fu-l-", en:"If it were, if it had been: -fu-l-", kind:"verb",
    gen:()=>genGram("fule",8), examples:()=>gramExamples("fule").filter(x=>/fu(l|y|n)/.test(x.m)),
    rule:{es:"El condicional <b>-l-</b> con las terminaciones <b>-i</b> (yo), <b>-mi</b> (tú) y <b>-e</b> (él/ella) dice una condición real: <b>nie-l-i</b> “si tengo, cuando tenga”, <b>müle-l-e</b> “si está”. Con <b>-fu-</b> delante, la condición se vuelve irreal o ya pasada: <b>nie-fu-l-i</b> “si tuviera, si hubiera tenido”, <b>müle-fu-l-e</b> “si estuviera, si hubiera estado”, <b>kim-no-fu-l-i</b> “si no supiera”. Es el mismo <b>-fu-</b> de <b>müle-fu-y</b> “estaba (y ya no)”: algo que no es o ya no es así. El orden es fijo: raíz, <b>-no-</b> (negación), <b>-fu-</b>, <b>-l-</b>, persona.",
          en:"The conditional <b>-l-</b> with the endings <b>-i</b> (I), <b>-mi</b> (you) and <b>-e</b> (she/he) states a real condition: <b>nie-l-i</b> “if I have, when I have”, <b>müle-l-e</b> “if she/he is there”. With <b>-fu-</b> before it, the condition becomes unreal or past: <b>nie-fu-l-i</b> “if I had, if I had had”, <b>müle-fu-l-e</b> “if she/he were, if she/he had been there”, <b>kim-no-fu-l-i</b> “if I didn't know”. It is the same <b>-fu-</b> as in <b>müle-fu-y</b> “she/he was there (and no longer is)”: something that isn't, or is no longer, so. The order is fixed: root, <b>-no-</b> (negation), <b>-fu-</b>, <b>-l-</b>, person."}},
  { id:"llefule", mt:"-lle-fu-l-: mülellefulmi", es:"Si de verdad…: -lle-fu-l-", en:"If really…: -lle-fu-l-", kind:"verb",
    gen:()=>genGram("llefule",8), examples:()=>gramExamples("llefule").filter(x=>/lle/.test(x.m)),
    rule:{es:"<b>-lle-</b> afirma con fuerza: “de verdad, sí que”. Va antes de <b>-fu-</b> y de <b>-la-</b>: <b>müle-lle-fu-y</b> “de verdad estaba (y ya no)”, <b>pi-lle-la-y</b> “no dijo nada en absoluto”. Con <b>-fu-l-</b> da una condición irreal con énfasis: <b>müle-lle-fu-l-mi</b> “si de verdad estuvieras (aquí)”, <b>fele-lle-fu-l-e</b> “si de verdad fuera así”. Compara <b>müle-fu-l-e</b> “si estuviera” con <b>müle-lle-fu-l-e</b>: lo mismo, dicho con más fuerza o más deseo.",
          en:"<b>-lle-</b> asserts strongly: “really, indeed”. It goes before <b>-fu-</b> and <b>-la-</b>: <b>müle-lle-fu-y</b> “she/he really was there (and no longer is)”, <b>pi-lle-la-y</b> “she/he didn't say anything at all”. With <b>-fu-l-</b> it gives an emphatic unreal condition: <b>müle-lle-fu-l-mi</b> “if you really were (here)”, <b>fele-lle-fu-l-e</b> “if it really were so”. Compare <b>müle-fu-l-e</b> “if she/he were there” with <b>müle-lle-fu-l-e</b>: the same, said more strongly or with more longing."}},
  { id:"orden", mt:"", es:"El orden de los sufijos", en:"Suffix order", kind:"derive",
    gen:()=>genOrder(8),
    examples:()=>COMBOS.filter(c=>c.seg.length>3).slice(0,6).map(c=>({m:c.seg.join("-"),es:c.es,en:c.en})),
    rule:{es:"Te damos la raíz y los sufijos desordenados. Elige la palabra con el orden correcto: <b>pe</b> + <b>-fi -me -ñ</b> → <b>pemefiñ</b>.",
          en:"You get the root and the suffixes out of order. Choose the word with the correct order: <b>pe</b> + <b>-fi -me -ñ</b> → <b>pemefiñ</b>."}},
  { id:"segm", mt:"Pu pichi troy", es:"Separar la palabra", en:"Splitting the word", kind:"derive",
    gen:()=>genSeg(8),
    examples:()=>COMBOS.slice(8,14).map(c=>({m:`${c.seg.join("")} = ${c.seg.join("-")}`,es:c.es,en:c.en})),
    rule:{es:"Elige dónde se separan la raíz y cada sufijo: <b>kintupafimi</b> = <b>kintu-pa-fi-mi</b> “vienes / viniste a buscarlo”.",
          en:"Choose where the root and each suffix divide: <b>kintupafimi</b> = <b>kintu-pa-fi-mi</b> “you come / came to look for it”."}},
  { id:"frases", mt:"Nütram", es:"Frases completas", en:"Whole sentences", kind:"derive",
    gen:()=>genSent(8),
    examples:()=>SENT.slice(0,4).map(x=>({m:x.m,es:x.es,en:x.en})),
    rule:{es:"Elige la frase que dice lo pedido. Las opciones se parecen: un solo sufijo o una palabra cambia el sentido.",
          en:"Choose the sentence that says what is asked. The options look alike: a single suffix or word changes the meaning."}}
 ]}
];
const ALL_LEVELS = STAGES.flatMap(s=>s.levels);

// ===== Stage quizzes (bonus ngülliw; stars here do not count toward unlocking stages) =====
const QUIZZES = STAGES.map(st=>({
  id:"quiz-"+st.id, quiz:true, stage:st, mt:"", es:`Prueba: ${st.es}`, en:`Quiz: ${st.en}`, kind:"mixed",
  gen:()=>{
    const per=Math.max(2,Math.ceil(12/st.levels.length));
    const items=st.levels.flatMap(l=>{
      const src = l.gen ? l.gen() : shuffle(l.words);
      return src.slice(0,per).map(w=>({...w,_lvl:l}));
    });
    const seen=new Set();
    return shuffle(items).filter(w=>!seen.has(w.m)&&seen.add(w.m)).slice(0,12);
  }
}));
const quizOpen = st => st.levels.every(l=>(best[l.id]||0)>0);

  const who={id:"fig", type:domo?"domo":"wentru", skin:SKIN.a, hair:"#1a1410"};
  const vb=FIG_CROP[it.slot]||"0 0 120 170";
  const [,,w,h]=vb.split(" ").map(Number);

}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ===== Grafemarios: all Mapudungun is stored in Unificado and shown in the player's chosen grafemario =====
let graf = ["uni","azu","rag"].includes(load("graf")) ? load("graf") : "uni";
const GRAF_MAP = {
  azu:{ng:"g", g:"q", d:"z", tr:"tx"},
  rag:{ng:"g", g:"q", d:"z", tr:"x", ch:"c", ll:"j", "ü":"v", sh:"s"}
};
// letter-by-letter conversion from Unificado; keeps capitals (Tr → Tx, TR → TX)
const G = s => { if(s==null || graf==="uni") return s; const m=GRAF_MAP[graf];
  return String(s).replace(/ng|tr|ch|ll|sh|[gdü]/gi, x=>{ const lo=x.toLowerCase(), r=m[lo]; if(r==null) return x;
    if(x!==lo && x===x.toUpperCase()) return r.toUpperCase();
    if(x[0]!==lo[0]) return r[0].toUpperCase()+r.slice(1);
    return r; }); };
// converts only the bold Mapudungun forms inside rule HTML, leaving tags and entities alone
/* hints: {word} is Mapudungun (shown in the chosen grafemario); {word|v} also bolds its first v */
const HINT = h => GB(String(h).replace(/\{([^}|]+)(?:\|(\w))?\}/g,(m,w,v)=>{ const g=esc(G(w)); if(!v) return g; const i=g.indexOf(v); return i<0?g:g.slice(0,i)+"<b class=\"vw\">"+v+"</b>"+g.slice(i+1); }));
const GB = html => graf==="uni" ? html : String(html).replace(/<b>(.*?)<\/b>/g,(a,x)=>"<b>"+x.split(/(&[#a-z0-9]+;|<[^>]+>)/i).map((p,i)=>i%2?p:G(p)).join("")+"</b>");
const titleM = l => l.mt ? G(l.mt) : gl(l);

// 1-10: a ten-frame, first five red and next five gold, empty places shown as rings
function tenFrame(n){
  let h=""; for(let i=1;i<=10;i++) h+=`<i class="${i<=n?(i<=5?"a":"b"):""}"></i>`;
  return `<div class="tf" aria-label="${n}">${h}</div>`;
}
// 11-100: the numeral, then one red rod per ten and a gold dot per unit
function numBlocks(n){
  const tens=Math.floor(n/10), ones=n%10;
  const rods=Array(tens).fill(`<span class="rod">${"<i></i>".repeat(10)}</span>`).join("");
  const dots=ones?`<span class="ones">${"<i></i>".repeat(ones)}</span>`:"";
  return `<div class="nb" aria-label="${n}"><span class="numtxt">${n}</span><span class="blk">${rods}${dots}</span></div>`;
}
function picHTML(w,lvl){
  if(w.prompt) return w.prompt();
  const p=w.pic;
  if(lvl.kind==="scene"||lvl.kind==="verb"||p==null) return `<div class="scene">${esc(gl(w))}</div>`;
  if(typeof p==="object"&&p.fig) return `<div class="pic" aria-label="${esc(gl(w))}">${figPic(p.fig)}</div>`;
  if(typeof p==="object"&&p.item){const it=ITEMS.find(i=>i.id===p.item);return `<div class="pic" aria-label="${esc(gl(w))}"><svg viewBox="${it.vb}" width="1.3em" height="1.3em">${it.svg}</svg></div>`}
  if(typeof p==="object"&&p.coach){const c=CHARS.find(x=>x.name===p.coach);return `<div class="pic" aria-label="${esc(gl(w))}">${c.svg.replace("<svg ",'<svg width="1.2em" height="1.2em" ')}</div>`}
  if(typeof p==="object"&&p.t) return numBlocks(+p.t);
  if(typeof p==="object"&&p.n&&!p.rep) return tenFrame(p.n);
  if(typeof p==="object"&&p.c) return `<div class="swatch" style="background:${p.c}" aria-label="${esc(gl(w))}"></div>`;
  if(typeof p==="object"&&p.rep) return `<div class="rep" aria-label="${esc(gl(w))}">${Array(p.n).fill(`<span>${p.rep}</span>`).join("")}</div>`;
  if(typeof p==="object"&&p.svg) return `<div class="pic" aria-label="${esc(gl(w))}">${p.svg}</div>`;
  return `<div class="pic" aria-label="${esc(gl(w))}">${p}</div>`;
}
function starsHTML(n){return `<span class="stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`}
function langToggle(){
  return `<div class="lang" role="group" aria-label="Idioma / Language">
    <button id="l-es" aria-pressed="${lang==="es"}">ES</button><button id="l-en" aria-pressed="${lang==="en"}">EN</button></div>`;
}
function bindLang(rerender){
  document.getElementById("l-es").onclick=()=>{lang="es";save("lang",lang);rerender()};
  document.getElementById("l-en").onclick=()=>{lang="en";save("lang",lang);rerender()};
}

document.addEventListener("keydown",e=>{ if(intro.keys && !/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")) intro.keys(e); });
function intro(lvl){
  let body="";
  if(lvl.quiz){
    body=`<div class="rule">${t().quizIntro(lvl.stage.levels.map(l=>esc(titleM(l))).join(", "))}</div>`;
  }else if(lvl.examples){
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="tbl-wrap"><table class="par"><thead><tr><th>${t().form}</th><th>${esc(gl({es:"Significado",en:"Meaning"}))}</th></tr></thead><tbody>
      ${lvl.examples().map(f=>`<tr><td class="m">${esc(G(f.m))}</td><td>${esc(gl(f))}</td></tr>`).join("")}
      </tbody></table></div>`;
  }else if(lvl.kind==="verb"){
    const tense=lvl.tenses[0], ex=[VERBS[0],VERBS[4]];
    const sets = lvl.tenses.length>1 ? ["pres","neg","fut"] : [tense];
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="tbl-wrap"><table class="par"><thead><tr><th>${t().form}</th><th>${esc(gl({es:"Significado",en:"Meaning"}))}</th></tr></thead><tbody>
      ${sets.flatMap(ts=>ex.flatMap(vb=>[0,1,2].map(p=>{const f=vform(vb,ts,p);return `<tr><td class="m">${esc(G(f.m))}</td><td>${esc(gl(f))}</td></tr>`}))).join("")}
      </tbody></table></div>`;
  }else if(lvl.kind==="count"){
    const ex=genCount(6);
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="cards">${ex.map(w=>`<div class="card">${picHTML(w,lvl)}<span class="w">${esc(G(w.m))}</span><span class="g">${esc(gl(w))}</span></div>`).join("")}</div>`;
  }else{
    body=`${lvl.rule?`<p class="eyebrow">${t().rule}</p><div class="rule">${HINT(lvl.rule[lang])}</div>`:""}<details class="all"><summary>${t().fcAll}</summary><div class="cards">${lvl.words.map(w=>`
        <div class="card">${(w._lvl||lvl).kind==="scene"?"":picHTML(w,w._lvl||lvl)}<span class="w">${esc(G(w.m))}</span><span class="g">${esc(gl(w))}</span>${w.hint?`<span class="hint">${HINT(w.hint[lang])}</span>`:""}</div>`).join("")}</div></details>`;
  }
  // individual flashcards, studied one at a time before playing
  let deck=[];
  if(!lvl.quiz){
    if(lvl.words) deck=lvl.words.map(w=>({m:w.m, hint:w.hint, pic:(w._lvl||lvl).kind==="scene"||((w._lvl||lvl).kind==="verb")?"":picHTML(w,w._lvl||lvl), g:gl(w)}));
    else if(lvl.kind==="count") deck=genCount(8).map(w=>({m:w.m, pic:picHTML(w,lvl), g:gl(w)}));
    else if(lvl.examples) deck=lvl.examples().map(f=>({m:f.m, pic:"", g:gl(f)}));
    else if(lvl.kind==="verb"){ const ex=[VERBS[0],VERBS[4]], sets=lvl.tenses.length>1?["pres","neg","fut"]:[lvl.tenses[0]];
      deck=sets.flatMap(ts=>ex.flatMap(vb=>[0,1,2].map(p=>{const f=vform(vb,ts,p);return {m:f.m,pic:"",g:gl(f)}}))); }
  }

      <div class="fc-ctl">
        <button class="btn ghost" id="fcPrev" aria-label="${t().fcPrev}">←</button>
        <button class="btn ghost" id="fcKnow">${t().fcKnow}</button>
        <button class="btn ghost" id="fcAgain">${t().fcAgain}</button>
        <button class="btn ghost" id="fcNext" aria-label="${t().fcNext}">→</button>
      </div>
      <div class="fc-opts"><button class="chip" id="fcShuf">${t().fcShuffle}</button><button class="chip" id="fcSide" aria-pressed="false">${t().fcSide}</button>${lvl.id==="quiz-fon"?"":`<button class="chip" id="fcPr" aria-pressed="${pronOn}">${L2("Cómo se pronuncia","How to say it")}</button>`}<span class="fc-known" id="fcK"></span></div>

    </section>` : "";

    <div class="top"><div><p class="eyebrow">${esc(gl(lvl))}</p><h2>${esc(titleM(lvl))}</h2></div>${langToggle()}</div>
    <p class="howline">${t().how(lvl)}</p>
    ${body}
    <div class="row"><button class="btn" id="go">${t().start}</button>${TPL_LINK.has(lvl.id)?`<button class="btn ghost" id="tplb">${L2("Ver la plantilla verbal","See the verb template")}</button>`:""}<button class="btn ghost" id="bk">${t().back}</button></div>`;
  bindLang(()=>intro(lvl));
  const tplb=document.getElementById("tplb"); if(tplb) tplb.onclick=()=>{track("open/template","Plantilla verbal");template(()=>intro(lvl));};
  if(deck.length){
    let order=deck.map((_,i)=>i), at=0, flipped=false, meaningFirst=false; const known=new Set();
    const show=()=>{ const c=deck[order[at]];
      const faceM=`<span class="fc-m">${esc(G(c.m))}</span>`, faceG=`${c.pic}<span class="fc-g">${esc(c.g)}</span>${c.hint?`<span class="fc-g" style="font-size:.9rem;color:var(--muted)">${HINT(c.hint[lang])}</span>`:""}`;
      const front=meaningFirst?faceG:faceM, back=meaningFirst?faceM:faceG;
      document.getElementById("fcIn").innerHTML=flipped?`<span class="fc-face back">${front}${back}</span>`:`<span class="fc-face">${front}</span>`;
      document.getElementById("fc").classList.toggle("flipped",flipped);
      document.getElementById("fcN").textContent=`${at+1} / ${order.length}`;
      document.getElementById("fcK").textContent=known.size?t().fcKnown(known.size,deck.length):"";
      document.getElementById("fcKnow").setAttribute("aria-pressed",known.has(order[at]));
      const pp=document.getElementById("fcPron"); if(pp){ pp.innerHTML=pronOn&&lvl.id!=="quiz-fon"?pronHTML(c.m):""; bindPron(pp,show); } };
    const go=d=>{ at=(at+d+order.length)%order.length; flipped=false; show(); };
    document.getElementById("fc").onclick=()=>{ flipped=!flipped; show(); };
    document.getElementById("fcPrev").onclick=()=>go(-1);
    document.getElementById("fcNext").onclick=()=>go(1);
    document.getElementById("fcKnow").onclick=()=>{ known.add(order[at]); go(1); };
    document.getElementById("fcAgain").onclick=()=>{ known.delete(order[at]); const i=order.splice(at,1)[0]; order.push(i); if(at>=order.length) at=0; flipped=false; show(); };
    document.getElementById("fcShuf").onclick=()=>{ order=shuffle(order); at=0; flipped=false; show(); };
    const prb=document.getElementById("fcPr"); if(prb) prb.onclick=e=>{ pronOn=!pronOn; e.currentTarget.setAttribute("aria-pressed",pronOn); show(); };
    document.getElementById("fcSide").onclick=e=>{ meaningFirst=!meaningFirst; e.currentTarget.setAttribute("aria-pressed",meaningFirst); flipped=false; show(); };
    intro.keys=e=>{ if(!document.getElementById("fc")) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); };
    show();
  }
  document.getElementById("go").onclick=()=>start(lvl);
  document.getElementById("bk").onclick=lvl.backTo||menu;
}

// ===== Play =====
// usage counts for GoatCounter (no personal data); no-op offline or from a file
const track=(path,title)=>{ try{ if(window.mpkCount) window.mpkCount(path,title); }catch(e){} };
function start(lvl){
  track('start/'+lvl.id, 'Inicio: '+(lvl.es||lvl.id));
  const items = lvl.gen ? lvl.gen() : shuffle(lvl.words).slice(0,Math.min(8,lvl.words.length));
  const queue=items.map((w,i)=>({w,type:(w.oneWay||i%2===0)?"pic2word":"word2pic",retry:false}));
  S={lvl,queue,total:items.length,done:0,correct:0,hearts:3,missed:new Set(),pool:items};
  round();
}

function round(){
  if(S.hearts<=0||!S.queue.length) return result();
  const q=S.queue[0], lvl=q.w._lvl||S.lvl;
  const others = q.w.dist ? q.w.dist : shuffle((lvl.words||S.pool).filter(w=>w.m!==q.w.m)).slice(0,3);
  const opts=shuffle([q.w,...others]);
  const pic2word=q.type==="pic2word";
  const textual = lvl.kind==="scene"||lvl.kind==="verb";
  app.innerHTML=`
    <div class="hud">
      <button class="btn ghost" id="bk" style="padding:6px 12px;font-size:.9rem">${t().menu}</button>
      <div class="bar" aria-hidden="true"><span style="width:${S.done/S.total*100}%"></span></div>
      <span class="hearts" aria-label="${S.hearts}/3">${[1,2,3].map(i=>i<=S.hearts?"♥":'<span class="off">♥</span>').join("")}</span>
    </div>
    <div class="prompt pop">
      <span class="ask">${pic2word?t().which:t().whichPic}</span>
      ${pic2word?picHTML(q.w,lvl):`<span class="big">${esc(G(q.w.m))}</span>`}
    </div>
    <div class="opts">${opts.map((w,i)=>`
      <button class="opt ${pic2word||textual?"":"pic-opt"}" data-i="${i}" style="${!pic2word&&textual?"font-family:var(--body);font-weight:700;font-size:1rem":""}">${pic2word?esc(G(w.m)):(textual?esc(gl(w)):picHTML(w,lvl))}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  document.getElementById("bk").onclick=menu;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>answer(opts[+b.dataset.i],b,btns,opts));
}

function answer(w,btn,btns,opts){
  const q=S.queue[0], ok=w===q.w;
  btns.forEach((b,i)=>{b.disabled=true;if(opts[i]===q.w)b.classList.add("ok");else if(b!==btn)b.classList.add("dim")});
  const fb=document.getElementById("fb");
  if(ok){
    btn.classList.add("pop");
    S.queue.shift(); S.done++; if(!q.retry){ S.correct++; logRight(q.w,S.lvl); }
    const word = G(PRAISE[praiseIdx++ % PRAISE.length]);
    fb.innerHTML=coach(`<b>¡${word}!</b><small>${t().rightG}</small>`, true);
  }else{
    btn.classList.add("bad","shake");
    S.hearts--; S.missed.add(q.w); logMiss(q.w,S.lvl);
    S.queue.shift();
    S.queue.splice(Math.min(2,S.queue.length),0,{w:q.w,type:(q.w.oneWay||q.type==="word2pic")?"pic2word":"word2pic",retry:true});
    fb.innerHTML=coach(`<b class="bad">¡${G("Fotrü")}!</b><small>${t().wrong}: <b>${esc(G(q.w.m))}</b> · ${q.w.hint?HINT(q.w.hint[lang]):esc(gl(q.w))} · ${t().keep}</small>`, false);
  }
  const nx=document.createElement("button");
  nx.className="btn"; nx.textContent=t().next; nx.onclick=round;
  fb.appendChild(nx); nx.focus();
}

// the level a player would naturally take next (null when there is none or it is still locked)
function nextLevel(lvl){
  if(lvl.backTo) return null;
  const ts=totalStars();
  if(lvl.quiz){ const ns=STAGES[STAGES.indexOf(lvl.stage)+1]; return ns && ts>=ns.need ? ns.levels[0] : null; }
  const st=STAGES.find(s=>s.levels.includes(lvl)); if(!st) return null;
  const i=st.levels.indexOf(lvl);
  if(i<st.levels.length-1) return st.levels[i+1];
  if(quizOpen(st)) return QUIZZES.find(q=>q.stage===st);
  return st.levels.find(l=>!((best[l.id]||0)>0))||null;
}
function result(){
  const lvl=S.lvl, lost=S.hearts<=0;
  const stars=lost?0:S.correct===S.total?3:S.correct>=S.total-2?2:1;
  const earned = lvl.quiz ? S.correct*2 + stars*4 : S.correct + stars*2;
  nuts += earned; save("nuts",nuts);
  if(stars>(best[lvl.id]||0)){best[lvl.id]=stars;save("best",best)}
  track((lost?'lost/':'done/')+lvl.id+(lost?'':'/'+stars), (lost?'Perdido: ':'Completado ('+stars+'★): ')+(lvl.es||lvl.id));
  const missed=[...S.missed];
  const nl=lost?null:nextLevel(lvl);
  const show=()=>{
  app.innerHTML=`
    <div class="result pop">
      <p class="eyebrow">${esc(gl(lvl))}</p>
      <h2>${lost?t().over:t().done}</h2>
      ${starsHTML(stars)}
      <p>${t().score(S.correct,S.total)}</p>
      <span class="gain">+${earned} ${NUT}<span style="font-family:var(--body);font-size:1rem;color:var(--muted)">ngülliw ${lvl.quiz?t().bonus:t().earned}</span></span>
      ${coach(lost?`<b>${t().keepB}</b>`:`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b><small>${t().rightG}</small>`, !lost)}
      ${missed.length?`<p class="eyebrow">${t().missed}</p>
        <div class="missed">${missed.map(w=>`<span><b>${esc(G(w.m))}</b> · ${esc(gl(w))}</span>`).join("")}</div>`:""}
    </div>
    <div class="row">${nl?`<button class="btn" id="nl">${L2("Siguiente","Next")}: ${esc(titleM(nl))} →</button>`:""}<button class="btn${nl?" ghost":""}" id="ag">${t().again}</button><button class="btn ghost" id="wd">${t().wardrobe}</button><button class="btn ghost" id="mn">${t().menu}</button></div>`;
  if(nl) document.getElementById("nl").onclick=()=>intro(nl);
  document.getElementById("ag").onclick=()=>lvl.repaso?openRepaso():start(lvl);
  document.getElementById("mn").onclick=menu;
  document.getElementById("wd").onclick=wardrobe;
  };
  if(lvl.quiz && !lost) playVideo(lvl.stage.id, show); else show();
}

let vidTimer=null;
function playVideo(id, onDone){
  const v=VIDEOS[id]; const step=4500; let i=0;
  clearInterval(vidTimer);
  app.innerHTML=`
    <div class="video">
      <p class="eyebrow">${esc(gl(v.title))}</p>
      <div class="screen"><svg viewBox="0 0 360 220" role="img" aria-label="${esc(gl(v.title))}">${v.scene()}</svg>
        <div class="cap" aria-live="polite"></div></div>
      <div class="vbar" aria-hidden="true"><span></span></div>
      <div class="row"><button class="btn ghost" id="vr">${t().replay}</button><button class="btn" id="vc">${t().cont}</button></div>
    </div>`;
  const cap=app.querySelector(".cap"), bar=app.querySelector(".vbar span");
  const show=()=>{ cap.classList.remove("in"); void cap.offsetWidth; cap.textContent=gl(v.caps[i]); cap.classList.add("in");
    bar.style.width=`${(i+1)/v.caps.length*100}%`; };
  show();
  vidTimer=setInterval(()=>{ if(i<v.caps.length-1){i++;show()} else clearInterval(vidTimer) }, step);
  document.getElementById("vr").onclick=()=>playVideo(id,onDone);
  document.getElementById("vc").onclick=()=>{clearInterval(vidTimer); onDone();};
}
