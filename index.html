// ===== Intro =====
document.addEventListener("keydown",e=>{ if(intro.keys && !/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")) intro.keys(e); });
function intro(lvl){
  let body="";
  if(lvl.quiz){
    body=`<div class="rule">${t().quizIntro(lvl.stage.levels.map(l=>esc(titleM(l))).join(", "))}</div>`;
  }else if(lvl.examples){
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="tbl-wrap"><table class="par"><thead><tr><th>${t().form}</th><th>${esc(gl({es:"Significado",en:"Meaning"}))}</th></tr></thead><tbody>
      ${lvl.examples().map(f=>`<tr><td class="m">${esc(G(f.m))}</td><td>${esc(gl(f))}</td></tr>`).join("")}
      </tbody></table></div>`;
  }else if(lvl.kind==="verb"){
    const tense=lvl.tenses[0], ex=[VERBS[0],VERBS[4]];
    const sets = lvl.tenses.length>1 ? ["pres","neg","fut"] : [tense];
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="tbl-wrap"><table class="par"><thead><tr><th>${t().form}</th><th>${esc(gl({es:"Significado",en:"Meaning"}))}</th></tr></thead><tbody>
      ${sets.flatMap(ts=>ex.flatMap(vb=>[0,1,2].map(p=>{const f=vform(vb,ts,p);return `<tr><td class="m">${esc(G(f.m))}</td><td>${esc(gl(f))}</td></tr>`}))).join("")}
      </tbody></table></div>`;
  }else if(lvl.kind==="count"){
    const ex=genCount(6);
    body=`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>
      <p class="eyebrow">${t().examples}</p>
      <div class="cards">${ex.map(w=>`<div class="card">${picHTML(w,lvl)}<span class="w">${esc(G(w.m))}</span><span class="g">${esc(gl(w))}</span></div>`).join("")}</div>`;
  }else{
    body=`${lvl.rule?`<p class="eyebrow">${t().rule}</p><div class="rule">${GB(lvl.rule[lang])}</div>`:""}<details class="all"><summary>${t().fcAll}</summary><div class="cards">${lvl.words.map(w=>`
        <div class="card">${(w._lvl||lvl).kind==="scene"?"":picHTML(w,w._lvl||lvl)}<span class="w">${esc(G(w.m))}</span><span class="g">${esc(gl(w))}</span></div>`).join("")}</div></details>`;
  }
  // individual flashcards, studied one at a time before playing
  let deck=[];
  if(!lvl.quiz){
    if(lvl.words) deck=lvl.words.map(w=>({m:w.m, pic:(w._lvl||lvl).kind==="scene"||((w._lvl||lvl).kind==="verb")?"":picHTML(w,w._lvl||lvl), g:gl(w)}));
    else if(lvl.kind==="count") deck=genCount(8).map(w=>({m:w.m, pic:picHTML(w,lvl), g:gl(w)}));
    else if(lvl.examples) deck=lvl.examples().map(f=>({m:f.m, pic:"", g:gl(f)}));
    else if(lvl.kind==="verb"){ const ex=[VERBS[0],VERBS[4]], sets=lvl.tenses.length>1?["pres","neg","fut"]:[lvl.tenses[0]];
      deck=sets.flatMap(ts=>ex.flatMap(vb=>[0,1,2].map(p=>{const f=vform(vb,ts,p);return {m:f.m,pic:"",g:gl(f)}}))); }
  }
  const deckHTML = deck.length ? `<section class="deck" aria-label="${t().fcTitle}">
      <div class="deck-head"><p class="eyebrow">${t().fcTitle}</p><span class="fc-count" id="fcN"></span></div>
      <button class="fc" id="fc" aria-live="polite"><span class="fc-in" id="fcIn"></span><span class="fc-hint">${t().fcFlip}</span></button>
      <div class="fc-ctl">
        <button class="btn ghost" id="fcPrev" aria-label="${t().fcPrev}">←</button>
        <button class="btn ghost" id="fcKnow">${t().fcKnow}</button>
        <button class="btn ghost" id="fcAgain">${t().fcAgain}</button>
        <button class="btn ghost" id="fcNext" aria-label="${t().fcNext}">→</button>
      </div>
      <div class="fc-opts"><button class="chip" id="fcShuf">${t().fcShuffle}</button><button class="chip" id="fcSide" aria-pressed="false">${t().fcSide}</button>${lvl.id==="quiz-fon"?"":`<button class="chip" id="fcPr" aria-pressed="${pronOn}">${L2("Cómo se pronuncia","How to say it")}</button>`}<span class="fc-known" id="fcK"></span></div>
      <div class="fc-pron" id="fcPron"></div>
    </section>` : "";
  body = deckHTML + body;
  app.innerHTML=`
    <div class="top"><div><p class="eyebrow">${esc(gl(lvl))}</p><h2>${esc(titleM(lvl))}</h2></div>${langToggle()}</div>
    <p class="howline">${t().how(lvl)}</p>
    ${body}
    <div class="row"><button class="btn" id="go">${t().start}</button>${TPL_LINK.has(lvl.id)?`<button class="btn ghost" id="tplb">${L2("Ver la plantilla verbal","See the verb template")}</button>`:""}<button class="btn ghost" id="bk">${t().back}</button></div>`;
  bindLang(()=>intro(lvl));
  const tplb=document.getElementById("tplb"); if(tplb) tplb.onclick=()=>{track("open/template","Plantilla verbal");template(()=>intro(lvl));};
  if(deck.length){
    let order=deck.map((_,i)=>i), at=0, flipped=false, meaningFirst=false; const known=new Set();
    const show=()=>{ const c=deck[order[at]];
      const faceM=`<span class="fc-m">${esc(G(c.m))}</span>`, faceG=`${c.pic}<span class="fc-g">${esc(c.g)}</span>`;
      const front=meaningFirst?faceG:faceM, back=meaningFirst?faceM:faceG;
      document.getElementById("fcIn").innerHTML=flipped?`<span class="fc-face back">${front}${back}</span>`:`<span class="fc-face">${front}</span>`;
      document.getElementById("fc").classList.toggle("flipped",flipped);
      document.getElementById("fcN").textContent=`${at+1} / ${order.length}`;
      document.getElementById("fcK").textContent=known.size?t().fcKnown(known.size,deck.length):"";
      document.getElementById("fcKnow").setAttribute("aria-pressed",known.has(order[at]));
      const pp=document.getElementById("fcPron"); if(pp){ pp.innerHTML=pronOn&&lvl.id!=="quiz-fon"?pronHTML(c.m):""; bindPron(pp,show); } };
    const go=d=>{ at=(at+d+order.length)%order.length; flipped=false; show(); };
    document.getElementById("fc").onclick=()=>{ flipped=!flipped; show(); };
    document.getElementById("fcPrev").onclick=()=>go(-1);
    document.getElementById("fcNext").onclick=()=>go(1);
    document.getElementById("fcKnow").onclick=()=>{ known.add(order[at]); go(1); };
    document.getElementById("fcAgain").onclick=()=>{ known.delete(order[at]); const i=order.splice(at,1)[0]; order.push(i); if(at>=order.length) at=0; flipped=false; show(); };
    document.getElementById("fcShuf").onclick=()=>{ order=shuffle(order); at=0; flipped=false; show(); };
    const prb=document.getElementById("fcPr"); if(prb) prb.onclick=e=>{ pronOn=!pronOn; e.currentTarget.setAttribute("aria-pressed",pronOn); show(); };
    document.getElementById("fcSide").onclick=e=>{ meaningFirst=!meaningFirst; e.currentTarget.setAttribute("aria-pressed",meaningFirst); flipped=false; show(); };
    intro.keys=e=>{ if(!document.getElementById("fc")) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); };
    show();
  }
  document.getElementById("go").onclick=()=>start(lvl);
  document.getElementById("bk").onclick=lvl.backTo||menu;
}

// ===== Play =====
// usage counts for GoatCounter (no personal data); no-op offline or from a file
const track=(path,title)=>{ try{ if(window.mpkCount) window.mpkCount(path,title); }catch(e){} };
function start(lvl){
  track('start/'+lvl.id, 'Inicio: '+(lvl.es||lvl.id));
  const items = lvl.gen ? lvl.gen() : shuffle(lvl.words).slice(0,Math.min(8,lvl.words.length));
  const queue=items.map((w,i)=>({w,type:(w.oneWay||i%2===0)?"pic2word":"word2pic",retry:false}));
  S={lvl,queue,total:items.length,done:0,correct:0,hearts:3,missed:new Set(),pool:items};
  round();
}

function round(){
  if(S.hearts<=0||!S.queue.length) return result();
  const q=S.queue[0], lvl=q.w._lvl||S.lvl;
  const others = q.w.dist ? q.w.dist : shuffle((lvl.words||S.pool).filter(w=>w.m!==q.w.m)).slice(0,3);
  const opts=shuffle([q.w,...others]);
  const pic2word=q.type==="pic2word";
  const textual = lvl.kind==="scene"||lvl.kind==="verb";
  app.innerHTML=`
    <div class="hud">
      <button class="btn ghost" id="bk" style="padding:6px 12px;font-size:.9rem">${t().menu}</button>
      <div class="bar" aria-hidden="true"><span style="width:${S.done/S.total*100}%"></span></div>
      <span class="hearts" aria-label="${S.hearts}/3">${[1,2,3].map(i=>i<=S.hearts?"♥":'<span class="off">♥</span>').join("")}</span>
    </div>
    <div class="prompt pop">
      <span class="ask">${pic2word?t().which:t().whichPic}</span>
      ${pic2word?picHTML(q.w,lvl):`<span class="big">${esc(G(q.w.m))}</span>`}
    </div>
    <div class="opts">${opts.map((w,i)=>`
      <button class="opt ${pic2word||textual?"":"pic-opt"}" data-i="${i}" style="${!pic2word&&textual?"font-family:var(--body);font-weight:700;font-size:1rem":""}">${pic2word?esc(G(w.m)):(textual?esc(gl(w)):picHTML(w,lvl))}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  document.getElementById("bk").onclick=menu;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>answer(opts[+b.dataset.i],b,btns,opts));
}

function answer(w,btn,btns,opts){
  const q=S.queue[0], ok=w===q.w;
  btns.forEach((b,i)=>{b.disabled=true;if(opts[i]===q.w)b.classList.add("ok");else if(b!==btn)b.classList.add("dim")});
  const fb=document.getElementById("fb");
  if(ok){
    btn.classList.add("pop");
    S.queue.shift(); S.done++; if(!q.retry){ S.correct++; logRight(q.w,S.lvl); }
    const word = G(PRAISE[praiseIdx++ % PRAISE.length]);
    fb.innerHTML=coach(`<b>¡${word}!</b><small>${t().rightG}</small>`, true);
  }else{
    btn.classList.add("bad","shake");
    S.hearts--; S.missed.add(q.w); logMiss(q.w,S.lvl);
    S.queue.shift();
    S.queue.splice(Math.min(2,S.queue.length),0,{w:q.w,type:(q.w.oneWay||q.type==="word2pic")?"pic2word":"word2pic",retry:true});
    fb.innerHTML=coach(`<b class="bad">¡${G("Fotrü")}!</b><small>${t().wrong}: <b>${esc(G(q.w.m))}</b> · ${esc(gl(q.w))} · ${t().keep}</small>`, false);
  }
  const nx=document.createElement("button");
  nx.className="btn"; nx.textContent=t().next; nx.onclick=round;
  fb.appendChild(nx); nx.focus();
}

// the level a player would naturally take next (null when there is none or it is still locked)
function nextLevel(lvl){
  if(lvl.backTo) return null;
  const ts=totalStars();
  if(lvl.quiz){ const ns=STAGES[STAGES.indexOf(lvl.stage)+1]; return ns && ts>=ns.need ? ns.levels[0] : null; }
  const st=STAGES.find(s=>s.levels.includes(lvl)); if(!st) return null;
  const i=st.levels.indexOf(lvl);
  if(i<st.levels.length-1) return st.levels[i+1];
  if(quizOpen(st)) return QUIZZES.find(q=>q.stage===st);
  return st.levels.find(l=>!((best[l.id]||0)>0))||null;
}
function result(){
  const lvl=S.lvl, lost=S.hearts<=0;
  const stars=lost?0:S.correct===S.total?3:S.correct>=S.total-2?2:1;
  const earned = lvl.quiz ? S.correct*2 + stars*4 : S.correct + stars*2;
  nuts += earned; save("nuts",nuts);
  if(stars>(best[lvl.id]||0)){best[lvl.id]=stars;save("best",best)}
  track((lost?'lost/':'done/')+lvl.id+(lost?'':'/'+stars), (lost?'Perdido: ':'Completado ('+stars+'★): ')+(lvl.es||lvl.id));
  const missed=[...S.missed];
  const nl=lost?null:nextLevel(lvl);
  const show=()=>{
  app.innerHTML=`
    <div class="result pop">
      <p class="eyebrow">${esc(gl(lvl))}</p>

      ${coach(lost?`<b>${t().keepB}</b>`:`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b><small>${t().rightG}</small>`, !lost)}
      ${missed.length?`<p class="eyebrow">${t().missed}</p>
        <div class="missed">${missed.map(w=>`<span><b>${esc(G(w.m))}</b> · ${esc(gl(w))}</span>`).join("")}</div>`:""}
    </div>
    <div class="row">${nl?`<button class="btn" id="nl">${L2("Siguiente","Next")}: ${esc(titleM(nl))} →</button>`:""}<button class="btn${nl?" ghost":""}" id="ag">${t().again}</button><button class="btn ghost" id="wd">${t().wardrobe}</button><button class="btn ghost" id="mn">${t().menu}</button></div>`;
  if(nl) document.getElementById("nl").onclick=()=>intro(nl);
  document.getElementById("ag").onclick=()=>lvl.repaso?openRepaso():start(lvl);
  document.getElementById("mn").onclick=menu;
  document.getElementById("wd").onclick=wardrobe;
  };
  if(lvl.quiz && !lost) playVideo(lvl.stage.id, show); else show();
}

let vidTimer=null;
function playVideo(id, onDone){
  const v=VIDEOS[id]; const step=4500; let i=0;
  clearInterval(vidTimer);
  app.innerHTML=`
    <div class="video">
      <p class="eyebrow">${esc(gl(v.title))}</p>
      <div class="screen"><svg viewBox="0 0 360 220" role="img" aria-label="${esc(gl(v.title))}">${v.scene()}</svg>
        <div class="cap" aria-live="polite"></div></div>
      <div class="vbar" aria-hidden="true"><span></span></div>
      <div class="row"><button class="btn ghost" id="vr">${t().replay}</button><button class="btn" id="vc">${t().cont}</button></div>
    </div>`;
  const cap=app.querySelector(".cap"), bar=app.querySelector(".vbar span");
  const show=()=>{ cap.classList.remove("in"); void cap.offsetWidth; cap.textContent=gl(v.caps[i]); cap.classList.add("in");
    bar.style.width=`${(i+1)/v.caps.length*100}%`; };
  show();
  vidTimer=setInterval(()=>{ if(i<v.caps.length-1){i++;show()} else clearInterval(vidTimer) }, step);
  document.getElementById("vr").onclick=()=>playVideo(id,onDone);
  document.getElementById("vc").onclick=()=>{clearInterval(vidTimer); onDone();};
}

    {es:"¿Qué va a hacer Nawel?",en:"What is Nawel going to do?",o:{es:["Ir a comprar pan","Ir a ver a su madre","Ir al mar"],en:["Go buy bread","Go see his mother","Go to the sea"]}},
    {es:"¿Qué decide Ayelen?",en:"What does Ayelen decide?",o:{es:["Ir también","Quedarse en la casa","Hacer pan"],en:["To go too","To stay home","To make bread"]}},
    {es:"¿Por qué Ayelen dice «lamngen» y no «peñi»?",en:"Why does Ayelen say «lamngen» and not «peñi»?",o:{es:["Porque ella es mujer","Porque Nawel es pequeño","Porque es de mañana"],en:["Because she is a woman","Because Nawel is small","Because it's morning"]}},
    {es:"¿Cuántas personas irán, según «amuayu»?",en:"How many people will go, according to «amuayu»?",o:{es:["Dos","Una","Tres o más"],en:["Two","One","Three or more"]}}]},
 { id:"read-palu", stage:"int2", title:"Ñi palu", sub:{es:"Una visita en familia",en:"A family visit"},
   lines:[
    {m:"Tüfa ñi palu. Ayelen pingey.", es:"Esta es mi tía paterna. Se llama Ayelen.", en:"This is my paternal aunt. Her name is Ayelen."},
    {m:"Ñi palu ngürekey witral mew.", es:"Mi tía teje en el telar.", en:"My aunt weaves at the loom."},
    {m:"Ñi malle mültrün dewmay.", es:"Mi tío paterno hizo catuto.", en:"My paternal uncle made catuto."},
    {m:"Inche muday pütokon.", es:"Yo bebí muday.", en:"I drank muday."},
    {m:"Pu pichikeche awkantuyngün ruka mew.", es:"Los niños jugaron en la casa.", en:"The children played at the house."}],
   gloss:[["palu","tía paterna","paternal aunt"],["pingey","se llama","is called"],["ngürekey","teje (de costumbre)","weaves (habitually)"],["malle","tío paterno","paternal uncle"],["dewmay","hizo","made"],["pu pichikeche","los niños","the children"],["awkantuyngün","jugaron (ellos)","they played"]],
   qs:[
    {es:"¿Quién es Ayelen?",en:"Who is Ayelen?",o:{es:["La tía paterna","La madre","La abuela"],en:["The paternal aunt","The mother","The grandmother"]}},
    {es:"¿Qué hace la tía?",en:"What does the aunt do?",o:{es:["Teje","Barre","Lee"],en:["She weaves","She sweeps","She reads"]}},
    {es:"¿Quién hizo catuto?",en:"Who made catuto?",o:{es:["El tío paterno","El tío materno","Los niños"],en:["The paternal uncle","The maternal uncle","The children"]}},
    {es:"¿Qué bebió el narrador?",en:"What did the narrator drink?",o:{es:["Muday","Leche","Agua"],en:["Muday","Milk","Water"]}}]},
 { id:"read-laku", stage:"adv", title:"Ñi laku", sub:{es:"Mi abuelo",en:"My grandfather"},
   lines:[
    {m:"Ñi laku nütramkakey.", es:"Mi abuelo suele conversar y contar historias.", en:"My grandfather usually talks and tells stories."},
    {m:"Fey ilotukelay; kofke ka poñü ikey.", es:"Él no suele comer carne; suele comer pan y papas.", en:"He doesn't usually eat meat; he usually eats bread and potatoes."},
    {m:"Wüle Temuko mew amuay.", es:"Mañana irá a Temuco.", en:"Tomorrow he will go to Temuco."},
    {m:"Inche ka amuan; pemeafiñ ñi chuchu.", es:"Yo también iré; iré a ver a mi abuela.", en:"I'll go too; I'll go to see my grandmother."}],
   gloss:[["laku","abuelo paterno","father's father"],["nütramkakey","suele conversar","usually talks"],["ilotukelay","no suele comer carne","doesn't usually eat meat"],["ikey","suele comer","usually eats"],["amuay","irá","will go"],["pe-me-a-fi-ñ","iré a verla","I'll go to see her"],["chuchu","abuela materna","mother's mother"]],
   qs:[
    {es:"¿Qué suele hacer el abuelo?",en:"What does the grandfather usually do?",o:{es:["Conversar y contar historias","Trabajar en el mar","Cantar"],en:["Talk and tell stories","Work at the sea","Sing"]}},
    {es:"¿Qué no suele comer?",en:"What doesn't he usually eat?",o:{es:["Carne","Pan","Papas"],en:["Meat","Bread","Potatoes"]}},
    {es:"¿Adónde irá mañana?",en:"Where will he go tomorrow?",o:{es:["A Temuco","Al cerro","Al mar"],en:["To Temuco","To the hill","To the sea"]}},
    {es:"¿A quién irá a ver el narrador?",en:"Who will the narrator go to see?",o:{es:["A su abuela materna","A su abuela paterna","A su padre"],en:["His mother's mother","His father's mother","His father"]}},
    {es:"¿Qué sufijo dice que el abuelo lo hace «de costumbre»?",en:"Which suffix says the grandfather does it «habitually»?",o:{es:["-ke-","-la-","-a-"],en:["-ke-","-la-","-a-"]}}]},
 { id:"read-epew", stage:"kim", title:"Ngürü ka mañke engu", sub:{es:"Un epew",en:"An epew"},
   lines:[
    {m:"Kiñe antü, ngürü amuy wingkul mew.", es:"Un día, el zorro fue al cerro.", en:"One day, the fox went to the hill."},
    {m:"Fey kintuy iyael.", es:"Buscó comida.", en:"He looked for food."},
    {m:"Mañke pefi ngürü.", es:"El cóndor vio al zorro.", en:"The condor saw the fox."},
    {m:"Mañke pi: «Chem kintuymi?»", es:"El cóndor dijo: «¿Qué buscas?»", en:"The condor said: «What are you looking for?»"},
    {m:"Ngürü pi: «Iyael kintulen.»", es:"El zorro dijo: «Estoy buscando comida.»", en:"The fox said: «I'm looking for food.»"},
    {m:"Mañke elufi kiñe ngülliw.", es:"El cóndor le dio un piñón.", en:"The condor gave him a pine nut."},
    {m:"Ngürü pi: «Chaltu may!»", es:"El zorro dijo: «¡Gracias!»", en:"The fox said: «Thank you!»"}],
   gloss:[["kiñe antü","un día","one day"],["kintuy","buscó","looked for"],["iyael","comida","food"],["pefi","lo vio","saw him"],["pi","dijo","said"],["elufi","le dio","gave him"],["chaltu may","gracias","thank you"]],
   qs:[
    {es:"¿Adónde fue el zorro?",en:"Where did the fox go?",o:{es:["Al cerro","Al mar","A la ruka"],en:["To the hill","To the sea","To the ruka"]}},
    {es:"¿Qué buscaba?",en:"What was he looking for?",o:{es:["Comida","Agua","A su madre"],en:["Food","Water","His mother"]}},
    {es:"¿Quién vio al zorro?",en:"Who saw the fox?",o:{es:["El cóndor","La gallina","El perro"],en:["The condor","The hen","The dog"]}},
    {es:"¿Qué le dio el cóndor?",en:"What did the condor give him?",o:{es:["Un piñón","Pan","Agua"],en:["A pine nut","Bread","Water"]}},
    {es:"En «pefi», ¿qué indica -fi-?",en:"In «pefi», what does -fi- show?",o:{es:["Que hay un objeto de 3.ª persona (el zorro)","Que la acción es futura","Que la acción es negativa"],en:["That there is a 3rd-person object (the fox)","That the action is future","That the action is negative"]}}]},
 { id:"read-trewa", stage:"kch", title:"Ngürü ka trewa engu", sub:{es:"Un epew más largo",en:"A longer epew"},
   lines:[
    {m:"Kiñe antü, ngürü küpay ruka mew.", es:"Un día, el zorro vino a la casa.", en:"One day, the fox came to the house."},
    {m:"Fey kintupay achawall.", es:"Vino a buscar gallinas.", en:"He came looking for chickens."},
    {m:"Trewa pefi ngürü.", es:"El perro vio al zorro.", en:"The dog saw the fox."},
    {m:"Trewa pi: «Chem kintupaymi?»", es:"El perro dijo: «¿Qué viniste a buscar?»", en:"The dog said: «What did you come looking for?»"},
    {m:"Ngürü pi: «Ko kintupan.»", es:"El zorro dijo: «Vine a buscar agua.»", en:"The fox said: «I came looking for water.»"},
    {m:"Welu ngürü koylatuy.", es:"Pero el zorro mintió.", en:"But the fox lied."},
    {m:"Trewa elufi ko.", es:"El perro le dio agua.", en:"The dog gave him water."},
    {m:"Ngürü pütokoy ko, welu amulay.", es:"El zorro tomó agua, pero no se fue.", en:"The fox drank the water, but he didn't leave."},
    {m:"Fey leliniefi pu achawall.", es:"Se quedó mirando a las gallinas.", en:"He stood looking at the chickens."},
    {m:"Pu achawall pefingün ngürü ka wiraringün: «Ngürü! Ngürü!»", es:"Las gallinas vieron al zorro y gritaron: «¡Zorro! ¡Zorro!»", en:"The chickens saw the fox and cried: «Fox! Fox!»"},
    {m:"Trewa küpay, ka ngürü lefpuy wingkul mew.", es:"El perro llegó, y el zorro huyó al cerro.", en:"The dog came, and the fox ran off to the hill."},
    {m:"Trewa kimniefi ngürü. «Koylatukey,» pi.", es:"El perro conoce al zorro. «Suele mentir», dijo.", en:"The dog knows the fox. «He usually lies,» he said."},
    {m:"Wüle küpayay ngürü? Iney nu rume kimlay!", es:"¿Volverá mañana el zorro? ¡Nadie sabe!", en:"Will the fox come back tomorrow? Nobody knows!"}],
   gloss:[["kintupay","vino a buscar","came looking for"],["koylatuy","mintió","lied"],["welu","pero","but"],["amulay","no se fue","didn't leave"],["pu","marca de plural","plural marker"],["pefingün","ellos lo vieron","they saw him"],["wiraringün","gritaron","they shouted"],["lefpuy","huyó (hacia allá)","fled (over there)"],["koylatukey","suele mentir","usually lies"],["küpayay","vendrá","will come"],["iney nu rume kimlay","nadie sabe","nobody knows"]],
   qs:[
    {es:"¿Para qué vino de verdad el zorro?",en:"Why did the fox really come?",o:{es:["A buscar gallinas","A buscar agua","A ver al perro"],en:["To look for chickens","To look for water","To see the dog"]}},
    {es:"¿Qué le dijo el zorro al perro?",en:"What did the fox tell the dog?",o:{es:["Que venía a buscar agua","Que venía a buscar gallinas","Que tenía frío"],en:["That he came for water","That he came for chickens","That he was cold"]}},
    {es:"¿Qué hizo primero el perro?",en:"What did the dog do first?",o:{es:["Le dio agua","Lo persiguió","Se durmió"],en:["Gave him water","Chased him","Fell asleep"]}},
    {es:"¿Quiénes avisaron que estaba el zorro?",en:"Who warned that the fox was there?",o:{es:["Las gallinas","El perro","El cóndor"],en:["The chickens","The dog","The condor"]}},
    {es:"¿Adónde huyó el zorro?",en:"Where did the fox flee?",o:{es:["Al cerro","Al mar","Adentro de la ruka"],en:["To the hill","To the sea","Into the ruka"]}},
    {es:"En «kintupaymi», ¿qué indica -pa-?",en:"In «kintupaymi», what does -pa- show?",o:{es:["Que se vino hacia acá a hacer algo","Que se fue hacia allá a hacer algo","Que la acción es negativa"],en:["Coming here to do something","Going there to do something","That the action is negative"]}},
    {es:"En «pefingün», ¿qué indica -ngün?",en:"In «pefingün», what does -ngün show?",o:{es:["Que lo hicieron ellos (tres o más)","Que lo hicieron ellos dos","Que lo hice yo"],en:["They did it (three or more)","The two of them did it","I did it"]}},
    {es:"¿Qué enseña el epew sobre el zorro?",en:"What does the epew teach about the fox?",o:{es:["Que es astuto y suele mentir","Que es muy generoso","Que le teme al agua"],en:["That he is cunning and often lies","That he is very generous","That he is afraid of water"]}}]}
,
 { id:"read-ruka", stage:"beg", title:"Ñi ruka", sub:{es:"Mi casa y mis animales",en:"My home and my animals"},
   lines:[
    {m:"Tüfa ñi ruka.", es:"Esta es mi casa.", en:"This is my house."},
    {m:"Ñi ruka mew müley küla achawall.", es:"En mi casa hay tres gallinas.", en:"At my house there are three chickens."},
    {m:"Ka müley epu lig ufisa.", es:"También hay dos ovejas blancas.", en:"There are also two white sheep."},
    {m:"Ñi chaw niey kiñe kurü kawellu.", es:"Mi padre tiene un caballo negro.", en:"My father has a black horse."},
    {m:"Ñi kuku niey kiñe kolü ñarki.", es:"Mi abuela tiene un gato café.", en:"My grandmother has a brown cat."}],
   gloss:[["tüfa","este, esta","this"],["müley","hay, está","there is, is (located)"],["ka","y, también","and, also"],["niey","tiene","has"],["kuku","abuela paterna","father's mother"]],
   qs:[
    {es:"¿Cuántas gallinas hay?",en:"How many chickens are there?",o:{es:["Tres","Dos","Una"],en:["Three","Two","One"]}},
    {es:"¿De qué color son las ovejas?",en:"What color are the sheep?",o:{es:["Blancas","Negras","Cafés"],en:["White","Black","Brown"]}},
    {es:"¿Qué tiene el padre?",en:"What does the father have?",o:{es:["Un caballo negro","Un gato café","Dos ovejas"],en:["A black horse","A brown cat","Two sheep"]}},
    {es:"¿Quién tiene un gato?",en:"Who has a cat?",o:{es:["La abuela","El padre","Nadie"],en:["The grandmother","The father","Nobody"]}},
    {es:"¿Qué significa «müley» aquí?",en:"What does «müley» mean here?",o:{es:["Hay","Tiene","Come"],en:["There is","Has","Eats"]}}]},
 { id:"read-tripantu", stage:"bas", title:"Tripantu", sub:{es:"Las estaciones",en:"The seasons"},
   lines:[
    {m:"Pukem mew, füta mawükey.", es:"En invierno llueve mucho.", en:"In winter it rains a lot."},
    {m:"Pukem mew, kütral mew anümkünukeiñ.", es:"En invierno nos sentamos junto al fuego.", en:"In winter we sit by the fire."},
    {m:"Pewü mew, fentren rayen müley.", es:"En primavera hay muchas flores.", en:"In spring there are many flowers."},
    {m:"Walüng mew, ñi chaw küdawkey.", es:"En verano mi padre trabaja.", en:"In summer my father works."},
    {m:"Rimü mew, ngülliw kintukeiñ mawida mew.", es:"En otoño buscamos piñones en el monte.", en:"In autumn we look for pine nuts in the woods."}],
   gloss:[["füta","mucho, grande","a lot, big"],["mawükey","llueve (de costumbre)","it (usually) rains"],["anümkünukeiñ","nos sentamos (de costumbre)","we (usually) sit"],["fentren","mucho","a lot, many"],["küdawkey","trabaja (de costumbre)","works (habitually)"],["kintukeiñ","buscamos (de costumbre)","we (usually) look for"]],
   qs:[
    {es:"¿Qué pasa mucho en invierno?",en:"What happens a lot in winter?",o:{es:["Llueve","Florece todo","Caen piñones"],en:["It rains","Everything blooms","Pine nuts fall"]}},
    {es:"¿Dónde se sientan en invierno?",en:"Where do they sit in winter?",o:{es:["Junto al fuego","En el mar","En el monte"],en:["By the fire","At the sea","In the woods"]}},
    {es:"¿Qué hay en primavera?",en:"What is there in spring?",o:{es:["Muchas flores","Mucha nieve","Mucho viento"],en:["Many flowers","A lot of snow","A lot of wind"]}},
    {es:"¿Qué buscan en otoño, y dónde?",en:"What do they look for in autumn, and where?",o:{es:["Piñones, en el monte","Peces, en el mar","Flores, en el cerro"],en:["Pine nuts, in the woods","Fish, at the sea","Flowers, on the hill"]}},
    {es:"En «kintuiñ», ¿quién busca?",en:"In «kintuiñ», who is looking?",o:{es:["Nosotros","Él o ella","Ustedes dos"],en:["We","She or he","You two"]}}]},
 { id:"read-ngillan", stage:"int", title:"Kofke ngillan", sub:{es:"Comprar pan",en:"Buying bread"},
   lines:[
    {who:"Ayelen", m:"Mari mari, lamngen! Kofke am niepelaymi?", es:"¡Hola, hermana! ¿No tendrás pan?", en:"Hello, sister! Would you have any bread?"},
    {who:"Millaray", m:"May, nien. Tunten kofke ngillayaymi?", es:"Sí, tengo. ¿Cuántos panes comprarás?", en:"Yes, I do. How many loaves will you buy?"},
    {who:"Ayelen", m:"Küla kofke ngillayan.", es:"Compraré tres panes.", en:"I'll buy three loaves."},
    {who:"Millaray", m:"Ka poñü ngillayaymi?", es:"¿También comprarás papas?", en:"Will you buy potatoes too?"},
    {who:"Ayelen", m:"Poñü nien ruka mew.", es:"Tengo papas en la casa.", en:"I have potatoes at home."},
    {who:"Millaray", m:"Küme! Chaltu may, lamngen.", es:"¡Bien! Gracias, hermana.", en:"Good! Thank you, sister."},
    {who:"Ayelen", m:"Pewkayal!", es:"¡Adiós!", en:"Goodbye!"}],
   gloss:[["kofke am niepelaymi?","¿no tendrás pan?","would you have any bread?"],["tunten","cuánto(s)","how many"],["ngillayaymi","comprarás","you will buy"],["ngillayan","compraré","I will buy"],["poñü","papa","potato"]],
   qs:[
    {es:"¿Qué compra Ayelen?",en:"What does Ayelen buy?",o:{es:["Pan","Papas","Carne"],en:["Bread","Potatoes","Meat"]}},
    {es:"¿Cuántos panes compra?",en:"How many loaves does she buy?",o:{es:["Tres","Dos","Uno"],en:["Three","Two","One"]}},
    {es:"¿Por qué no compra papas?",en:"Why doesn't she buy potatoes?",o:{es:["Tiene papas en la casa","No le gustan","Son muy caras"],en:["She has potatoes at home","She doesn't like them","They're too expensive"]}},
    {es:"¿Quién dice «chaltu may»?",en:"Who says «chaltu may»?",o:{es:["Millaray","Ayelen","Las dos"],en:["Millaray","Ayelen","Both"]}},
    {es:"¿Qué marca el futuro en «ngillayan»?",en:"What marks the future in «ngillayan»?",o:{es:["-(y)a-","-n","ngilla-"],en:["-(y)a-","-n","ngilla-"]}}]},
 { id:"read-trafkintu", stage:"int2", title:"Trafkintu", sub:{es:"Un intercambio",en:"An exchange"},
   lines:[
    {m:"Mari mari kom pu che!", es:"¡Hola a todos!", en:"Hello, everyone!"},
    {m:"Fachantü trafkintu müley.", es:"Hoy hay trafkintu.", en:"Today there is a trafkintu."},
    {m:"Inche mürke küpalün.", es:"Yo traje harina tostada.", en:"I brought toasted flour."},
    {m:"Kiñe kuku kuram küpali.", es:"Una abuela trajo huevos.", en:"A grandmother brought eggs."},
    {m:"Trafkintuiñ, ka kom ayüwiñ.", es:"Intercambiamos, y todos nos alegramos.", en:"We exchanged, and we were all happy."},
    {m:"Pewkallal, pu che!", es:"¡Hasta luego, gente!", en:"See you later, everyone!"}],
   gloss:[["fachantü","hoy","today"],["trafkintu","intercambio","exchange"],["küpalün","traje","I brought"],["küpali","trajo","brought"],["trafkintuiñ","intercambiamos","we exchanged"],["ayüwiñ","nos alegramos","we were happy"]],
   qs:[
    {es:"¿Qué hay hoy?",en:"What is happening today?",o:{es:["Un trafkintu","Un partido de palin","Una carrera"],en:["A trafkintu","A palin match","A race"]}},
    {es:"¿Qué trajo el narrador?",en:"What did the narrator bring?",o:{es:["Harina tostada","Huevos","Pan"],en:["Toasted flour","Eggs","Bread"]}},
    {es:"¿Qué trajo la abuela?",en:"What did the grandmother bring?",o:{es:["Huevos","Harina tostada","Leche"],en:["Eggs","Toasted flour","Milk"]}},
    {es:"¿Cómo se sintieron todos?",en:"How did everyone feel?",o:{es:["Contentos","Cansados","Tristes"],en:["Happy","Tired","Sad"]}}]},
 { id:"read-kupange", stage:"adv", title:"Küpange!", sub:{es:"La hora de comer",en:"Time to eat"},
   lines:[
    {who:"Ñuke", m:"Nawel! Küpange!", es:"¡Nawel! ¡Ven!", en:"Nawel! Come here!"},
    {who:"Nawel", m:"Awkantulen, ñuke.", es:"Estoy jugando, mamá.", en:"I'm playing, mom."},
    {who:"Ñuke", m:"Iyael müley. Inge!", es:"Hay comida. ¡Come!", en:"There's food. Eat!"},
    {who:"Nawel", m:"Ñi trewa ka ipe!", es:"¡Que coma también mi perro!", en:"Let my dog eat too!"},
    {who:"Ñuke", m:"May. Fey ka ipe.", es:"Sí. Que coma él también.", en:"Yes. Let him eat too."},
    {m:"Iy Nawel ka ñi trewa engu.", es:"Nawel y su perro comieron.", en:"Nawel and his dog ate."}],
   gloss:[["küpange","¡ven!","come!"],["awkantulen","estoy jugando","I'm playing"],["inge","¡come!","eat!"],["ipe","que coma (él/ella)","let her/him eat"],["engu","los dos (juntos)","the two (together)"]],
   qs:[
    {es:"¿Qué está haciendo Nawel?",en:"What is Nawel doing?",o:{es:["Jugando","Comiendo","Durmiendo"],en:["Playing","Eating","Sleeping"]}},
    {es:"¿Qué le pide la madre?",en:"What does his mother ask?",o:{es:["Que venga a comer","Que vaya a comprar pan","Que duerma"],en:["To come and eat","To go buy bread","To sleep"]}},
    {es:"¿Qué pide Nawel?",en:"What does Nawel ask for?",o:{es:["Que coma también su perro","Seguir jugando","Más pan"],en:["That his dog eat too","To keep playing","More bread"]}},
    {es:"En «ipe», ¿a quién se dirige la orden?",en:"In «ipe», who is the command about?",o:{es:["A una 3.ª persona (que él coma)","A ti (¡come!)","A mí (que yo coma)"],en:["A 3rd person (let him eat)","You (eat!)","Me (let me eat)"]}},
    {es:"Según «engu», ¿cuántos comieron?",en:"According to «engu», how many ate?",o:{es:["Dos","Uno","Tres o más"],en:["Two","One","Three or more"]}}]},
 { id:"read-kuku", stage:"kim", title:"Ñi kuku", sub:{es:"Una visita",en:"A visit"},
   lines:[
    {m:"Ñi kuku pepaenew.", es:"Mi abuela vino a verme.", en:"My grandmother came to see me."},
    {m:"Fey eluenew kiñe ngülliw.", es:"Ella me dio un piñón.", en:"She gave me a pine nut."},
    {m:"Fey pi: «Pemeafiñ tami chaw.»", es:"Dijo: «Iré a ver a tu padre.»", en:"She said: «I'll go to see your father.»"},
    {m:"Ñi kuku ka ñi chaw engu nütramkayngu.", es:"Mi abuela y mi padre conversaron.", en:"My grandmother and my father talked."},
    {m:"Wüle, inche pemeafiñ ñi kuku.", es:"Mañana yo iré a ver a mi abuela.", en:"Tomorrow I will go to see my grandmother."}],
   gloss:[["pe-pa-e-n-ew","vino a verme","came to see me"],["elu-e-n-ew","me dio","gave me"],["pe-me-a-fi-ñ","iré a verlo/a","I'll go to see her/him"],["tami","tu","your"],["nütramkayngu","conversaron (los dos)","the two talked"]],
   qs:[
    {es:"¿Quién vino a ver al narrador?",en:"Who came to see the narrator?",o:{es:["Su abuela","Su padre","Su hermano"],en:["His grandmother","His father","His brother"]}},
    {es:"¿Qué le dio?",en:"What did she give him?",o:{es:["Un piñón","Pan","Un caballo"],en:["A pine nut","Bread","A horse"]}},
    {es:"¿A quién iba a ver la abuela?",en:"Who was the grandmother going to see?",o:{es:["Al padre del narrador","A su propia madre","Al lonko"],en:["The narrator's father","Her own mother","The lonko"]}},
    {es:"En «eluenew», ¿quién da y quién recibe?",en:"In «eluenew», who gives and who receives?",o:{es:["Ella da; yo recibo","Yo doy; ella recibe","Tú das; yo recibo"],en:["She gives; I receive","I give; she receives","You give; I receive"]}},
    {es:"¿Qué hará el narrador mañana?",en:"What will the narrator do tomorrow?",o:{es:["Ir a ver a su abuela","Ir a ver a su padre","Buscar piñones"],en:["Go to see his grandmother","Go to see his father","Look for pine nuts"]}}]},
 { id:"read-pangi", stage:"kch", title:"Ngürü ka pangi engu", sub:{es:"Otro epew",en:"Another epew"},

const readKey = r => "quiz-"+r.id;   // "quiz-" keeps reading stars out of stage unlocking
const readOpen = r => totalStars() >= STAGES.find(st=>st.id===r.stage).need;

function readingList(){

    <div class="top"><div><p class="eyebrow">Mapudungun</p><h2>${t().reading}</h2></div>${langToggle()}</div>

    <div class="bar-top">${purse()}<button class="btn ghost" id="bk" style="padding:8px 14px">${t().menu}</button></div>
    <div class="readlist">${READINGS.slice().sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage)).map(r=>{const open=readOpen(r), st=STAGES.find(x=>x.id===r.stage);
      return `<button class="rcard" data-r="${r.id}" ${open?"":"disabled"}>
        <span class="lvlname">${esc(gl(st))}</span>
        <span class="mt">${esc(G(r.title))}</span><span class="gl">${esc(gl(r.sub))}</span>
        ${open?starsHTML(best[readKey(r)]||0):`<span class="gl">🔒 ${t().locked(st.need)}</span>`}</button>`}).join("")}</div>`;
  bindLang(readingList);
  document.getElementById("bk").onclick=menu;
  app.querySelectorAll(".rcard:not(:disabled)").forEach(b=>b.onclick=()=>{const r=READINGS.find(r=>r.id===b.dataset.r); track("reading/"+r.id,"Lectura: "+r.title); reading(r);});
}

function reading(r, state){
  const st = state || {order:r.qs.map(q=>shuffle(q.o.es.map((_,i)=>i))), pick:r.qs.map(()=>null), checked:false};
  const done=st.checked;
  const score = done ? st.pick.filter(x=>x===0).length : 0;
  app.innerHTML=`
    <div class="top"><div><p class="eyebrow">${esc(gl(r.sub))}</p><h2>${esc(G(r.title))}</h2></div>${langToggle()}</div>
    <div class="passage">${r.lines.map(l=>`<p class="line">${l.who?`<span class="who">${esc(G(l.who))}:</span> `:""}<span class="mz">${esc(G(l.m))}</span>${done?`<span class="tr">${esc(gl(l))}</span>`:""}</p>`).join("")}</div>
    <details class="gloss"><summary>${t().glossary}</summary><div class="chips">${r.gloss.map(g=>`<span><b>${esc(G(g[0]))}</b> ${esc(lang==="es"?g[1]:g[2])}</span>`).join("")}</div></details>
    <div class="qs">${r.qs.map((q,qi)=>`
      <fieldset class="q"><legend>${qi+1}. ${esc(gl(q))}</legend>
        <div class="choices">${st.order[qi].map(oi=>{
          const sel=st.pick[qi]===oi, cls=done?(oi===0?" ok":sel?" bad":""):"";
          return `<button class="choice${cls}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel}" ${done?"disabled":""}>${esc(q.o[lang][oi])}</button>`}).join("")}</div>
      </fieldset>`).join("")}</div>
    <div id="rfb"></div>
    <div class="row">${done
      ? `<button class="btn" id="ra">${t().again}</button><button class="btn ghost" id="rl">${t().reading}</button>`
      : `<button class="btn" id="rc" ${st.pick.includes(null)?"disabled":""}>${t().check}</button><button class="btn ghost" id="rl">${t().back}</button>`}</div>`;
  bindLang(()=>reading(r,st));
  app.querySelectorAll(".choice:not(:disabled)").forEach(b=>b.onclick=()=>{st.pick[+b.dataset.q]=+b.dataset.o; reading(r,st)});
  document.getElementById("rl").onclick=readingList;
  if(done){
    document.getElementById("ra").onclick=()=>reading(r);
    const total=r.qs.length, stars=score===total?3:score>=total-1?2:score>0?1:0;
    if(!st.paid){
      st.earned=score*3+stars*3; st.paid=true; nuts+=st.earned; save("nuts",nuts);
      if(stars>(best[readKey(r)]||0)){best[readKey(r)]=stars;save("best",best)}
      st.stars=stars;
    }
    document.getElementById("rfb").innerHTML=`<div class="result">${starsHTML(st.stars)}<p>${t().score(score,total)}</p>
      <span class="gain">+${st.earned} ${NUT}</span>
      ${coach(score>=total-1?`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b><small>${t().readDone}</small>`:`<b>${t().keepB}</b><small>${t().readRetry}</small>`, score>=total-1)}</div>`;
  }else{
    const c=document.getElementById("rc"); if(c) c.onclick=()=>{st.checked=true; reading(r,st)};
  }
}

/* --- palin: a match is 10 questions on Experto/Kimche forms; the pali moves one step per answer --- */
const TEAM_MAX=4, TEAM_PRICE=25;
function palinQs(){ return shuffle([...genFi(3),...genPl(2),...genAm(2),...genInv(2),...genCombo(1)]); }
function palin(msg){
  S=null; clearInterval(vidTimer);

  app.innerHTML=`<div class="top"><div><p class="eyebrow">${L2("Juego de equipo","Team game")}</p><h2>Palin</h2></div>${langToggle()}</div>
    ${open?"":`<div class="rule">🔒 ${t().locked(needOf("kim"))}</div>`}
    <div class="bar-top">${purse()}<span class="purse">🏆 ${palinWins}</span><button class="btn ghost" id="bk" style="padding:8px 14px">${t().menu}</button></div>
    ${palinField(0,team,null)}
    <div class="rule">${L2(`Cada respuesta correcta empuja la <b>pali</b> hacia la meta rival; cada error la acerca a la tuya. Llega a la meta para anotar. Cada <b>palife</b> de tu equipo salva un error por partido. Ganar paga 25 ngülliw más 2 por respuesta correcta.`,
      `Each right answer pushes the <b>pali</b> toward the rival goal; each mistake brings it toward yours. Reach the goal to score. Each <b>palife</b> on your team saves one mistake per match. A win pays 25 ngülliw plus 2 per right answer.`)}</div>

    <div class="row"><button class="btn" id="play" ${open?"":"disabled"}>${L2("Jugar un partido","Play a match")}</button>
      <button class="btn ghost" id="recruit" ${!open||team>=TEAM_MAX||nuts<TEAM_PRICE?"disabled":""}>${team>=TEAM_MAX?L2("Equipo completo","Team full"):`${NUT}${TEAM_PRICE} · ${L2("Sumar un palife","Add a palife")}`}</button></div>
    <p class="muted">${L2(`Tu equipo: ${team} palife (${team} salvada${team>1?"s":""} por partido).`,`Your team: ${team} palife (${team} save${team>1?"s":""} per match).`)}</p>`;
  bindLang(()=>palin());
  document.getElementById("bk").onclick=menu;
  document.getElementById("recruit").onclick=()=>{ if(nuts<TEAM_PRICE||team>=TEAM_MAX) return; nuts-=TEAM_PRICE; team++; save("nuts",nuts); save("team",team); palin(L2("Nuevo palife en tu equipo.","A new palife joins your team.")); };
  document.getElementById("play").onclick=()=>{ P={qs:palinQs(),i:0,ball:0,us:0,them:0,saves:team,right:0}; palinRound(); };
}
function palinField(ball,mine,flash){
  const x=180+ball*42;
  const fig=(cx,c)=>`<g transform="translate(${cx} 0)"><circle cy="50" r="7" fill="#a8714d"/><rect x="-6" y="57" width="12" height="18" fill="${c}"/><path d="M-4 75 V90 M4 75 V90" stroke="#3b3548" stroke-width="4"/></g>`;
  const ours=Array.from({length:mine},(_,i)=>fig(60+i*22,"#c8322f")).join(""), theirs=Array.from({length:4},(_,i)=>fig(300-i*22,"#2f5fd0")).join("");
  return `<svg viewBox="0 0 360 130" class="palinsvg" role="img" aria-label="palin">
    <rect width="360" height="130" fill="#5a8d4a"/><path d="M12 108 H348" stroke="#e9e3cf" stroke-width="1.5" opacity=".8"/>
    <rect x="4" y="96" width="6" height="24" fill="#c8322f"/><rect x="350" y="96" width="6" height="24" fill="#2f5fd0"/>
    ${[-3,-2,-1,0,1,2,3].map(k=>`<circle cx="${180+k*42}" cy="108" r="2" fill="#e9e3cf" opacity=".6"/>`).join("")}
    ${ours}${theirs}
    <circle class="pali${flash?" "+flash:""}" cx="${x}" cy="104" r="6" fill="#f3efe6" stroke="#8a6a3a"/></svg>`;
}
let P=null;
function palinRound(fb){
  if(P.i>=P.qs.length) return palinEnd();
  const q=P.qs[P.i], showForm=P.i%2===0;
  const opts=shuffle([q,...q.dist]);
  app.innerHTML=`<div class="hud"><button class="btn ghost" id="bk" style="padding:6px 12px;font-size:.9rem">Palin</button>
      <span class="score">${L2("Tú","You")} ${P.us} – ${P.them} ${L2("Rival","Rival")}</span><span class="muted">${P.i+1}/${P.qs.length} · ${L2("salvadas","saves")} ${P.saves}</span></div>
    ${palinField(P.ball,team,fb||null)}
    <div class="prompt"><span class="ask">${showForm?t().whichPic:t().which}</span>
      ${showForm?`<span class="big" style="font-size:1.9rem">${esc(G(q.m))}</span>`:`<div class="scene">${esc(gl(q))}</div>`}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" style="${showForm?"font-family:var(--body);font-weight:700;font-size:1rem":""}">${esc(showForm?gl(o):G(o.m))}</button>`).join("")}</div>`;
  document.getElementById("bk").onclick=()=>palin();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===q; let flash=ok?"fwd":"back";
    if(ok){ P.right++; P.ball++; if(P.ball>=3){ P.us++; P.ball=0; flash="goal"; } }
    else if(P.saves>0){ P.saves--; flash="saved"; }
    else { P.ball--; if(P.ball<=-3){ P.them++; P.ball=0; flash="lost"; } }
    app.querySelectorAll(".opt").forEach((x,i)=>{ x.disabled=true; if(opts[i]===q) x.classList.add("ok"); else if(x===b) x.classList.add("bad"); });
    P.i++; setTimeout(()=>palinRound(flash), ok?650:1300);
  });
}
function palinEnd(){
  const win=P.us>P.them, draw=P.us===P.them;
  const earned=(win?25:draw?10:0)+2*P.right; nuts+=earned; save("nuts",nuts);
  if(win){ palinWins++; save("palinWins",palinWins); }
  app.innerHTML=`<div class="result pop"><p class="eyebrow">Palin</p><h2>${win?L2("¡Ganaste el partido!","You won the match!"):draw?L2("Empate","Draw"):L2("Ganó el rival","The rival won")}</h2>
    <p class="score">${P.us} – ${P.them}</p><p>${t().score(P.right,P.qs.length)}</p>
    <span class="gain">+${earned} ${NUT}</span>
    ${coach(win?`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b>`:`<b>${t().keepB}</b>`, win)}</div>
    <div class="row"><button class="btn" id="ag">${L2("Otro partido","Another match")}</button><button class="btn ghost" id="pb">Palin</button></div>`;
  document.getElementById("ag").onclick=()=>{ P={qs:palinQs(),i:0,ball:0,us:0,them:0,saves:team,right:0}; palinRound(); };
  document.getElementById("pb").onclick=()=>palin();
}

const PRON=(()=>{
  const SEG=[["tr","ʈʂ"],["ch","tʃ"],["ng","ŋ"],["ll","ʎ"],["sh","ʃ"],["a","a"],["e","e"],["i","i"],["o","o"],["u","u"],["ü","ɨ"],["k","k"],["p","p"],["t","t"],["f","f"],["d","θ"],["g","ɣ"],["l","l"],["m","m"],["n","n"],["ñ","ɲ"],["r","ɻ"],["s","s"],["w","w"],["y","j"],["b","b"],["v","f"],["z","s"],["c","k"],["j","x"],["x","ks"],["h",""]];
  const V=new Set(["a","e","i","o","u","ü"]);
  const HARD=["ü","ng","tr","d","ll","r","g"];
  const OVR={};   // word -> stressed-syllable index, for analyst corrections
  const clean=w=>w.toLowerCase().normalize("NFC").replace(/[áàâ]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i").replace(/[óò]/g,"o").replace(/[úù]/g,"u").replace(/[^a-zñü]/g,"");
  function segs(w){ const out=[]; let i=0; while(i<w.length){ const s=SEG.find(([g])=>w.startsWith(g,i)); if(s){out.push(s);i+=s[0].length}else i++; } return out; }
  function syll(sg){
    const vi=sg.map((s,i)=>V.has(s[0])?i:-1).filter(i=>i>=0);
    if(!vi.length) return [sg];
    const cuts=[];
    for(let k=0;k<vi.length-1;k++){ const a=vi[k], b=vi[k+1], run=b-a-1; cuts.push(run===0?b:b-1); }
    const out=[]; let st=0; for(const c of cuts){ out.push(sg.slice(st,c)); st=c; } out.push(sg.slice(st)); return out;
  }
  function word(raw){
    const w=clean(raw); if(!w) return null;
    const sg=segs(w), sy=syll(sg);
    let st = w in OVR ? OVR[w] : (sy.length<2 ? 0 : (V.has(sg[sg.length-1][0]) ? sy.length-2 : sy.length-1));
    return {w, sg:sy, sy:sy.map(s=>s.map(x=>x[0]).join("")), ipa:sy.map(s=>s.map(x=>x[1]).join("")), st, hard:HARD.filter(h=>sg.some(x=>x[0]===h))};
  }
  function phrase(text){ return text.replace(/-/g,"").split(/[\s«»“”"¿?¡!.,;:…()]+/).map(word).filter(Boolean); }
  return {word, phrase, HARD};
})();

// ===== Repaso: words missed anywhere come back until they are answered right twice in a row =====
let missLog=load("miss")||{};
const findLevel=id=>ALL_LEVELS.find(l=>l.id===id)||(PRON_LVL.id===id?PRON_LVL:null);
function logMiss(w,lvl){
  const src=w._lvl||lvl; if(!src||src.repaso||w.prompt) return;
  if(!src.words && !(w.dist&&w.dist.length)) return;            // generated items are only kept when they carry their own options
  const k=src.id+"|"+w.m, e=missLog[k]||{lvl:src.id,m:w.m,n:0};
  e.n++; e.streak=0; e.t=Date.now();
  if(!src.words){ e.es=w.es; e.en=w.en; e.ow=!!w.oneWay; e.d=w.dist.map(x=>({m:x.m,es:x.es,en:x.en})); }
  missLog[k]=e; save("miss",missLog);
}
function logRight(w,lvl){
  const src=w._lvl||lvl; if(!src) return; const k=src.id+"|"+w.m, e=missLog[k]; if(!e) return;
  e.streak=(e.streak||0)+1; if(e.streak>=2) delete missLog[k]; save("miss",missLog);
}
function repasoItems(){
  return Object.values(missLog).sort((a,b)=>(b.n-a.n)||(a.t-b.t)).map(e=>{
    const L=findLevel(e.lvl); if(!L) return null;
    if(L.words){ const w=L.words.find(x=>x.m===e.m); return w?{...w,_lvl:L}:null; }
    return e.d?{m:e.m,es:e.es,en:e.en,oneWay:e.ow,dist:e.d,_lvl:L}:null;
  }).filter(Boolean);
}
function openRepaso(){
  const items=repasoItems().slice(0,10);
  if(!items.length){ menu(); return; }
  intro({id:"quiz-repaso",repaso:true,mt:"Repaso",es:"Palabras que fallaste",en:"Words you missed",kind:"mixed",words:items,gen:()=>shuffle(items),backTo:menu});
}

// ===== Running vocabulary list: every word from completed levels, read lecturas and owned epew chapters =====
function vocabWords(){
  const out=[], seen=new Set();
  const add=(m,es,en,src)=>{ const k=m.toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push({m,es,en,src}); };
  STAGES.forEach(st=>st.levels.forEach(l=>{ if(l.words && (best[l.id]||0)>0) l.words.forEach(w=>add(w.m,w.es,w.en,title(l))); }));
  READINGS.forEach(r=>{ if((best[readKey(r)]||0)>0 && r.gloss) r.gloss.forEach(([m,es,en])=>add(m,es,en,r.title)); });
  EPEW.forEach((c,i)=>{ if(epewOwned.includes(i) && c.gloss) c.gloss.forEach(([m,es,en])=>add(m,es,en,"Epew: "+c.t)); });
  return out;
}

  else { const groups=[]; list.forEach(w=>{ let g=groups.find(x=>x.src===w.src); if(!g){g={src:w.src,ws:[]};groups.push(g)} g.ws.push(w); });
    body=groups.map(g=>`<p class="eyebrow vgrp">${esc(g.src)} · ${g.ws.length}</p><div class="vlist">${g.ws.map(row).join("")}</div>`).join(""); }
  app.innerHTML=`
    <div class="top"><div><p class="eyebrow">${L2("Tu vocabulario","Your vocabulary")}</p><h2>${L2("Mis palabras","My words")}</h2></div>${langToggle()}</div>
    <p>${L2(`Llevas <b>${all.length}</b> palabras y frases. La lista crece con cada nivel que completas, cada lectura que lees y cada capítulo de epew.`,`You have <b>${all.length}</b> words and phrases. The list grows with every level you finish, every reading you complete and every epew chapter.`)}</p>
    <div class="bar-top vbar-top"><input id="vq" type="search" value="${esc(vocabQ)}" placeholder="${L2("Buscar…","Search…")}" aria-label="${L2("Buscar","Search")}">
      <button class="btn ghost" id="vs" style="padding:8px 14px">${vocabSort==="az"?L2("Por nivel","By level"):"A–Z"}</button>
      <button class="btn ghost" id="bk" style="padding:8px 14px">${t().menu}</button></div>
    <div id="vbody">${body}</div>`;
  bindLang(vocab);
  document.getElementById("bk").onclick=menu;
  document.getElementById("vs").onclick=()=>{ vocabSort=vocabSort==="az"?"src":"az"; vocab(); };
  app.querySelectorAll("details.vrow").forEach(d=>d.addEventListener("toggle",()=>{ const box=d.querySelector(".vpr"); if(!d.open) return;
    const fill=()=>{ box.innerHTML=pronHTML(box.dataset.m); bindPron(box,fill); }; fill(); }));
  const inp=document.getElementById("vq");
  inp.oninput=()=>{ vocabQ=inp.value; vocab(); const i2=document.getElementById("vq"); i2.focus(); i2.setSelectionRange(i2.value.length,i2.value.length); };
}

// ===== Wardrobe =====
function wardrobe(msg){
  S=null;
  const p=PEOPLE.find(x=>x.id===selPerson)||PEOPLE[0];
  const of=outfits[p.id]||{};
  const ORD=["body","cloak","belt","neck","chest","pin","head","ears","hand","pet","bg"];
  const list=ITEMS.filter(it=>fits(it,p)).sort((a,b)=>ORD.indexOf(a.slot)-ORD.indexOf(b.slot));
  app.innerHTML=`
    <div class="top"><div><p class="eyebrow">ngülliw</p><h2>${t().wardrobe}</h2></div>${langToggle()}</div>
    <p>${t().wardSub}</p>
    <div class="bar-top">${purse()}<button class="btn ghost" id="bk" style="padding:8px 14px">${t().menu}</button></div>
    <div class="chars" role="group">${PEOPLE.map(x=>`<button class="chip" data-p="${x.id}" aria-pressed="${x.id===p.id}">${x.id}</button>`).join("")}</div>
    <div class="dress">
      <div class="stagefig">${figureSVG(p,of)}<span class="nm">${p.id}</span><span class="rl">${esc(gl(p))}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="toast" aria-live="polite" style="min-height:1.4em">${msg?esc(msg):""}</div>
        <div class="items">${list.map(it=>{
          const has=owned.includes(it.id), on=of[it.slot]===it.id;
          const btn = !has
            ? `<button class="btn" data-buy="${it.id}" ${nuts<it.price?"disabled":""}>${NUT}${it.price} · ${t().buy}</button>`
            : on ? `<button class="btn ghost" data-off="${it.id}">${t().remove}</button>`
                 : `<button class="btn" data-on="${it.id}">${t().wear}</button>`;
          return `<div class="item${on?" on":""}">
            <div class="th"><svg viewBox="${it.vb}" aria-hidden="true">${it.svg}</svg></div>
            <span class="nm">${esc(G(it.m))}</span><span class="gl">${esc(gl(it))}</span>${btn}</div>`}).join("")}</div>
      </div>
    </div>`;
  bindLang(()=>wardrobe());
  document.getElementById("bk").onclick=menu;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{selPerson=b.dataset.p;save("selPerson",selPerson);wardrobe()});
  app.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(i=>i.id===b.dataset.buy);
    if(nuts<it.price) return wardrobe(t().need(it.price-nuts));
    nuts-=it.price; owned.push(it.id); save("nuts",nuts); save("owned",owned);
    outfits[p.id]={...(outfits[p.id]||{}),[it.slot]:it.id}; save("outfits",outfits);
    wardrobe(t().bought(it.m));
  });
  app.querySelectorAll("[data-on]").forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(i=>i.id===b.dataset.on);
    outfits[p.id]={...(outfits[p.id]||{}),[it.slot]:it.id}; save("outfits",outfits); wardrobe();
  });
  app.querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(i=>i.id===b.dataset.off);
    const o={...(outfits[p.id]||{})}; delete o[it.slot]; outfits[p.id]=o; save("outfits",outfits); wardrobe();
  });
}

menu();
</script>

<script>
/* Visit, install and lesson counts sent to GoatCounter as a 1x1 image request (no cookies, no personal data, no third-party
   script, so script blockers that stop gc.zgo.at don't stop it). Nothing is sent from a file copy or while offline. */
(function(){
  if(location.protocol!=='https:') return;
  var BASE='https://brogers36.goatcounter.com/count';
  function gc(path,title,event){ try{
    var u=BASE+'?p='+encodeURIComponent(path)+'&t='+encodeURIComponent(title||'')+(event?'&e=true':'')+
      (event?'':'&r='+encodeURIComponent(document.referrer||''))+'&s='+encodeURIComponent(screen.width+','+screen.height+','+(window.devicePixelRatio||1))+
      '&rnd='+Math.random().toString(36).slice(2);
    var img=new Image(); img.src=u; }catch(e){} }
  window.mpkCount=function(p,t){ gc(p,t,true); };
  gc(location.pathname||'/', document.title, false);
  window.addEventListener('appinstalled',function(){ gc('app-installed','App installed',true); });
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  var seen=false; try{ seen=sessionStorage.getItem('mpk_gc_launch')==='1'; }catch(e){}
  if(standalone && !seen){ try{ sessionStorage.setItem('mpk_gc_launch','1'); }catch(e){} gc('home-screen-launch','Opened from home screen',true); }
})();
</script>
