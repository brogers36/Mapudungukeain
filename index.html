const readKey = r => "quiz-"+r.id;   // "quiz-" keeps reading stars out of stage unlocking
const readOpen = r => totalStars() >= STAGES.find(st=>st.id===r.stage).need;

function readingList(){
  S=null; clearInterval(vidTimer);
  __back=()=>menu(); app.innerHTML=`${backLink()}
    <div class="top"><div><p class="eyebrow">Mapudungun</p><h2>${t().reading}</h2></div>${langToggle()}</div>
    <p>${t().readSub}</p>
    <div class="bar-top">${purse()}<button class="btn ghost" id="bk" style="padding:8px 14px">${t().menu}</button></div>
    <div class="readlist">${READINGS.slice().sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage)).map(r=>{const open=readOpen(r), st=STAGES.find(x=>x.id===r.stage);
      return `<button class="rcard" data-r="${r.id}" ${open?"":"disabled"}>
        <span class="lvlname">${esc(gl(st))}</span>
        <span class="mt">${esc(G(r.title))}</span><span class="gl">${esc(gl(r.sub))}</span>
        ${open?starsHTML(best[readKey(r)]||0):`<span class="gl">🔒 ${t().locked(st.need)}</span>`}</button>`}).join("")}</div>`;
  bindLang(readingList);
  document.getElementById("bk").onclick=menu;
  app.querySelectorAll(".rcard:not(:disabled)").forEach(b=>b.onclick=()=>{const r=READINGS.find(r=>r.id===b.dataset.r); track("reading/"+r.id,"Lectura: "+r.title); reading(r);});
}

function reading(r, state){
  const st = state || {order:r.qs.map(q=>shuffle(q.o.es.map((_,i)=>i))), pick:r.qs.map(()=>null), checked:false};
  const done=st.checked;
  const score = done ? st.pick.filter(x=>x===0).length : 0;
  __back=()=>readingList(); app.innerHTML=`${backLink()}
    <div class="top"><div><p class="eyebrow">${esc(gl(r.sub))}</p><h2>${esc(G(r.title))}</h2></div>${langToggle()}</div>
    <div class="passage">${r.lines.map(l=>`<p class="line">${l.who?`<span class="who">${esc(G(l.who))}:</span> `:""}<span class="mz">${esc(G(l.m))}</span>${done?`<span class="tr">${esc(gl(l))}</span>`:""}</p>`).join("")}</div>
    <details class="gloss"><summary>${t().glossary}</summary><div class="chips">${r.gloss.map(g=>`<span><b>${esc(G(g[0]))}</b> ${esc(lang==="es"?g[1]:g[2])}</span>`).join("")}</div></details>
    <div class="qs">${r.qs.map((q,qi)=>`
      <fieldset class="q"><legend>${qi+1}. ${esc(gl(q))}</legend>
        <div class="choices">${st.order[qi].map(oi=>{
          const sel=st.pick[qi]===oi, cls=done?(oi===0?" ok":sel?" bad":""):"";
          return `<button class="choice${cls}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel}" ${done?"disabled":""}>${esc(q.o[lang][oi])}</button>`}).join("")}</div>
      </fieldset>`).join("")}</div>
    <div id="rfb"></div>
    <div class="row">${done
      ? `<button class="btn" id="ra">${t().again}</button><button class="btn ghost" id="rl">${t().reading}</button>`
      : `<button class="btn" id="rc" ${st.pick.includes(null)?"disabled":""}>${t().check}</button><button class="btn ghost" id="rl">${t().back}</button>`}</div>`;
  bindLang(()=>reading(r,st));
  app.querySelectorAll(".choice:not(:disabled)").forEach(b=>b.onclick=()=>{st.pick[+b.dataset.q]=+b.dataset.o; reading(r,st)});
  document.getElementById("rl").onclick=readingList;
  if(done){
    document.getElementById("ra").onclick=()=>reading(r);
    const total=r.qs.length, stars=score===total?3:score>=total-1?2:score>0?1:0;
    if(!st.paid){
      st.earned=score*3+stars*3; st.paid=true; nuts+=st.earned; save("nuts",nuts);
      if(stars>(best[readKey(r)]||0)){best[readKey(r)]=stars;save("best",best)}
      st.stars=stars;
    }
    document.getElementById("rfb").innerHTML=`<div class="result">${starsHTML(st.stars)}<p>${t().score(score,total)}</p>
      <span class="gain">+${st.earned} ${NUT}</span>
      ${coach(score>=total-1?`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b><small>${t().readDone}</small>`:`<b>${t().keepB}</b><small>${t().readRetry}</small>`, score>=total-1)}</div>`;
  }else{
    const c=document.getElementById("rc"); if(c) c.onclick=()=>{st.checked=true; reading(r,st)};
  }
}

/* ===== Progress backup: everything is stored only on this device (localStorage, keys "mpk_…"). Uninstalling the app
   or clearing the browser's data for the site erases it, so players can save a copy (file or code) and restore it,
   also to move their progress to another phone or browser. ===== */
function progData(){ const d={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("mpk_")) d[k]=localStorage.getItem(k); } }catch(e){} return d; }
function progCode(){ const j=JSON.stringify({app:"mapudungukeain",v:1,at:new Date().toISOString(),d:progData()}); return "MPK1:"+btoa(unescape(encodeURIComponent(j))); }
function progParse(txt){ txt=String(txt||"").trim(); let j=null;
  try{ if(/^MPK1:/.test(txt)) j=JSON.parse(decodeURIComponent(escape(atob(txt.slice(5).replace(/\s+/g,""))))); else j=JSON.parse(txt); }catch(e){ return null; }
  if(!j||j.app!=="mapudungukeain"||typeof j.d!=="object") return null;
  const d={}; for(const [k,v] of Object.entries(j.d)) if(/^mpk_[\w.-]+$/.test(k)&&typeof v==="string") d[k]=v; return {at:j.at||"",d}; }

/* ===== Online copy (sync code). The game sends its save data to a small service under a random code (no name or
   email); the same code on another phone brings the progress back. SYNC_URL empty = feature off. ===== */
var SYNC_URL="https://mapudungukeain-sync.mapupeyumfe.workers.dev";
var syncSt=()=>{ try{ return JSON.parse(localStorage.getItem("mpksync"))||null; }catch(e){ return null; } };
const syncSet=v=>{ try{ v?localStorage.setItem("mpksync",JSON.stringify(v)):localStorage.removeItem("mpksync"); }catch(e){} };
function progHash(d){ const j=JSON.stringify(Object.keys(d).sort().map(k=>[k,d[k]])); let h=5381; for(let i=0;i<j.length;i++) h=((h<<5)+h+j.charCodeAt(i))|0; return String(h); }
async function syncApi(path,opt){ const r=await fetch(SYNC_URL.replace(/\/$/,"")+path,Object.assign({headers:{"Content-Type":"application/json"}},opt||{})); let b=null; try{ b=await r.json(); }catch(e){} return {status:r.status,body:b}; }
function progApply(d){ Object.keys(progData()).forEach(k=>localStorage.removeItem(k)); for(const [k,v] of Object.entries(d)) if(/^mpk_/.test(k)&&typeof v==="string") localStorage.setItem(k,v); }
let syncTimer=null, syncBusy=false;
async function syncPush(force){
  const st=syncSt(); if(!SYNC_URL||!st||!st.code||syncBusy) return;
  const d=progData(), h=progHash(d); if(!force&&h===st.hash) return;
  syncBusy=true;
  try{
    let r=await syncApi("/p/"+encodeURIComponent(st.code),{method:"PUT",body:JSON.stringify({data:d,base:force?"force":st.base}),keepalive:true});
    if(r.status===409){ /* changed on another phone too: the latest play wins */ r=await syncApi("/p/"+encodeURIComponent(st.code),{method:"PUT",body:JSON.stringify({data:d,base:"force"}),keepalive:true}); }
    if(r.status===200&&r.body){ syncSet({code:st.code,base:r.body.updated,hash:h,at:Date.now()}); }
  }catch(e){} finally{ syncBusy=false; }
}
window.syncSoon=()=>{ if(!SYNC_URL||!syncSt()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncPush(false),4000); };
async function syncPull(){ /* at start: take the online copy if it is newer and this phone has not changed since the last sync */
  const st=syncSt(); if(!SYNC_URL||!st||!st.code) return;
  try{ const r=await syncApi("/p/"+encodeURIComponent(st.code)); if(r.status!==200||!r.body) return;
    const d=r.body.data||{}, local=progData();
    if(r.body.updated>st.base){
      if(progHash(local)===st.hash||!Object.keys(local).length){ progApply(d); syncSet({code:st.code,base:r.body.updated,hash:progHash(d),at:Date.now()}); location.reload(); }
      else syncPush(true);
    } else syncPush(false);
  }catch(e){} }
if(SYNC_URL){ document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") syncPush(false); }); setTimeout(syncPull,1500); }
function syncSection(){
  if(!SYNC_URL) return "";
  const st=syncSt();
  if(st&&st.code) return `<h3>${L2("Copia en línea","Online copy")}</h3>
    <p>${L2("Tu progreso se guarda en línea con este código. Anótalo: en otro teléfono, o si desinstalas la app, lo recuperas con él.","Your progress is saved online under this code. Write it down: on another phone, or if you uninstall the app, it brings your progress back.")}</p>
    <p class="synccode" style="font:700 1.3rem ui-monospace,monospace;letter-spacing:.04em;user-select:all">${esc(st.code)}</p>
    <div class="row"><button class="btn ghost" id="sy-copy">📋 ${L2("Copiar código","Copy code")}</button><button class="btn ghost" id="sy-now">🔄 ${L2("Guardar ahora","Save now")}</button></div>
    <p class="hint" id="sy-msg" aria-live="polite">${st.at?L2(`Última vez guardado: ${new Date(st.at).toLocaleString("es-CL",{hour12:false})}`,`Last saved: ${new Date(st.at).toLocaleString("en-US",{hour12:false})}`):""}</p>
    <div class="row"><button class="btn ghost" id="sy-off">${L2("Dejar de guardar en línea en este teléfono","Stop saving online on this phone")}</button></div>`;
  return `<h3>${L2("Copia en línea","Online copy")}</h3>
    <p>${L2("Guarda tu progreso en línea con un código, sin nombre ni correo. Con el código lo recuperas en otro teléfono o si desinstalas la app.","Save your progress online under a code, with no name or email. The code brings it back on another phone or if you uninstall the app.")}</p>
    <div class="row"><button class="btn" id="sy-on">☁️ ${L2("Guardar en línea","Save online")}</button></div>
    <p class="hint">${L2("¿Ya tienes un código?","Already have a code?")}</p>
    <div class="row"><input id="sy-code" placeholder="kawellu-xxxx-xxxx" autocapitalize="none" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;font:inherit;padding:8px" aria-label="${L2("Código","Code")}"><button class="btn ghost" id="sy-get">${L2("Recuperar","Restore")}</button></div>
    <p class="hint" id="sy-msg" aria-live="polite"></p><div id="sy-confirm"></div>`;
}
function bindSync(){
  if(!SYNC_URL) return;
  const msg=t=>{ const m=document.getElementById("sy-msg"); if(m) m.textContent=t; };
  const off=L2("No hay conexión con el servicio. Prueba más tarde.","Can't reach the service. Try again later.");
  const b=id=>document.getElementById(id);
  if(b("sy-on")) b("sy-on").onclick=async()=>{ msg("…"); try{ const r=await syncApi("/new",{method:"POST"}); if(r.status!==201) throw 0;
      syncSet({code:r.body.code,base:r.body.updated,hash:null}); await syncPush(false); track("progress/sync-on","Copia en línea"); progress(); }catch(e){ msg(off); } };
  if(b("sy-get")) b("sy-get").onclick=async()=>{ const code=(b("sy-code").value||"").trim().toLowerCase(); if(!code) return; msg("…");
    try{ const r=await syncApi("/p/"+encodeURIComponent(code)); if(r.status===404){ msg(L2("No encontré ese código. Revisa que esté bien escrito.","That code wasn't found. Check the spelling.")); return; } if(r.status!==200) throw 0;
      const d=r.body.data||{}, when=new Date(r.body.updated).toLocaleString(lang==="es"?"es-CL":"en-US",{hour12:false});
      msg(""); b("sy-confirm").innerHTML=`<p>${L2(`Progreso guardado el ${when}. ¿Reemplazar el de este teléfono con él?`,`Progress saved on ${when}. Replace the progress on this phone with it?`)}</p><div class="row"><button class="btn" id="sy-yes">${L2("Sí, recuperar","Yes, restore")}</button><button class="btn ghost" id="sy-no">${L2("Cancelar","Cancel")}</button></div>`;
      b("sy-no").onclick=()=>{ b("sy-confirm").innerHTML=""; };
      b("sy-yes").onclick=()=>{ progApply(d); syncSet({code,base:r.body.updated,hash:progHash(progData()),at:Date.now()}); track("progress/sync-restore","Recuperar en línea"); location.reload(); };
    }catch(e){ msg(off); } };
  if(b("sy-copy")) b("sy-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(syncSt().code); msg(L2("Código copiado.","Code copied.")); }catch(e){ msg(L2("Anota el código de arriba.","Write down the code above.")); } };
  if(b("sy-now")) b("sy-now").onclick=async()=>{ msg("…"); await syncPush(true); const st=syncSt(); msg(st&&st.at&&Date.now()-st.at<10000?L2("Guardado.","Saved."):off); };
  if(b("sy-off")) b("sy-off").onclick=()=>{ syncSet(null); progress(); };
}

    <div class="lofwrap">${lofScene(sel,lofEnv)}</div>

    ${p?`<div class="lofcard"><b>${esc(G(p.m))}</b> <span class="muted">${esc(gl(p))}</span><p class="lofsent">${esc(G(p.ma))}</p><p class="muted">${esc(L2(p.ses,p.sen))}</p></div>`
       :`<p class="muted">${ownHere?L2("Toca algo de tu lof para leer su frase.","Tap something in your lof to read its sentence."):L2(`Compra la primera pieza para empezar: ${gl(E)}.`,`Buy the first piece to start: ${gl(E)}.`)}</p>`}
    <div class="items">${here.map(x=>{ const own=lofOwned.includes(x.id);
      const lock=x.req&&!lofOwned.includes(x.req), rq=lock?LOF.find(q=>q.id===x.req):null;
      return `<div class="item${own?" on":""}"><div class="th">${lfThumb(x)}</div><span class="nm">${esc(G(x.m))}</span><span class="gl">${esc(gl(x))}</span>${lock&&!own?`<span class="gl">🔒 ${L2("Primero","First")}: ${esc(G(rq.m))}</span>`:""}
        ${own?`<button class="btn ghost" data-see="${x.id}">${L2("Ver","View")}</button>`
             :`<button class="btn" data-lbuy="${x.id}" ${!open||lock||nuts<x.price?"disabled":""}>${NUT}${x.price} · ${t().buy}</button>`}</div>`}).join("")}</div>
    ${ownHere===here.length?`<div class="rule">${L2(`¡Completaste ${G(E.m)}! Kümey.`,`You completed ${G(E.m)}! Kümey.`)}${lofEnvs.length<LOF_ENVS.length?" "+L2("Ahora puedes abrir otro lugar.","Now you can open another place."):""}</div>`:""}`;
  bindLang(()=>lof(sel));
  document.getElementById("bk").onclick=menu;
  app.querySelectorAll("[data-env]").forEach(b=>b.onclick=()=>{ lofEnv=b.dataset.env; save("lofEnvCur",lofEnv); lof(); });
  app.querySelectorAll("[data-ebuyenv]").forEach(b=>b.onclick=()=>{ const e=LOF_ENVS.find(q=>q.id===b.dataset.ebuyenv);
    if(nuts<e.price) return lof(null,t().need(e.price-nuts));
    nuts-=e.price; lofEnvs.push(e.id); lofEnv=e.id; save("nuts",nuts); save("lofEnvs",lofEnvs); save("lofEnvCur",lofEnv); lof(null,t().bought(e.m)); });
  app.querySelectorAll(".lp").forEach(g=>{ g.onclick=()=>lof(g.dataset.id); g.onkeydown=e=>{ if(e.key==="Enter") lof(g.dataset.id); }; });
  app.querySelectorAll("[data-see]").forEach(b=>b.onclick=()=>lof(b.dataset.see));

}

/* who struck the pali this turn: one of yours after a right answer, a rival after a mistake */
function palHit(flash,from){
  if(!flash||from==null) return "";
  const fx=PAL_X(Math.max(-2.6,Math.min(2.6,from)));
  const rival=flash==="back"||flash==="lost"||flash==="saved";
  const fig=rival?palFig(fx+15,112,"#2f5fd0","#1b3a85",-1,1.08,1):palFig(fx-15,112,"#c8322f","#7a1c1a",1,1.08,1);
  const burst=`<g transform="translate(${fx} 104)" class="pal-burst"><path d="M0 -9 L2 -3 L8 -5 L3.6 0 L8 5 L2 3 L0 9 L-2 3 L-8 5 L-3.6 0 L-8 -5 L-2 -3Z" fill="#ffe7a0" opacity=".85"/></g>`;
  const label=flash==="saved"?L2("¡Tu palife ataja!","Your palife blocks it!"):rival?L2("¡El rival devuelve la pali!","The rival hits it back!"):flash==="goal"?L2("¡Tripalin!","Goal!"):"";
  return `${burst}${fig}${label?`<g class="pal-lbl"><rect x="${rival?118:126}" y="66" width="${rival?124:108}" height="17" rx="8.5" fill="${rival?"#1b3a85":"#7a1c1a"}" opacity=".9"/><text x="180" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" font-family="inherit">${label}</text></g>`:""}`;
}

function palinRound(fb){

      return `<div class="item${own?" on":""}"><span class="gl">${L2("Capítulo","Chapter")} ${n+1}</span><span class="nm">${esc(G(c.t))}</span>
        ${own?`<button class="btn" data-read="${i}">${L2("Leer","Read")}${epewDone[i]?" ✓":""}</button>`
             :`<button class="btn" data-ebuy="${i}" ${!open||!next||nuts<c.price?"disabled":""}>${next?`${NUT}${c.price} · ${t().buy}`:"🔒"}</button>`}</div>`}).join("")}</div>`}).join("")}`;

function epewRead(i,st){
  const c=EPEW[i]; st=st||{show:{},pick:c.qs.map(()=>null),order:c.qs.map(q=>shuffle(q.o.es.map((_,k)=>k))),checked:false};
  const score=st.checked?st.pick.filter(x=>x===0).length:0;
  const chN=EPEW.slice(0,i+1).filter(x=>epS(x)===epS(c)).length, nx=epewNext(i);
  __back=()=>epew(); app.innerHTML=`${backLink()}<div class="top"><div><p class="eyebrow">${esc(G(EPEW_STORIES[epS(c)].t))} · ${L2("Capítulo","Chapter")} ${chN}</p><h2>${esc(G(c.t))}</h2></div>${langToggle()}</div>
    <p class="muted">${L2("Toca una línea para ver la traducción.","Tap a line to see its translation.")}</p>
    <div class="passage">${c.lines.map((l,k)=>`<p class="line" data-k="${k}" style="cursor:pointer"><span class="mz">${esc(G(l[0]))}</span>${st.show[k]||st.checked?`<span class="tr">${esc(lang==="es"?l[1]:l[2])}</span>`:""}</p>`).join("")}</div>
    <details class="gloss"><summary>${t().glossary}</summary><div class="chips">${c.gloss.map(g=>`<span><b>${esc(G(g[0]))}</b> ${esc(lang==="es"?g[1]:g[2])}</span>`).join("")}</div></details>
    <div class="qs">${c.qs.map((q,qi)=>`<fieldset class="q"><legend>${qi+1}. ${esc(gl(q))}</legend><div class="choices">${st.order[qi].map(oi=>{
      const sel=st.pick[qi]===oi, cls=st.checked?(oi===0?" ok":sel?" bad":""):"";
      return `<button class="choice${cls}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel}" ${st.checked?"disabled":""}>${esc(q.o[lang][oi])}</button>`}).join("")}</div></fieldset>`).join("")}</div>
    <div id="efb"></div>
    <div class="row">${st.checked?`<button class="btn" id="enext">${nx>=0?L2("Siguiente capítulo","Next chapter"):L2("Capítulos","Chapters")}</button>`
      :`<button class="btn" id="echeck" ${st.pick.includes(null)?"disabled":""}>${t().check}</button>`}<button class="btn ghost" id="eback">${L2("Capítulos","Chapters")}</button></div>`;
  bindLang(()=>epewRead(i,st));
  app.querySelectorAll(".line").forEach(l=>l.onclick=()=>{ st.show[l.dataset.k]=!st.show[l.dataset.k]; epewRead(i,st); });
  app.querySelectorAll(".choice:not(:disabled)").forEach(b=>b.onclick=()=>{ st.pick[+b.dataset.q]=+b.dataset.o; epewRead(i,st); });
  document.getElementById("eback").onclick=()=>epew();
  const ch=document.getElementById("echeck"); if(ch) ch.onclick=()=>{ st.checked=true;
    const k=st.pick.filter(x=>x===0).length; let gain=0; if(!epewDone[i]){ gain=3*k; nuts+=gain; save("nuts",nuts); epewDone[i]=k; save("epewDone",epewDone); }
    st.gain=gain; epewRead(i,st); };
  if(st.checked){ document.getElementById("efb").innerHTML=`<div class="result"><p>${t().score(score,c.qs.length)}</p>${st.gain?`<span class="gain">+${st.gain} ${NUT}</span>`:""}</div>`;
    document.getElementById("enext").onclick=()=>{ if(nx>=0 && epewOwned.includes(nx)) epewRead(nx); else epew(); }; }
}

const PRON=(()=>{
  const SEG=[["tr","ʈʂ"],["ch","tʃ"],["ng","ŋ"],["ll","ʎ"],["sh","ʃ"],["a","a"],["e","e"],["i","i"],["o","o"],["u","u"],["ü","ɨ"],["k","k"],["p","p"],["t","t"],["f","f"],["d","θ"],["g","ɣ"],["l","l"],["m","m"],["n","n"],["ñ","ɲ"],["r","ɻ"],["s","s"],["w","w"],["y","j"],["b","b"],["v","f"],["z","s"],["c","k"],["j","x"],["x","ks"],["h",""]];
  const V=new Set(["a","e","i","o","u","ü"]);
  const HARD=["ü","ng","tr","d","ll","r","g"];
  const OVR={};   // word -> stressed-syllable index, for analyst corrections
  const clean=w=>w.toLowerCase().normalize("NFC").replace(/[áàâ]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i").replace(/[óò]/g,"o").replace(/[úù]/g,"u").replace(/[^a-zñü]/g,"");
  function segs(w){ const out=[]; let i=0; while(i<w.length){ const s=SEG.find(([g])=>w.startsWith(g,i)); if(s){out.push(s);i+=s[0].length}else i++; } return out; }
  function syll(sg){
    const vi=sg.map((s,i)=>V.has(s[0])?i:-1).filter(i=>i>=0);
    if(!vi.length) return [sg];
    const cuts=[];
    for(let k=0;k<vi.length-1;k++){ const a=vi[k], b=vi[k+1], run=b-a-1; cuts.push(run===0?b:b-1); }
    const out=[]; let st=0; for(const c of cuts){ out.push(sg.slice(st,c)); st=c; } out.push(sg.slice(st)); return out;
  }
  function word(raw){
    const w=clean(raw); if(!w) return null;
    const sg=segs(w), sy=syll(sg);
    let st = w in OVR ? OVR[w] : (sy.length<2 ? 0 : (V.has(sg[sg.length-1][0]) ? sy.length-2 : sy.length-1));
    return {w, sg:sy, sy:sy.map(s=>s.map(x=>x[0]).join("")), ipa:sy.map(s=>s.map(x=>x[1]).join("")), st, hard:HARD.filter(h=>sg.some(x=>x[0]===h))};
  }
  function phrase(text){ return text.replace(/-/g,"").split(/[\s«»“”"¿?¡!.,;:…()]+/).map(word).filter(Boolean); }
  return {word, phrase, HARD};
})();
let pronIPA=!!load("ipa"), pronOn=false;
function pronHTML(text){
  const ws=PRON.phrase(text); if(!ws.length) return "";
  const hard=[...new Set(ws.flatMap(r=>r.hard))];
  const line=r=>r.sg.map((s,i)=>{ const t=s.map(([gr])=>PRON.HARD.includes(gr)?`<span class="hl">${esc(G(i===r.st?gr.toUpperCase():gr))}</span>`:esc(G(i===r.st?gr.toUpperCase():gr))).join("");
    return i===r.st?`<span class="st">${t}</span>`:t; }).join("·");
  const tip=h=>{ const ph=PHON.find(x=>x.g===h); const m=MOUTH[h];
    return `<div class="pt"><span class="pt-g">${esc(G(h))}</span><div><p>${ph?`<span class="pw-i">${esc(ph.ipa)}</span> ${esc(gl(ph))}`:""}</p>${m?`<div class="mouth">${m.svg()}<p>${esc(gl(m))}</p></div>`:""}</div></div>`; };
  return `<div class="pron">
    ${ws.map(r=>`<div class="pw"><span class="pw-w">${line(r)}</span>${pronIPA?`<span class="pw-i">[${r.ipa.map((x,i)=>(i===r.st?"ˈ":"")+x).join(".")}]</span>`:""}</div>`).join("")}
    ${hard.map(tip).join("")}
    <div class="pron-ft"><button class="chip" data-ipa aria-pressed="${pronIPA}">IPA</button><small>${L2("La sílaba en mayúsculas lleva el acento, según la regla general; puede variar.","The capitalised syllable carries the stress, by the general rule; it can vary.")}</small></div>
  </div>`;
}

// ===== Repaso: words missed anywhere come back until they are answered right twice in a row =====
let missLog=load("miss")||{};
const findLevel=id=>ALL_LEVELS.find(l=>l.id===id)||(PRON_LVL.id===id?PRON_LVL:null);
function logMiss(w,lvl){
  const src=w._lvl||lvl; if(!src||src.repaso||w.prompt) return;
  if(!src.words && !(w.dist&&w.dist.length)) return;            // generated items are only kept when they carry their own options
  const k=src.id+"|"+w.m, e=missLog[k]||{lvl:src.id,m:w.m,n:0};
  e.n++; e.streak=0; e.t=Date.now();
  if(!src.words){ e.es=w.es; e.en=w.en; e.ow=!!w.oneWay; e.d=w.dist.map(x=>({m:x.m,es:x.es,en:x.en})); }
  missLog[k]=e; save("miss",missLog);
}
function logRight(w,lvl){
  const src=w._lvl||lvl; if(!src) return; const k=src.id+"|"+w.m, e=missLog[k]; if(!e) return;
  e.streak=(e.streak||0)+1; if(e.streak>=2) delete missLog[k]; save("miss",missLog);
}
function repasoItems(){
  return Object.values(missLog).sort((a,b)=>(b.n-a.n)||(a.t-b.t)).map(e=>{
    const L=findLevel(e.lvl); if(!L) return null;
    if(L.words){ const w=L.words.find(x=>x.m===e.m); return w?{...w,_lvl:L}:null; }
    return e.d?{m:e.m,es:e.es,en:e.en,oneWay:e.ow,dist:e.d,_lvl:L}:null;
  }).filter(Boolean);
}
function openRepaso(){
  const items=repasoItems().slice(0,10);
  if(!items.length){ menu(); return; }
  intro({id:"quiz-repaso",repaso:true,mt:"Repaso",es:"Palabras que fallaste",en:"Words you missed",kind:"mixed",words:items,gen:()=>shuffle(items),backTo:menu});
}

// ===== Running vocabulary list: every word from completed levels, read lecturas and owned epew chapters =====
function vocabWords(){
  const out=[], seen=new Set();
  const add=(m,es,en,src)=>{ const k=m.toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push({m,es,en,src}); };
  STAGES.forEach(st=>st.levels.forEach(l=>{ if(l.words && (best[l.id]||0)>0) l.words.forEach(w=>add(w.m,w.es,w.en,title(l))); }));
  READINGS.forEach(r=>{ if((best[readKey(r)]||0)>0 && r.gloss) r.gloss.forEach(([m,es,en])=>add(m,es,en,r.title)); });
  EPEW.forEach((c,i)=>{ if(epewOwned.includes(i) && c.gloss) c.gloss.forEach(([m,es,en])=>add(m,es,en,"Epew: "+c.t)); });
  return out;
}

  else { const groups=[]; list.forEach(w=>{ let g=groups.find(x=>x.src===w.src); if(!g){g={src:w.src,ws:[]};groups.push(g)} g.ws.push(w); });
    body=groups.map(g=>`<p class="eyebrow vgrp">${esc(g.src)} · ${g.ws.length}</p><div class="vlist">${g.ws.map(row).join("")}</div>`).join(""); }
  __back=()=>menu(); app.innerHTML=`${backLink()}

    <div id="vbody">${body}</div>`;
  bindLang(vocab);
  document.getElementById("bk").onclick=menu;

  app.querySelectorAll("details.vrow").forEach(d=>d.addEventListener("toggle",()=>{ const box=d.querySelector(".vpr"); if(!d.open) return;

/* ===== Palin against another person (2026-11-12). The lobby is in Trawün (trawun/, tab Palin); the match is played here,
   at ?palin=ID, with the Trawün nickname kept on this phone. The service (tools/trawun/worker.js) decides every round
   from server times: one right answer pushes the pali one step; both right, the first one pushes; three steps is a goal.

var TRAWUN_API="https://mapudungukeain-trawun.mapupeyumfe.workers.dev";
const trawunMe=()=>{ try{ return JSON.parse(localStorage.getItem("trawun_me")); }catch(e){ return null; } };
async function twApi(path,body){ const r=await fetch(TRAWUN_API+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  let b=null; try{ b=await r.json(); }catch(e){} if(!r.ok) throw Object.assign(new Error((b&&b.error)||r.status),{status:r.status,body:b}); return b; }
function seededRandom(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededPalinQs(seed,n){ const R=Math.random; Math.random=seededRandom(seed); try{ let q=palinQs(0); while(q.length<n) q=q.concat(palinQs(0)); return q.slice(0,n); } finally{ Math.random=R; } }

function palinOnlineEnd(){

  /* ngülliw as in a friendly match, paid once per match on this phone; nothing for the one who left */

  if(!iLeft && !paid.includes(st.id)){ earned=(win?25:draw?10:0)+2*right; nuts+=earned; save("nuts",nuts); if(win){ palinWins++; save("palinWins",palinWins); }
    save("palOnPaid",paid.concat(st.id).slice(-60)); }
  const title=iLeft?L2("Abandonaste el partido","You left the match"):theyLeft?L2(`${rival} abandonó: ¡ganaste!`,`${rival} left: you win!`)
    :win?L2(`¡Le ganaste a ${rival}!`,`You beat ${rival}!`):draw?L2("Empate","Draw"):L2(`Ganó ${rival}`,`${rival} won`);
  app.innerHTML=`<div id="pal-on"><div class="result pop"><p class="eyebrow">Palin · ${L2("contra","vs")} ${esc(rival||"")}</p><h2>${esc(title)}</h2>
    <p class="score">${us} – ${them}</p><p>${t().score(right,st.n)}</p>
    ${earned?`<span class="gain">+${earned} ${NUT}</span>`:""}
    ${coach(win?`<b>¡${G(PRAISE[praiseIdx++ % PRAISE.length])}!</b>`:`<b>${t().keepB}</b>`, win)}</div>
    <div class="row"><a class="btn" href="trawun/?tab=palin">${L2("Otro partido en Trawün","Another match in Trawün")}</a><button class="btn ghost" id="pm">Palin</button></div></div>`;
  document.getElementById("pm").onclick=()=>{ OP=null; palin(); };
}

{ const pid=new URLSearchParams(location.search).get("palin");
  if(pid && /^g[a-z0-9]{10}$/.test(pid)) palinOnline(pid); else menu(); }   /* ?palin= stays until the match ends, so a reload rejoins it */

<button id="pwaInstall" hidden style="position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:#c8322f;color:#f3efe6;border:0;border-radius:999px;padding:12px 18px;font:700 1rem 'Atkinson Hyperlegible',system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer">Instalar la app</button>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* also install the dictionary's offline copy, so the dictionary opens without internet even if it was never opened
     online; done a few seconds after load so the game itself is not slowed */
  setTimeout(() => { navigator.serviceWorker.register('diccionario/sw.js', { scope: 'diccionario/' }).catch(()=>{}); }, 5000); }); }
/* Inside an installed app, a link to the other app (game <-> dictionary) would open in an in-app browser window, where
   Android cannot install it properly (it makes a Chrome shortcut, with the Chrome badge, that opens in the browser).
   Open such links outside instead: Android hands them to the other installed app, or to Chrome, where it can be installed. */
(function(){ const sa=()=>{ try{ return ["standalone","minimal-ui","fullscreen"].some(m=>matchMedia("(display-mode: "+m+")").matches)||navigator.standalone===true; }catch(e){ return false; } };
  document.addEventListener("click",ev=>{ const a=ev.target.closest&&ev.target.closest("a[href]"); if(!a||!sa()) return;
    const u=new URL(a.href,location.href); if(u.origin!==location.origin) return;
    if(!(/\/(diccionario|acerca|trawun)\//.test(u.pathname))) return; ev.preventDefault(); window.open(u.href,"_blank","noopener"); },true); })();
(function(){ let ev=null; const b=document.getElementById('pwaInstall');
  try{ if((localStorage.getItem('mpk_lang')||'').indexOf('en')>=0) b.textContent='Install the app'; }catch(e){}
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev=e; b.hidden=false; });
  b.addEventListener('click', async () => { if(!ev) return; ev.prompt(); try{ await ev.userChoice; }catch(e){} ev=null; b.hidden=true; });
  window.addEventListener('appinstalled', () => { b.hidden=true; });
})();
</script>
<script>
/* Visit, install and lesson counts sent to GoatCounter as a 1x1 image request (no cookies, no personal data, no third-party
   script, so script blockers that stop gc.zgo.at don't stop it). Nothing is sent from a file copy or while offline. */
(function(){
  if(location.protocol!=='https:') return;
  var BASE='https://brogers36.goatcounter.com/count';
  function gc(path,title,event){ try{
    var u=BASE+'?p='+encodeURIComponent(path)+'&t='+encodeURIComponent(title||'')+(event?'&e=true':'')+
      (event?'':'&r='+encodeURIComponent(document.referrer||''))+'&s='+encodeURIComponent(screen.width+','+screen.height+','+(window.devicePixelRatio||1))+
      '&rnd='+Math.random().toString(36).slice(2);
    var img=new Image(); img.src=u; }catch(e){} }
  window.mpkCount=function(p,t){ gc(p,t,true); };
  gc(location.pathname||'/', document.title, false);
  window.addEventListener('appinstalled',function(){ gc('app-installed','App installed',true); });
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  var seen=false; try{ seen=sessionStorage.getItem('mpk_gc_launch')==='1'; }catch(e){}
  if(standalone && !seen){ try{ sessionStorage.setItem('mpk_gc_launch','1'); }catch(e){} gc('home-screen-launch','Opened from home screen',true); }
})();
</script>
